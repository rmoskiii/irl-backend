<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"
     id="scene.flat_hallway" data-asset="scene.flat_hallway" data-time="evening"
     data-occlusion-line="600">
    <!-- IRX 2B.3 = scene.flat_hallway (evening). Second IRX environment.

         Carries 6 nodes, all of Act 2 plus act3b: act2_alex_reveal,
         act2_alex_checks_in, act2_probe_response, act2_pause_response,
         act2_pause_pressed, act3b_alex_told, act3b_alex_processes.

         Built to the locked craft language from scene.kitchen: explicit per-path
         stroke widths, long runs as gentle curves rather than h/v commands, 2-3
         tonal groupings per surface, surface irregularity as drawn marks, and the
         same three lighting gradients. Value range sits inside environment lock C.

         OCCLUSION: a console table along the wall at y=600, per the environment
         contract. Both figure bodies rest their hands at that height; a hallway
         with nothing there would leave them floating.

         Character: this is Alex's flat, not Jessica's kitchen. Warmer, narrower,
         more lived-in-by-one-person - a bike wheel by the door, post on the console,
         coats on hooks. The doorway behind him leads back to the party of the
         evening he has just pulled you out of. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        /* figure_b: same warm hazel family, one step deeper than figure_a */
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
        mouth with --irx-line reads as black lips. */
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* vignettes: montage panels only. Desaturated and reduced, so compressed
        time reads differently from present tense without a caption saying so.
        A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
        validate_assets.py rule 13. */
        --irx-vig-light:     #B3ABA0;
        --irx-vig-base:      #8C857C;
        --irx-vig-mid:       #635D56;
        --irx-vig-dark:      #3B3733;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln  { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .wall { fill: var(--irx-tile-alt); }
        .walld{ fill: var(--irx-cabinet); }
        .trim { fill: var(--irx-tile); }
        .trimd{ fill: var(--irx-tile-alt); }
        .cab  { fill: var(--irx-cabinet); }
        .cabd { fill: var(--irx-cabinet-dark); }
        .flr  { fill: var(--irx-floor); }
        .dark { fill: var(--irx-outside-dark); }
        .shad { fill: var(--irx-shadow); }
        .acc  { fill: var(--irx-accent); }
        .accd { fill: var(--irx-accent-dim); }
        .coat { fill: var(--irx-curtain); }
        .coatd{ fill: var(--irx-curtain-dark); }
    </style>

        <pattern id="h-paper" width="86" height="86" patternUnits="userSpaceOnUse">
            <path d="M20 66 q22 -34 46 -6" stroke="var(--irx-cabinet)" stroke-width="1.8"
                  fill="none" stroke-linecap="round" opacity="0.5"/>
        </pattern>

        <filter id="h-grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" seed="23" result="n"/>
            <feColorMatrix in="n" type="saturate" values="0"/>
        </filter>

        <radialGradient id="h-vignette" cx="50%" cy="44%" r="68%">
            <stop offset="40%" stop-color="#0E0B09" stop-opacity="0"/>
            <stop offset="100%" stop-color="#0E0B09" stop-opacity="0.7"/>
        </radialGradient>
        <radialGradient id="h-keylight" cx="30%" cy="4%" r="58%">
            <stop offset="0%"   stop-color="#F2C77E" stop-opacity="0.32"/>
            <stop offset="100%" stop-color="#F2C77E" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="h-doorglow" cx="62%" cy="42%" r="34%">
            <stop offset="0%"   stop-color="#F2C77E" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#F2C77E" stop-opacity="0"/>
        </radialGradient>
        <!-- three gradients, all lighting: key, spill from the lit room beyond, vignette -->
    </defs>

    <!-- ============================== background ============================== -->
    <g id="background">
        <path d="M0 0 h1600 v862 q-402 7 -800 0 q-398 -7 -800 2 z" class="wall"/>
        <path d="M0 0 h1600 v862 q-402 7 -800 0 q-398 -7 -800 2 z" fill="url(#h-paper)" opacity="0.34"/>
        <!-- tonal grouping 2: the hall darkens toward both ends -->
        <path d="M0 0 q140 3 260 -2 q-46 430 -22 862 q-124 4 -242 0 z" class="walld" opacity="0.44"/>
        <path d="M1600 0 q-150 3 -276 -2 q50 430 24 862 q130 4 256 0 z" class="walld" opacity="0.5"/>
        <!-- tonal grouping 3: below the picture rail sits a value down -->
        <path d="M0 402 q400 -6 800 -1 q400 5 800 -3 v460 q-402 7 -800 0 q-398 -7 -800 2 z"
              class="walld" opacity="0.26"/>
        <path class="ln" stroke-width="1.6" d="M300 210 q46 -8 84 4" opacity="0.1"/>
        <path class="ln" stroke-width="1.4" d="M1240 268 q40 7 74 -5" opacity="0.09"/>
    </g>

    <!-- ============================= architecture ============================= -->
    <g id="architecture">

        <!-- doorway through to the lit room, right of centre -->
        <g id="h-doorway">
            <path d="M978 92 q152 -4 300 2 q6 236 2 502 q-152 5 -304 0 q-4 -252 2 -504 z" class="dark"/>
            <path d="M998 112 q136 -4 268 2 q5 224 1 478 q-136 5 -272 0 q-3 -240 3 -480 z"
                  class="cabd" opacity="0.55"/>
            <!-- what is beyond: a warm room, softly indicated, nothing legible -->
            <path d="M1030 380 q104 -4 206 2 q2 96 0 190 q-104 4 -208 0 q-2 -96 2 -192 z"
                  class="cab" opacity="0.4"/>
            <path d="M1060 300 q40 -3 78 2 q2 34 0 68 q-40 3 -80 -1 z" class="accd" opacity="0.3"/>
            <path class="ln" stroke-width="6.2" d="M978 92 q152 -4 300 2 q6 236 2 502 q-152 5 -304 0 q-4 -252 2 -504 z"/>
            <path class="ln" stroke-width="3.0" d="M998 112 q136 -4 268 2 q5 224 1 478" opacity="0.8"/>
            <!-- architrave -->
            <path d="M960 78 q170 -5 336 3 q3 10 1 20 q-170 -6 -338 0 z" class="trimd"/>
            <path class="ln" stroke-width="3.4" d="M960 78 q170 -5 336 3 q3 10 1 20 q-170 -6 -338 0 z"/>
        </g>

        <!-- picture rail running the length of the hall -->
        <g id="h-rail">
            <path d="M0 396 q240 -6 480 -1 q240 5 478 -3 v12 q-240 6 -478 1 q-240 -5 -480 3 z" class="trimd"/>
            <path class="ln" stroke-width="3.2" d="M0 396 q240 -6 480 -1 q240 5 478 -3"/>
        </g>

        <!-- coat hooks and coats, left -->
        <g id="h-hooks">
            <path d="M64 292 q104 -4 206 2 q2 9 0 18 q-104 -5 -208 1 z" class="cabd"/>
            <path class="ln" stroke-width="3.4" d="M64 292 q104 -4 206 2 q2 9 0 18 q-104 -5 -208 1 z"/>
            <path class="ln" stroke-width="4.0" d="M112 310 q-2 12 6 18"/>
            <path class="ln" stroke-width="4.0" d="M182 310 q-2 12 6 18"/>
            <path class="ln" stroke-width="4.0" d="M252 310 q-2 12 6 18"/>
            <!-- a coat and a jacket, hanging -->
            <path d="M140 330 q34 -10 62 6 q22 62 16 138 q-4 44 -14 74 q-38 12 -76 0
             q-10 -34 -12 -78 q-4 -76 24 -140 z" class="coat"/>
            <path d="M140 330 q34 -10 62 6 q10 30 14 66 q-38 12 -76 0 q-2 -38 0 -72 z"
                  class="coatd" opacity="0.5"/>
            <path class="ln" stroke-width="5.0" d="M140 330 q34 -10 62 6 q22 62 16 138 q-4 44 -14 74
                                           q-38 12 -76 0 q-10 -34 -12 -78 q-4 -76 24 -140 z"/>
            <path class="ln" stroke-width="1.8" d="M168 348 q6 88 2 172" opacity="0.4"/>
            <path d="M234 334 q30 -8 54 6 q18 56 14 124 q-3 40 -12 66 q-34 10 -66 0
             q-9 -30 -11 -70 q-3 -68 21 -126 z" class="cabd"/>
            <path class="ln" stroke-width="4.6" d="M234 334 q30 -8 54 6 q18 56 14 124 q-3 40 -12 66
                                           q-34 10 -66 0 q-9 -30 -11 -70 q-3 -68 21 -126 z"/>
            <path class="ln" stroke-width="1.6" d="M258 352 q5 74 2 146" opacity="0.35"/>
        </g>

        <!-- mirror above the console, left of the doorway -->
        <g id="h-mirror">
            <path d="M436 176 q88 -4 174 2 q3 68 0 138 q-88 4 -176 0 q-3 -72 2 -140 z" class="trimd"/>
            <path d="M452 192 q74 -3 146 2 q2 56 0 112 q-74 3 -148 0 q-2 -60 2 -114 z" class="walld"/>
            <path d="M452 192 q74 -3 146 2 q1 22 0 44 q-74 3 -148 0 q-1 -24 2 -46 z"
                  class="wall" opacity="0.45"/>
            <path class="ln" stroke-width="5.4" d="M436 176 q88 -4 174 2 q3 68 0 138 q-88 4 -176 0 q-3 -72 2 -140 z"/>
            <path class="ln" stroke-width="2.4" d="M452 192 q74 -3 146 2 q2 56 0 112 q-74 3 -148 0 q-2 -60 2 -114 z"/>
            <path class="ln" stroke-width="1.6" d="M472 288 q46 -30 92 -74" opacity="0.18"/>
        </g>
    </g>

    <!-- ========================= environmental_detail ========================= -->
    <g id="environmental_detail">
        <!-- post and keys on the console -->
        <g id="h-post">
            <path d="M446 566 q56 -6 106 2 q1 16 0 32 q-56 5 -108 -2 z" class="trim"/>
            <path class="ln" stroke-width="2.4" d="M446 566 q56 -6 106 2 q1 16 0 32 q-56 5 -108 -2 z"/>
            <path class="ln" stroke-width="1.6" d="M452 582 q52 -4 96 2" opacity="0.5"/>
            <path d="M580 574 q30 -4 58 2 q1 12 0 24 q-30 4 -60 -2 z" class="trimd"/>
            <path class="ln" stroke-width="2.2" d="M580 574 q30 -4 58 2 q1 12 0 24 q-30 4 -60 -2 z"/>
        </g>
        <!-- a bowl, and a bike wheel leaning by the door -->
        <path d="M1310 560 q-8 32 4 38 h54 q12 -6 4 -38 z" class="cabd"/>
        <path class="ln" stroke-width="2.6" d="M1310 560 q-8 32 4 38 h54 q12 -6 4 -38 z"/>
        <path class="ln" stroke-width="2.0" d="M1306 560 q42 -6 82 1" opacity="0.6"/>
        <g id="h-wheel" opacity="0.9">
            <path class="ln" stroke-width="4.4" d="M1424 470 q66 0 66 66 q0 66 -66 66 q-66 0 -66 -66 q0 -66 66 -66 z"/>
            <path class="ln" stroke-width="1.6" d="M1424 470 v132" opacity="0.5"/>
            <path class="ln" stroke-width="1.6" d="M1358 536 h132" opacity="0.5"/>
            <path class="ln" stroke-width="1.6" d="M1378 490 l92 92" opacity="0.4"/>
            <path class="ln" stroke-width="1.6" d="M1470 490 l-92 92" opacity="0.4"/>
        </g>
        <!-- the doorway throws light onto the wall and floor -->
        <path d="M978 92 q40 260 26 508 h-60 q10 -256 -8 -508 z" class="acc" opacity="0.06"/>
    </g>

    <!-- ============================== furniture =============================== -->
    <g id="furniture">
        <!-- console table: the occluding surface required at y=600 -->
        <path d="M0 596 q400 -5 800 0 q400 5 800 -3 v40 q-402 6 -800 1 q-398 -5 -800 3 z" class="cabd"/>
        <path d="M0 596 q400 -5 800 0 q400 5 800 -3 v20 q-402 6 -800 1 q-398 -5 -800 3 z" class="cab"/>
        <path d="M0 596 q400 -5 800 0 q400 5 800 -3 v7 q-402 6 -800 1 q-398 -5 -800 3 z"
              class="trim" opacity="0.14"/>
        <path class="ln" stroke-width="6.8" d="M0 596 q400 -5 800 0 q400 5 800 -3"/>
        <path class="ln" stroke-width="3.0" d="M0 638 q400 -5 800 0 q400 5 800 -3"/>
        <path class="ln" stroke-width="1.8" d="M368 602 q18 5 34 -2" opacity="0.35"/>
        <path class="ln" stroke-width="1.4" d="M1046 604 q22 4 38 -3" opacity="0.28"/>

        <!-- apron and legs -->
        <path d="M0 630 q400 -5 800 0 q400 5 800 -3 v64 q-402 6 -800 0 q-398 -6 -800 2 z" class="cabd"/>
        <path class="ln" stroke-width="2.4" d="M0 692 q400 -5 800 0 q400 5 800 -3" opacity="0.7"/>
        <!-- Recess beneath the console. The occluding surface has to run unbroken from
             the top down to the skirting: with open legs, a standing figure showed
             through the gap between the apron and the skirting (y690-782). The legs
             below still read, as strokes over the recess. -->
        <path d="M0 690 q400 -5 800 0 q400 5 800 -3 v98 q-402 6 -800 0 q-398 -6 -800 2 z" class="cabd"/>
        <path d="M0 690 q400 -5 800 0 q400 5 800 -3 v36 q-402 6 -800 0 q-398 -6 -800 2 z"
              class="shad" opacity="0.4"/>
        <path class="ln" stroke-width="5.6" d="M172 694 q-4 44 -2 88"/>
        <path class="ln" stroke-width="5.6" d="M636 694 q-3 44 -1 88"/>
        <path class="ln" stroke-width="5.0" d="M1428 694 q4 44 2 88"/>

        <!-- skirting and floor -->
        <path d="M0 782 q400 -5 800 0 q400 5 800 -3 v20 q-402 6 -800 0 q-398 -6 -800 2 z" class="trimd"/>
        <path class="ln" stroke-width="3.4" d="M0 782 q400 -5 800 0 q400 5 800 -3"/>
        <path d="M0 800 q400 -5 800 0 q400 5 800 -3 v103 h-1600 z" class="flr"/>
        <path class="ln" stroke-width="3.4" d="M0 800 q400 -5 800 0 q400 5 800 -3"/>
        <!-- floorboards, running away down the hall -->
        <g class="ln" stroke-width="1.6" opacity="0.28">
            <path d="M240 900 q14 -50 30 -98"/>
            <path d="M600 900 q6 -50 12 -98"/>
            <path d="M1000 900 q-6 -50 -12 -98"/>
            <path d="M1360 900 q-14 -50 -30 -98"/>
        </g>
    </g>

    <!-- ============================== foreground ============================== -->
    <g id="foreground">
        <rect x="0" y="0" width="1600" height="900" fill="url(#h-keylight)" pointer-events="none"/>
        <rect x="0" y="0" width="1600" height="900" fill="url(#h-doorglow)" pointer-events="none"/>
        <rect x="0" y="0" width="1600" height="900" fill="url(#h-vignette)" pointer-events="none"/>
        <rect x="0" y="0" width="1600" height="900" filter="url(#h-grain)" opacity="0.10"
              style="mix-blend-mode:multiply" pointer-events="none"/>
    </g>
</svg>