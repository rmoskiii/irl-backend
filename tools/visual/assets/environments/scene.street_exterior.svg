<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"
     id="scene.street_exterior" data-asset="scene.street_exterior" data-time="night"
     data-occlusion-line="600">
<!-- IRX 2B.3 = scene.street_exterior (night). Fourth IRX environment.

     Carries 2 nodes, and they are the two loneliest in the scenario:
       act3b_jessica_calls   - mode `remote`. You are on the pavement outside
                               Alex's flat and Jessica is a voice on the phone.
                               No figure at all; the room does the whole scene.
       act4_avoidant_outside - mode `scene`, framing `turned`. She has found you
                               outside the engagement party, halfway through a
                               cigarette she does not smoke.

     Because one of its two nodes has NO character, this environment has to hold
     a frame on its own. It is the only one of the four that does.

     OCCLUSION: a low boundary wall at y=600 per the environment contract. Both
     nodes happen standing at it - it is the thing you lean on outside a party.

     NIGHT. The darkest environment in the set. Two warm sources: a fire door
     leaking light and noise from the party, and a streetlamp off to the left.
     Everything between them sits in the dark, which is the point. -->
<defs><style>
/* @tokens-begin */
:root {
  /* line */
  --irx-line:          #241D19;
  --irx-line-soft:     #3B302A;
  --irx-shadow:        #2A231E;

  /* architecture */
  --irx-wall:          #5C6A5F;
  --irx-wall-dark:     #4E5A51;
  --irx-wall-pattern:  #556359;
  --irx-tile:          #B5A992;
  --irx-tile-alt:      #A49980;
  --irx-floor:         #5E4D3E;

  /* window */
  --irx-sky-high:      #334051;
  --irx-sky-mid:       #4D4656;
  --irx-sky-low:       #785A4F;
  --irx-outside-dark:  #2A333E;
  --irx-curtain:       #424E56;
  --irx-curtain-dark:  #38424A;

  /* joinery */
  --irx-cabinet:       #785D44;
  --irx-cabinet-dark:  #634C36;
  --irx-counter:       #947553;
  --irx-counter-edge:  #7B5F43;

  /* character */
  --irx-skin:          #A87A5A;
  --irx-skin-shade:    #875D42;
  /* figure_b: same warm hazel family, one step deeper than figure_a */
  --irx-skin-b:        #8E6244;
  --irx-skin-b-shade:  #6E4A32;
  /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
     mouth with --irx-line reads as black lips. */
  --irx-lip-b:         #96604F;
  --irx-mouth-b:       #4A2C24;
  --irx-hair:          #41322A;
  --irx-hair-light:    #554136;
  /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
  --irx-hair-b:        #241A16;
  --irx-hair-b-light:  #3D2C24;

  /* wardrobe: home_casual */
  --irx-cloth:         #A8603F;
  --irx-cloth-dark:    #894C31;
  --irx-cloth-inner:   #D9CDBC;

  /* props */
  --irx-glass:         #BCC8C3;
  --irx-glass-dark:    #9AA8A2;
  --irx-highlight:     #FFFFFF;
  --irx-jacket:        #4F5A63;
  --irx-jacket-dark:   #3D464E;

  /* accent — neighbourhood district, warm light only */
  --irx-accent:        #FFC15E;
  --irx-accent-dim:    #C89A4E;
  --irx-lamp-warm:     #F2C77E;
  --irx-cool-spill:    #7E93A8;

  /* vignettes: montage panels only. Desaturated and reduced, so compressed
     time reads differently from present tense without a caption saying so.
     A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
     validate_assets.py rule 13. */
  --irx-vig-light:     #B3ABA0;
  --irx-vig-base:      #8C857C;
  --irx-vig-mid:       #635D56;
  --irx-vig-dark:      #3B3733;

  /* stroke weights */
  --irx-stroke-xheavy: 6.6;
  --irx-stroke-heavy:  5;
  --irx-stroke:        3.4;
  --irx-stroke-fine:   2.1;
  --irx-stroke-hair:   1.4;
}
/* @tokens-end */
.ln    { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.sky   { fill: var(--irx-sky-high); }
.skyd  { fill: var(--irx-outside-dark); }
.brick { fill: var(--irx-curtain-dark); }
.brickd{ fill: var(--irx-outside-dark); }
.wall  { fill: var(--irx-cabinet-dark); }
.walld { fill: var(--irx-shadow); }
.pave  { fill: var(--irx-curtain-dark); }
.paved { fill: var(--irx-outside-dark); }
.dark  { fill: var(--irx-outside-dark); }
.acc   { fill: var(--irx-accent); }
.accd  { fill: var(--irx-accent-dim); }
.glass { fill: var(--irx-sky-mid); }
</style>

<filter id="s-grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="61" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0"/>
</filter>

<radialGradient id="s-vignette" cx="50%" cy="46%" r="66%">
  <stop offset="30%" stop-color="#070906" stop-opacity="0"/>
  <stop offset="100%" stop-color="#070906" stop-opacity="0.82"/>
</radialGradient>
<radialGradient id="s-doorlight" cx="72%" cy="52%" r="34%">
  <stop offset="0%"   stop-color="#F2C77E" stop-opacity="0.34"/>
  <stop offset="100%" stop-color="#F2C77E" stop-opacity="0"/>
</radialGradient>
<radialGradient id="s-lamp" cx="14%" cy="14%" r="40%">
  <stop offset="0%"   stop-color="#F2C77E" stop-opacity="0.20"/>
  <stop offset="100%" stop-color="#F2C77E" stop-opacity="0"/>
</radialGradient>
<!-- three gradients, all lighting: fire door, streetlamp, vignette. The
     vignette is the strongest in the set because this is the only night scene. -->
</defs>

<!-- ============================== background ============================== -->
<g id="background">
  <path d="M0 0 h1600 v560 q-402 7 -800 0 q-398 -7 -800 2 z" class="sky"/>
  <path d="M0 0 h1600 v260 q-402 7 -800 0 q-398 -7 -800 2 z" class="skyd" opacity="0.6"/>
  <!-- rooftops opposite, kept low-contrast: nothing over there should compete -->
  <path d="M0 300 h130 v-52 h96 v52 h74 v-84 h122 v84 h88 v-40 h150 v40 h104 v-66 h140 v66
           h96 v-46 h180 v46 h130 v-58 h190 v58 h100 v270 h-1600 z" class="skyd"/>
  <!-- a few lit windows across the road -->
  <g class="accd" opacity="0.4">
    <path d="M178 268 h16 v22 h-16 z"/><path d="M420 236 h14 v20 h-14 z"/>
    <path d="M868 262 h15 v20 h-15 z"/><path d="M1188 252 h14 v20 h-14 z"/>
  </g>
  <g class="accd" opacity="0.22">
    <path d="M256 274 h14 v18 h-14 z"/><path d="M1032 258 h13 v18 h-13 z"/>
  </g>
</g>

<!-- ============================= architecture ============================= -->
<g id="architecture">

  <!-- the venue wall behind, running the width -->
  <g id="s-venue">
    <path d="M0 96 q400 -6 800 -1 q400 5 800 -3 v470 q-402 7 -800 0 q-398 -7 -800 2 z" class="brick"/>
    <path d="M0 96 q400 -6 800 -1 q400 5 800 -3 v22 q-402 7 -800 1 q-398 -6 -800 3 z"
          class="brickd" opacity="0.5"/>
    <!-- brick courses: drawn, uneven, low contrast -->
    <g class="ln" stroke-width="1.6" opacity="0.24">
      <path d="M0 190 q400 -6 800 -1 q400 5 800 -3"/>
      <path d="M0 286 q400 -5 800 0 q400 5 800 -3"/>
      <path d="M0 382 q400 -6 800 -1 q400 5 800 -3"/>
      <path d="M0 478 q400 -5 800 0 q400 5 800 -3"/>
    </g>
    <path class="ln" stroke-width="4.6" d="M0 96 q400 -6 800 -1 q400 5 800 -3"/>
  </g>

  <!-- fire door, right of centre: propped, light and noise leaking out -->
  <g id="s-firedoor">
    <path d="M1044 168 q136 -4 268 3 q5 202 1 428 q-136 5 -272 0 q-4 -216 3 -431 z" class="dark"/>
    <!-- the door is open a hand's width; this wedge is the light from inside -->
    <path d="M1044 168 q40 -1 76 2 q4 202 1 428 q-40 2 -80 0 q-4 -216 3 -430 z" class="acc" opacity="0.5"/>
    <path d="M1058 200 q26 -1 50 2 q3 168 1 356 q-26 2 -52 0 q-3 -180 1 -358 z" class="acc" opacity="0.35"/>
    <path class="ln" stroke-width="6.2" d="M1044 168 q136 -4 268 3 q5 202 1 428 q-136 5 -272 0 q-4 -216 3 -431 z"/>
    <path class="ln" stroke-width="4.0" d="M1120 170 q4 214 1 430" opacity="0.9"/>
    <path class="ln" stroke-width="3.0" d="M1256 380 q-2 16 0 30"/>
    <!-- frame -->
    <path d="M1026 152 q152 -4 300 3 q3 10 1 20 q-152 -5 -302 1 z" class="walld"/>
    <path class="ln" stroke-width="3.4" d="M1026 152 q152 -4 300 3 q3 10 1 20 q-152 -5 -302 1 z"/>
  </g>

  <!-- streetlamp, far left, throwing the cool secondary light -->
  <g id="s-lamp">
    <path class="ln" stroke-width="6.0" d="M96 100 q-4 240 -2 480"/>
    <path d="M52 62 q46 -16 92 0 q-10 40 -46 42 q-36 -2 -46 -42 z" class="walld"/>
    <path d="M62 70 q38 -12 74 0 q-8 28 -37 30 q-29 -2 -37 -30 z" class="accd" opacity="0.65"/>
    <path class="ln" stroke-width="4.0" d="M52 62 q46 -16 92 0 q-10 40 -46 42 q-36 -2 -46 -42 z"/>
  </g>

  <!-- a downpipe, because a blank brick wall is not a place -->
  <path class="ln" stroke-width="5.0" d="M718 100 q-3 244 -1 488" opacity="0.7"/>
  <path class="ln" stroke-width="3.0" d="M700 306 q20 6 38 -2" opacity="0.6"/>
  <path class="ln" stroke-width="3.0" d="M700 470 q20 6 38 -2" opacity="0.6"/>
</g>

<!-- ========================= environmental_detail ========================= -->
<g id="environmental_detail">
  <!-- the light from the door lands on the wall and the pavement -->
  <path d="M1312 168 q90 200 116 432 h-150 q-24 -240 -70 -432 z" class="acc" opacity="0.07"/>
  <!-- a stubbed-out pile by the wall: people have been standing here all night -->
  <g class="ln" stroke-width="2.0" opacity="0.4">
    <path d="M470 566 q14 -5 26 1"/>
    <path d="M506 574 q12 -4 22 1"/>
    <path d="M486 582 q13 -4 24 1"/>
  </g>
  <!-- a bin, far right, mostly in shadow -->
  <path d="M1436 452 q66 -6 128 2 q6 74 2 146 q-66 5 -132 -2 z" class="walld" opacity="0.8"/>
  <path class="ln" stroke-width="4.0" d="M1436 452 q66 -6 128 2 q6 74 2 146 q-66 5 -132 -2 z"/>
  <path class="ln" stroke-width="3.0" d="M1428 452 q70 -8 144 2" opacity="0.85"/>
</g>

<!-- ============================== furniture =============================== -->
<g id="furniture">
  <!-- low boundary wall: the occluding surface required at y=600 -->
  <path d="M0 596 q400 -5 800 0 q400 5 800 -3 v46 q-402 6 -800 1 q-398 -5 -800 3 z" class="wall"/>
  <path d="M0 596 q400 -5 800 0 q400 5 800 -3 v12 q-402 6 -800 1 q-398 -5 -800 3 z"
        class="walld" opacity="0.5"/>
  <path class="ln" stroke-width="6.8" d="M0 596 q400 -5 800 0 q400 5 800 -3"/>
  <path class="ln" stroke-width="2.6" d="M0 642 q400 -5 800 0 q400 5 800 -3" opacity="0.75"/>
  <path class="ln" stroke-width="1.6" d="M344 606 q18 5 34 -2" opacity="0.3"/>
  <path class="ln" stroke-width="1.4" d="M1152 608 q22 4 38 -3" opacity="0.26"/>

  <!-- coping stones: the wall reads as brick, not a slab -->
  <path d="M0 640 q400 -5 800 0 q400 5 800 -3 v120 q-402 6 -800 0 q-398 -6 -800 2 z" class="walld"/>
  <g class="ln" stroke-width="2.0" opacity="0.4">
    <path d="M212 646 q3 56 1 112"/><path d="M540 646 q3 56 1 112"/>
    <path d="M868 646 q3 56 1 112"/><path d="M1196 646 q3 56 1 112"/>
  </g>
  <path class="ln" stroke-width="2.2" d="M0 702 q400 -5 800 0 q400 5 800 -3" opacity="0.35"/>

  <!-- pavement -->
  <path d="M0 756 q400 -5 800 0 q400 5 800 -3 v147 h-1600 z" class="pave"/>
  <path class="ln" stroke-width="3.4" d="M0 756 q400 -5 800 0 q400 5 800 -3"/>
  <g class="ln" stroke-width="1.8" opacity="0.26">
    <path d="M300 900 q10 -66 22 -140"/>
    <path d="M660 900 q4 -66 8 -140"/>
    <path d="M980 900 q-4 -66 -8 -140"/>
    <path d="M1340 900 q-10 -66 -22 -140"/>
  </g>
  <path class="ln" stroke-width="1.6" d="M0 828 q400 -4 800 0 q400 4 800 -2" opacity="0.22"/>
</g>

<!-- ============================== foreground ============================== -->
<g id="foreground">
  <rect x="0" y="0" width="1600" height="900" fill="url(#s-doorlight)" pointer-events="none"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#s-lamp)" pointer-events="none"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#s-vignette)" pointer-events="none"/>
  <rect x="0" y="0" width="1600" height="900" filter="url(#s-grain)" opacity="0.12"
        style="mix-blend-mode:multiply" pointer-events="none"/>
</g>
</svg>
