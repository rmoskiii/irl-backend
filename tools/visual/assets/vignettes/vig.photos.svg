<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600"
     id="vig.photos" data-asset="vig.photos" data-kind="vignette">
    <!-- IRX 2B.5 = vig.photos.

         act4_avoidant_proposal, panel 2: "The photos go up that evening. You look at
         them longer than you'd admit to."

         A grid of posts. One of them - the ring - carries the only accent in the
         panel, because that is the one you kept looking at.

         VIGNETTE RULES: reduced detail, desaturated, amber retained as the only
         colour. Deliberately NOT a full environment - a montage panel that competed
         with scene.kitchen would flatten the distinction between memory and now.
         Palette restricted to the irx-vig-* ramp plus line and accent. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        /* figure_b: same warm hazel family, one step deeper than figure_a */
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
        mouth with --irx-line reads as black lips. */
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* vignettes: montage panels only. Desaturated and reduced, so compressed
        time reads differently from present tense without a caption saying so.
        A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
        validate_assets.py rule 13. */
        --irx-vig-light:     #B3ABA0;
        --irx-vig-base:      #8C857C;
        --irx-vig-mid:       #635D56;
        --irx-vig-dark:      #3B3733;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .l  { fill: var(--irx-vig-light); }
        .b  { fill: var(--irx-vig-base); }
        .m  { fill: var(--irx-vig-mid); }
        .d  { fill: var(--irx-vig-dark); }
        .a  { fill: var(--irx-accent); }
    </style></defs>

    <g id="vignette">
        <path d="M0 0 h480 v600 h-480 z" class="m"/>
        <g class="b">
            <path d="M40 60 h122 v122 h-122 z"/><path d="M180 60 h122 v122 h-122 z"/>
            <path d="M320 60 h122 v122 h-122 z"/>
            <path d="M40 200 h122 v122 h-122 z"/><path d="M320 200 h122 v122 h-122 z"/>
            <path d="M40 340 h122 v122 h-122 z"/><path d="M180 340 h122 v122 h-122 z"/>
            <path d="M320 340 h122 v122 h-122 z"/>
        </g>
        <!-- the ring shot, centre, the only colour on the screen -->
        <path d="M180 200 h122 v122 h-122 z" class="l"/>
        <circle cx="241" cy="258" r="30" fill="none" stroke="var(--irx-accent)" stroke-width="7"/>
        <circle cx="241" cy="228" r="9" class="a"/>
        <g class="ln" stroke-width="2.6" opacity="0.7">
            <path d="M40 60 h122 v122 h-122 z"/><path d="M180 60 h122 v122 h-122 z"/>
            <path d="M320 60 h122 v122 h-122 z"/>
            <path d="M40 200 h122 v122 h-122 z"/><path d="M180 200 h122 v122 h-122 z"/>
            <path d="M320 200 h122 v122 h-122 z"/>
            <path d="M40 340 h122 v122 h-122 z"/><path d="M180 340 h122 v122 h-122 z"/>
            <path d="M320 340 h122 v122 h-122 z"/>
        </g>
        <g class="d" opacity="0.5">
            <path d="M62 130 q40 -40 78 0 v52 h-78 z"/><path d="M202 130 q40 -40 78 0 v52 h-78 z"/>
            <path d="M342 130 q40 -40 78 0 v52 h-78 z"/><path d="M62 270 q40 -40 78 0 v52 h-78 z"/>
            <path d="M342 270 q40 -40 78 0 v52 h-78 z"/><path d="M62 410 q40 -40 78 0 v52 h-78 z"/>
            <path d="M202 410 q40 -40 78 0 v52 h-78 z"/><path d="M342 410 q40 -40 78 0 v52 h-78 z"/>
        </g>
        <g class="ln" stroke-width="2.2" opacity="0.4">
            <path d="M40 500 h180"/><path d="M40 528 h120"/>
        </g>
    </g>
</svg>