<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600"
     id="vig.hospital_night" data-asset="vig.hospital_night" data-kind="vignette">
    <!-- IRX 2B.5 = vig.hospital_night.

         establish, beat 1: "She picked you up at 2am the night your mum went into
         hospital." A corridor at 2am - a row of empty chairs, one lit doorway, and
         nobody in it. The friendship's opening deposit, paid years before the
         scenario starts.

         VIGNETTE RULES: reduced detail, desaturated, amber retained as the only
         colour. Deliberately NOT a full environment - a montage panel that competed
         with scene.kitchen would flatten the distinction between memory and now.
         Palette restricted to the irx-vig-* ramp plus line and accent. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        /* figure_b: same warm hazel family, one step deeper than figure_a */
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
        mouth with --irx-line reads as black lips. */
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* vignettes: montage panels only. Desaturated and reduced, so compressed
        time reads differently from present tense without a caption saying so.
        A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
        validate_assets.py rule 13. */
        --irx-vig-light:     #B3ABA0;
        --irx-vig-base:      #8C857C;
        --irx-vig-mid:       #635D56;
        --irx-vig-dark:      #3B3733;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .l  { fill: var(--irx-vig-light); }
        .b  { fill: var(--irx-vig-base); }
        .m  { fill: var(--irx-vig-mid); }
        .d  { fill: var(--irx-vig-dark); }
        .a  { fill: var(--irx-accent); }
    </style></defs>

    <g id="vignette">
        <path d="M0 0 h480 v600 h-480 z" class="d"/>
        <path d="M0 380 h480 v220 h-480 z" class="m" opacity="0.6"/>
        <path class="ln" stroke-width="3.0" d="M0 380 q240 -6 480 0" opacity="0.5"/>
        <!-- lit doorway, the only warm thing here -->
        <path d="M286 128 h110 v256 h-110 z" class="b"/>
        <path d="M296 140 h90 v240 h-90 z" class="a" opacity="0.34"/>
        <path class="ln" stroke-width="3.4" d="M286 128 h110 v256 h-110 z"/>
        <!-- a row of chairs, nobody in them -->
        <g class="ln" stroke-width="3.0" opacity="0.75">
            <path d="M40 300 h68 v80 h-68 z"/><path d="M120 300 h68 v80 h-68 z"/>
            <path d="M200 300 h68 v80 h-68 z"/>
            <path d="M40 340 h228"/>
        </g>
        <!-- strip light overhead -->
        <path d="M120 40 h240 v14 h-240 z" class="l" opacity="0.7"/>
        <path d="M120 40 h240 v14 h-240 z" class="a" opacity="0.14"/>
        <path class="ln" stroke-width="2.4" d="M120 40 h240 v14 h-240 z"/>
    </g>
</svg>