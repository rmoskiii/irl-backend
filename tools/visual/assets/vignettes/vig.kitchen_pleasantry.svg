<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600"
     id="vig.kitchen_pleasantry" data-asset="vig.kitchen_pleasantry" data-kind="vignette" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <!-- IRX 2B.9 = vig.kitchen_pleasantry. Panel 2 of 3, no caption.

         TOKEN BLOCK: ships with the Career set only. Run inject_tokens.py after
         adding this file.

         One of three panels for ask2_refuse_response, the montage of absences: the
         beat where you said no and nothing happened to you, visibly. Three panels
         and not four, because anchors.montage fixes panelWidth 440 and gap 48 and
         four would span 1904 on a 1600 canvas.

         RAY IS PERFECTLY FRIENDLY IN THE KITCHEN. Two people turned toward each
         other over a counter, and nothing in the panel is unpleasant. That is the
         difficulty of the beat: the absence is what is not being asked, and an
         amicable two-shot is the honest way to draw it. This is the panel that
         carries no caption, because a caption would explain the thing the image is
         deliberately not saying.

         PALETTE IS THE VIGNETTE RAMP AND THE LINE, NOTHING ELSE. validate_assets
         rule 13 allows vig-light, vig-base, vig-mid, vig-dark, line and accent. The
         Career accent is a different token from the one that rule names, so this
         panel uses no accent at all rather than asking the validator to change. The
         four-step ramp is enough: these are compressed time, and they are supposed
         to read as reduced.

         NO FACES. The figures are silhouettes because a vignette that draws a face
         is asserting who it was, and the whole point of this montage is that the
         people in it are not identified and one of them is not you.

         GEOMETRY: 480x600 source, scaled to the 440x550 panel by anchors.montage.
         At 390pt each panel is about 107pt wide, so every shape here is sized to
         survive that and nothing depends on a detail smaller than a head.
    -->
    <defs><style>
        /* @tokens-begin */
:root {
  /* line */
  --irx-line:          #241D19;
  --irx-line-soft:     #3B302A;
  --irx-shadow:        #2A231E;

  /* architecture */
  --irx-wall:          #5C6A5F;
  --irx-wall-dark:     #4E5A51;
  --irx-wall-pattern:  #556359;
  --irx-tile:          #B5A992;
  --irx-tile-alt:      #A49980;
  --irx-floor:         #5E4D3E;

  /* window */
  --irx-sky-high:      #334051;
  --irx-sky-mid:       #4D4656;
  --irx-sky-low:       #785A4F;
  --irx-outside-dark:  #2A333E;
  --irx-curtain:       #424E56;
  --irx-curtain-dark:  #38424A;

  /* joinery */
  --irx-cabinet:       #785D44;
  --irx-cabinet-dark:  #634C36;
  --irx-counter:       #947553;
  --irx-counter-edge:  #7B5F43;

  /* character */
  --irx-skin:          #A87A5A;
  --irx-skin-shade:    #875D42;
  /* figure_b: same warm hazel family, one step deeper than figure_a */
  --irx-skin-b:        #8E6244;
  --irx-skin-b-shade:  #6E4A32;
  /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
     mouth with --irx-line reads as black lips. */
  --irx-lip-b:         #96604F;
  --irx-mouth-b:       #4A2C24;
  --irx-hair:          #41322A;
  --irx-hair-light:    #554136;
  /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
  --irx-hair-b:        #241A16;
  --irx-hair-b-light:  #3D2C24;

  /* wardrobe: home_casual */
  --irx-cloth:         #A8603F;
  --irx-cloth-dark:    #894C31;
  --irx-cloth-inner:   #D9CDBC;

  /* props */
  --irx-glass:         #BCC8C3;
  --irx-glass-dark:    #9AA8A2;
  --irx-highlight:     #FFFFFF;
  --irx-jacket:        #4F5A63;
  --irx-jacket-dark:   #3D464E;

  /* accent — neighbourhood district, warm light only */
  --irx-accent:        #FFC15E;
  --irx-accent-dim:    #C89A4E;
  --irx-lamp-warm:     #F2C77E;
  --irx-cool-spill:    #7E93A8;

  /* vignettes: montage panels only. Desaturated and reduced, so compressed
     time reads differently from present tense without a caption saying so.
     A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
     validate_assets.py rule 13. */
  --irx-vig-light:     #B3ABA0;
  --irx-vig-base:      #8C857C;
  --irx-vig-mid:       #635D56;
  --irx-vig-dark:      #3B3733;

  /* stroke weights */
  --irx-stroke-xheavy: 6.6;
  --irx-stroke-heavy:  5;
  --irx-stroke:        3.4;
  --irx-stroke-fine:   2.1;
  --irx-stroke-hair:   1.4;

  /* ==== career district ==== */
/* career: architecture */
--irx-career-wall:          #6E757E;
--irx-career-wall-dark:     #5C636B;
--irx-career-wall-pattern:  #666D76;
--irx-career-partition:     #58606A;
--irx-career-partition-dark:#4A5158;
--irx-career-floor:         #4A4F55;
/* career: window, evening. The office is lit; outside is not. */
--irx-career-sky-high:      #1E2836;
--irx-career-sky-mid:       #26303D;
--irx-career-sky-low:       #2E3444;
--irx-career-outside-dark:  #161C25;
/* career: joinery */
--irx-career-desk:          #8A8478;
--irx-career-desk-edge:     #6F6A60;
--irx-career-desk-dark:     #5E5A52;
--irx-career-metal:         #7A828A;
--irx-career-metal-dark:    #626A72;
/* career: light. Overhead fluorescent and one screen. */
--irx-career-fluoro:        #E8EDF2;
--irx-career-fluoro-dim:    #A8B2BC;
--irx-career-screen:        #6E93A8;
--irx-career-screen-glow:   #9FC4D8;
/* career: figure_c (Ray) */
--irx-career-skin-c:        #D9A886;
--irx-career-skin-c-shade:  #B98565;
--irx-career-hair-c:        #6E655C;
--irx-career-hair-c-light:  #8A8076;
--irx-career-lip-c:         #B57F66;
--irx-career-mouth-c:       #6B4436;
/* career: figure_d (Dana) */
--irx-career-skin-d:        #E0B294;
--irx-career-skin-d-shade:  #BE8D6F;
--irx-career-hair-d:        #4A4038;
--irx-career-hair-d-light:  #6A5C50;
/* career: wardrobe work */
--irx-career-shirt-c:       #9FA9B4;
--irx-career-shirt-c-dark:  #7E8894;
--irx-career-shirt-c-fold:  #6B7480;
/* career: wardrobe work_coat */
--irx-career-coat-c:        #4E5661;
--irx-career-coat-c-dark:   #3C434D;
--irx-career-coat-c-fold:   #5C6570;
/* career: accent. Matches district_theme.dart Career accent 0xFF7EA6DB. */
--irx-career-accent:        #7EA6DB;
--irx-career-accent-dim:    #5F7FA9;
  --irx-career-suit-d:        #7A3B47;
  --irx-career-suit-d-dark:   #5E2C36;
  --irx-career-suit-d-fold:   #8E4A57;
}
/* @tokens-end */
        .ln  { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .vl  { fill: var(--irx-vig-light); }
        .vb  { fill: var(--irx-vig-base); }
        .vm  { fill: var(--irx-vig-mid); }
        .vd  { fill: var(--irx-vig-dark); }
    </style></defs>

    <g id="vignette">
        <path d="M0 0 h480 v600 h-480 z" class="vm"/>

        <!-- the cabinet run, the same architecture as scene.office_floor reduced to
             two tones -->
        <path d="M46 96 h388 v150 h-388 z" class="vb"/>
        <path d="M46 96 h388 v16 h-388 z" class="vd" opacity="0.34"/>
        <g class="ln" stroke-width="2.6" opacity="0.5">
            <path d="M143 112 v134"/><path d="M240 112 v134"/><path d="M337 112 v134"/>
        </g>
        <path class="ln" stroke-width="3.4" d="M46 96 h388 v150 h-388 z"/>

        <!-- two people, turned toward each other. Friendly, and that is the point:
             nothing in this panel is unpleasant. -->
        <g class="vd">
            <circle cx="146" cy="286" r="38"/>
            <path d="M146 330 q-70 12 -80 106 h160 q-10 -94 -80 -106 z"/>
            <circle cx="336" cy="272" r="38"/>
            <path d="M336 316 q-70 12 -80 120 h160 q-10 -108 -80 -120 z"/>
        </g>

        <!-- the counter, and two mugs on it -->
        <path d="M204 396 h34 v42 h-34 z" class="vl"/>
        <path class="ln" stroke-width="2.4" d="M204 396 h34 v42 h-34 z"/>
        <path d="M252 402 h30 v36 h-30 z" class="vl" opacity="0.82"/>
        <path class="ln" stroke-width="2.4" d="M252 402 h30 v36 h-30 z"/>
        <path d="M0 438 h480 v34 h-480 z" class="vl"/>
        <path d="M0 472 h480 v128 h-480 z" class="vb"/>
        <path d="M0 472 h480 v22 h-480 z" class="vd" opacity="0.26"/>
        <path class="ln" stroke-width="4.6" d="M0 438 h480"/>
        <path class="ln" stroke-width="2.4" d="M0 472 h480" opacity="0.6"/>
        <g class="ln" stroke-width="2.2" opacity="0.34">
            <path d="M160 494 v106"/><path d="M330 494 v106"/>
        </g>
    </g>
</svg>