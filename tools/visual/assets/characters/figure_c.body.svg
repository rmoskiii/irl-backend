<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800"
     id="figure_c.body" data-asset="figure_c" data-kind="body"
     data-base-point="210,800" data-head-socket="210,210" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <!-- IRX 2B.7 = figure_c body (Ray Okonjo). FIRST CAREER FIGURE.

         GEOMETRY IS figure_a's AND IS NOT REDESIGNED:
           localViewBox   0 0 420 800
           basePoint      210,800   (bottom-centre, lands on the scene slot anchor)
           headSocket     210,210   (where the register's neckAnchor lands)
           neckSpan       register-local x 81..119 from y 170, which is body-space
                          x 191..229 from y 170. The neck below is drawn to that
                          column exactly. A register head that does not span it
                          floats, and that is the whole point of the contract.
           shoulderWidth  185       (figure_a's, per anchors.characters.figure_c)

         IDENTITY IS NOT figure_a's. Ray is a middle-aged white man: lighter warm
         skin on its own token pair, a longer neck-to-shoulder run than Jessica's,
         and a heavier upper arm. Nothing here is recoloured from figure_a or
         figure_b - the shapes are drawn for this body.

         ARMS FORWARD, HANDS FLAT. The environment contract puts an occluding
         surface at canvas y=600, which is local y=500. The hands sit at local
         y 450..508 so they rest ON that surface with about 45px reading above the
         desk line rather than floating over it or vanishing under it.

         TWO GROUPS. `character_body` draws before clothing; `character_front`
         carries the hands and draws AFTER props, per anchors.layerOrder, so a
         prop on the surface sits under the hand rather than over it. -->
    <defs><style>
        /* @tokens-begin */
:root {
  /* line */
  --irx-line:          #241D19;
  --irx-line-soft:     #3B302A;
  --irx-shadow:        #2A231E;

  /* architecture */
  --irx-wall:          #5C6A5F;
  --irx-wall-dark:     #4E5A51;
  --irx-wall-pattern:  #556359;
  --irx-tile:          #B5A992;
  --irx-tile-alt:      #A49980;
  --irx-floor:         #5E4D3E;

  /* window */
  --irx-sky-high:      #334051;
  --irx-sky-mid:       #4D4656;
  --irx-sky-low:       #785A4F;
  --irx-outside-dark:  #2A333E;
  --irx-curtain:       #424E56;
  --irx-curtain-dark:  #38424A;

  /* joinery */
  --irx-cabinet:       #785D44;
  --irx-cabinet-dark:  #634C36;
  --irx-counter:       #947553;
  --irx-counter-edge:  #7B5F43;

  /* character */
  --irx-skin:          #A87A5A;
  --irx-skin-shade:    #875D42;
  /* figure_b: same warm hazel family, one step deeper than figure_a */
  --irx-skin-b:        #8E6244;
  --irx-skin-b-shade:  #6E4A32;
  /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
     mouth with --irx-line reads as black lips. */
  --irx-lip-b:         #96604F;
  --irx-mouth-b:       #4A2C24;
  --irx-hair:          #41322A;
  --irx-hair-light:    #554136;
  /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
  --irx-hair-b:        #241A16;
  --irx-hair-b-light:  #3D2C24;

  /* wardrobe: home_casual */
  --irx-cloth:         #A8603F;
  --irx-cloth-dark:    #894C31;
  --irx-cloth-inner:   #D9CDBC;

  /* props */
  --irx-glass:         #BCC8C3;
  --irx-glass-dark:    #9AA8A2;
  --irx-highlight:     #FFFFFF;
  --irx-jacket:        #4F5A63;
  --irx-jacket-dark:   #3D464E;

  /* accent — neighbourhood district, warm light only */
  --irx-accent:        #FFC15E;
  --irx-accent-dim:    #C89A4E;
  --irx-lamp-warm:     #F2C77E;
  --irx-cool-spill:    #7E93A8;

  /* vignettes: montage panels only. Desaturated and reduced, so compressed
     time reads differently from present tense without a caption saying so.
     A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
     validate_assets.py rule 13. */
  --irx-vig-light:     #B3ABA0;
  --irx-vig-base:      #8C857C;
  --irx-vig-mid:       #635D56;
  --irx-vig-dark:      #3B3733;

  /* stroke weights */
  --irx-stroke-xheavy: 6.6;
  --irx-stroke-heavy:  5;
  --irx-stroke:        3.4;
  --irx-stroke-fine:   2.1;
  --irx-stroke-hair:   1.4;

  /* ==== career district ==== */
/* career: architecture */
--irx-career-wall:          #6E757E;
--irx-career-wall-dark:     #5C636B;
--irx-career-wall-pattern:  #666D76;
--irx-career-partition:     #58606A;
--irx-career-partition-dark:#4A5158;
--irx-career-floor:         #4A4F55;
/* career: window, evening. The office is lit; outside is not. */
--irx-career-sky-high:      #1E2836;
--irx-career-sky-mid:       #26303D;
--irx-career-sky-low:       #2E3444;
--irx-career-outside-dark:  #161C25;
/* career: joinery */
--irx-career-desk:          #8A8478;
--irx-career-desk-edge:     #6F6A60;
--irx-career-desk-dark:     #5E5A52;
--irx-career-metal:         #7A828A;
--irx-career-metal-dark:    #626A72;
/* career: light. Overhead fluorescent and one screen. */
--irx-career-fluoro:        #E8EDF2;
--irx-career-fluoro-dim:    #A8B2BC;
--irx-career-screen:        #6E93A8;
--irx-career-screen-glow:   #9FC4D8;
/* career: figure_c (Ray) */
--irx-career-skin-c:        #D9A886;
--irx-career-skin-c-shade:  #B98565;
--irx-career-hair-c:        #6E655C;
--irx-career-hair-c-light:  #8A8076;
--irx-career-lip-c:         #B57F66;
--irx-career-mouth-c:       #6B4436;
/* career: figure_d (Dana) */
--irx-career-skin-d:        #E0B294;
--irx-career-skin-d-shade:  #BE8D6F;
--irx-career-hair-d:        #4A4038;
--irx-career-hair-d-light:  #6A5C50;
/* career: wardrobe work */
--irx-career-shirt-c:       #9FA9B4;
--irx-career-shirt-c-dark:  #7E8894;
--irx-career-shirt-c-fold:  #6B7480;
/* career: wardrobe work_coat */
--irx-career-coat-c:        #4E5661;
--irx-career-coat-c-dark:   #3C434D;
--irx-career-coat-c-fold:   #5C6570;
/* career: accent. Matches district_theme.dart Career accent 0xFF7EA6DB. */
--irx-career-accent:        #7EA6DB;
--irx-career-accent-dim:    #5F7FA9;
}
/* @tokens-end */
        .ln  { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .sk  { fill: var(--irx-career-skin-c); }
        .skd { fill: var(--irx-career-skin-c-shade); }
    </style></defs>

    <g id="character_body">
        <!-- neck. Drawn to the neckSpan column: x191..229 through y170..195. -->
        <path d="M191 150 q19 6 38 0 q2 44 6 62 q-25 14 -50 0 q4 -18 6 -62 z" class="sk"/>
        <path d="M191 150 q19 6 38 0 q1 22 3 34 q-21 9 -44 0 q2 -12 3 -34 z" class="skd" opacity="0.42"/>
        <path class="ln" stroke-width="3.4" d="M191 150 q19 6 38 0"/>
        <path class="ln" stroke-width="3.4" d="M229 150 q2 44 6 62"/>
        <path class="ln" stroke-width="3.4" d="M191 150 q-2 44 -6 62"/>

        <!-- trapezius and shoulder line. shoulderWidth 185 -> x 117.5..302.5 -->
        <path d="M185 212 q-38 12 -67 46 q46 -8 92 -6 q46 -2 92 6 q-29 -34 -67 -46
           q-25 14 -50 0 z" class="sk"/>
        <path class="ln" stroke-width="3.4" d="M185 212 q-38 12 -67 46"/>
        <path class="ln" stroke-width="3.4" d="M235 212 q38 12 67 46"/>

        <!-- torso. Mostly covered by the wardrobe; it sets the silhouette the
             clothing is cut to, and shows at the collar opening. -->
        <path d="M118 258 q46 -8 92 -6 q46 -2 92 6 q10 96 8 202 q-2 90 -6 172 h-188
           q-4 -82 -6 -172 q-2 -106 8 -202 z" class="sk"/>
        <path d="M210 252 q46 -2 92 6 q10 96 8 202 q-2 90 -6 172 h-94 z"
              class="skd" opacity="0.24"/>

        <!-- arms: down and slightly forward, heavier through the upper arm than
             either Neighbourhood figure. Left. -->
        <path d="M126 268 q-34 62 -34 132 q0 46 20 84 l44 -14 q-16 -34 -14 -70
           q2 -56 30 -112 z" class="sk"/>
        <path class="ln" stroke-width="3.4" d="M126 268 q-34 62 -34 132 q0 46 20 84"/>
        <path class="ln" stroke-width="2.1" d="M156 282 q-26 52 -28 106 q-2 38 12 68" opacity="0.5"/>
        <!-- right -->
        <path d="M294 268 q34 62 34 132 q0 46 -20 84 l-44 -14 q16 -34 14 -70
           q-2 -56 -30 -112 z" class="sk"/>
        <path class="ln" stroke-width="3.4" d="M294 268 q34 62 34 132 q0 46 -20 84"/>
        <path class="ln" stroke-width="2.1" d="M264 282 q26 52 28 106 q2 38 -12 68" opacity="0.5"/>

        <!-- forearm below the rolled cuff: skin, because the wardrobe sleeve stops
             short of the wrist -->
        <path d="M112 452 q28 12 44 -8 l-6 -18 l-42 12 z" class="skd" opacity="0.5"/>
        <path d="M308 452 q-28 12 -44 -8 l6 -18 l42 12 z" class="skd" opacity="0.5"/>
    </g>

    <g id="character_front">
        <!-- Hands, flat on the surface at local y~500 (canvas 600). Drawn after
             props so a laptop or a notepad sits UNDER the hand, not over it. -->
        <path d="M110 452 q34 10 56 -6 q10 22 4 44 q-30 22 -66 6 q-4 -24 6 -44 z" class="sk"/>
        <path class="ln" stroke-width="3.0" d="M110 452 q34 10 56 -6 q10 22 4 44 q-30 22 -66 6 q-4 -24 6 -44 z"/>
        <g class="ln" stroke-width="1.4" opacity="0.45">
            <path d="M124 468 q4 16 2 28"/><path d="M140 470 q4 16 2 26"/><path d="M154 468 q4 14 2 24"/>
        </g>
        <path d="M310 452 q-34 10 -56 -6 q-10 22 -4 44 q30 22 66 6 q4 -24 -6 -44 z" class="sk"/>
        <path class="ln" stroke-width="3.0" d="M310 452 q-34 10 -56 -6 q-10 22 -4 44 q30 22 66 6 q4 -24 -6 -44 z"/>
        <g class="ln" stroke-width="1.4" opacity="0.45">
            <path d="M296 468 q-4 16 -2 28"/><path d="M280 470 q-4 16 -2 26"/><path d="M266 468 q-4 14 -2 24"/>
        </g>
    </g>
</svg>