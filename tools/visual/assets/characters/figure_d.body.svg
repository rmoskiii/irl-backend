<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800"
     id="figure_d.body" data-asset="figure_d" data-kind="body"
     data-base-point="210,800" data-head-socket="210,196" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <!-- IRX 2B.8 = figure_d body (Dana Whitfield). SECOND CAREER FIGURE.

         TOKEN BLOCK: ships with the Career set only. Run inject_tokens.py after
         adding this file; validate_assets.py rule 8 requires byte-identity with
         tokens.css and will fail until that is done.

         GEOMETRY IS figure_b's AND IS NOT REDESIGNED:
           localViewBox   0 0 420 800
           basePoint      210,800
           headSocket     210,196   (14 higher than figure_c, and the reason this
                                        body is drawn rather than copied)
           neckSpan       register-local x 85..123 from y 156
           shoulderWidth  196       (figure_b's, per anchors.characters.figure_d)

         WHERE THE NECK GOES, DERIVED NOT GUESSED. A register's neckAnchor (100,210)
         lands on headSocket (210,196), so body = register + (110, -14). The
         neckSpan column x85..123 from y156 therefore maps to body-space x 195..233
         from y 142, and a figure_d register head must cover x195..233 at y147..167
         or it will float.

         Ray's neck starts at y170. Dana's starts at y142. Twenty-eight pixels of
         extra neck, and that is not a stylistic choice - it is what the socket
         means. We proved this on Alex: the composer had been ignoring the 196 and
         sinking his head into his shoulders, and the render at the correct socket
         is the longer-necked build anchors.json describes.

         IDENTITY IS NOT figure_b's and NOT figure_c's. Dana is a middle-aged white
         woman: her own skin token pair, a narrower jaw column at the neck, a
         shoulder line with a real slope rather than Ray's square set, and a waist
         that draws in where Ray's runs straight. Nothing here is recoloured.

         ARMS FORWARD, HANDS FLAT. The environment contract puts an occluding
         surface at canvas y=600, which is local y=500. Her hands sit at local
         y 450..508, resting on scene.review_room's desk. The prose has her with
         her hands flat on that desk, not interrupting once.

         TWO GROUPS. `character_body` draws before clothing; `character_front`
         carries the hands and draws AFTER props, per anchors.layerOrder - verified
         against compose_frame.py, which reads both from this file and places them
         with the slot transform only. -->
    <defs><style>
        /* @tokens-begin */
:root {
  /* line */
  --irx-line:          #241D19;
  --irx-line-soft:     #3B302A;
  --irx-shadow:        #2A231E;

  /* architecture */
  --irx-wall:          #5C6A5F;
  --irx-wall-dark:     #4E5A51;
  --irx-wall-pattern:  #556359;
  --irx-tile:          #B5A992;
  --irx-tile-alt:      #A49980;
  --irx-floor:         #5E4D3E;

  /* window */
  --irx-sky-high:      #334051;
  --irx-sky-mid:       #4D4656;
  --irx-sky-low:       #785A4F;
  --irx-outside-dark:  #2A333E;
  --irx-curtain:       #424E56;
  --irx-curtain-dark:  #38424A;

  /* joinery */
  --irx-cabinet:       #785D44;
  --irx-cabinet-dark:  #634C36;
  --irx-counter:       #947553;
  --irx-counter-edge:  #7B5F43;

  /* character */
  --irx-skin:          #A87A5A;
  --irx-skin-shade:    #875D42;
  /* figure_b: same warm hazel family, one step deeper than figure_a */
  --irx-skin-b:        #8E6244;
  --irx-skin-b-shade:  #6E4A32;
  /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
     mouth with --irx-line reads as black lips. */
  --irx-lip-b:         #96604F;
  --irx-mouth-b:       #4A2C24;
  --irx-hair:          #41322A;
  --irx-hair-light:    #554136;
  /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
  --irx-hair-b:        #241A16;
  --irx-hair-b-light:  #3D2C24;

  /* wardrobe: home_casual */
  --irx-cloth:         #A8603F;
  --irx-cloth-dark:    #894C31;
  --irx-cloth-inner:   #D9CDBC;

  /* props */
  --irx-glass:         #BCC8C3;
  --irx-glass-dark:    #9AA8A2;
  --irx-highlight:     #FFFFFF;
  --irx-jacket:        #4F5A63;
  --irx-jacket-dark:   #3D464E;

  /* accent — neighbourhood district, warm light only */
  --irx-accent:        #FFC15E;
  --irx-accent-dim:    #C89A4E;
  --irx-lamp-warm:     #F2C77E;
  --irx-cool-spill:    #7E93A8;

  /* vignettes: montage panels only. Desaturated and reduced, so compressed
     time reads differently from present tense without a caption saying so.
     A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
     validate_assets.py rule 13. */
  --irx-vig-light:     #B3ABA0;
  --irx-vig-base:      #8C857C;
  --irx-vig-mid:       #635D56;
  --irx-vig-dark:      #3B3733;

  /* stroke weights */
  --irx-stroke-xheavy: 6.6;
  --irx-stroke-heavy:  5;
  --irx-stroke:        3.4;
  --irx-stroke-fine:   2.1;
  --irx-stroke-hair:   1.4;

  /* ==== career district ==== */
/* career: architecture */
--irx-career-wall:          #6E757E;
--irx-career-wall-dark:     #5C636B;
--irx-career-wall-pattern:  #666D76;
--irx-career-partition:     #58606A;
--irx-career-partition-dark:#4A5158;
--irx-career-floor:         #4A4F55;
/* career: window, evening. The office is lit; outside is not. */
--irx-career-sky-high:      #1E2836;
--irx-career-sky-mid:       #26303D;
--irx-career-sky-low:       #2E3444;
--irx-career-outside-dark:  #161C25;
/* career: joinery */
--irx-career-desk:          #8A8478;
--irx-career-desk-edge:     #6F6A60;
--irx-career-desk-dark:     #5E5A52;
--irx-career-metal:         #7A828A;
--irx-career-metal-dark:    #626A72;
/* career: light. Overhead fluorescent and one screen. */
--irx-career-fluoro:        #E8EDF2;
--irx-career-fluoro-dim:    #A8B2BC;
--irx-career-screen:        #6E93A8;
--irx-career-screen-glow:   #9FC4D8;
/* career: figure_c (Ray) */
--irx-career-skin-c:        #D9A886;
--irx-career-skin-c-shade:  #B98565;
--irx-career-hair-c:        #6E655C;
--irx-career-hair-c-light:  #8A8076;
--irx-career-lip-c:         #B57F66;
--irx-career-mouth-c:       #6B4436;
/* career: figure_d (Dana) */
--irx-career-skin-d:        #E0B294;
--irx-career-skin-d-shade:  #BE8D6F;
--irx-career-hair-d:        #4A4038;
--irx-career-hair-d-light:  #6A5C50;
/* career: wardrobe work */
--irx-career-shirt-c:       #9FA9B4;
--irx-career-shirt-c-dark:  #7E8894;
--irx-career-shirt-c-fold:  #6B7480;
/* career: wardrobe work_coat */
--irx-career-coat-c:        #4E5661;
--irx-career-coat-c-dark:   #3C434D;
--irx-career-coat-c-fold:   #5C6570;
/* career: accent. Matches district_theme.dart Career accent 0xFF7EA6DB. */
--irx-career-accent:        #7EA6DB;
--irx-career-accent-dim:    #5F7FA9;
  --irx-career-suit-d:        #7A3B47;
  --irx-career-suit-d-dark:   #5E2C36;
  --irx-career-suit-d-fold:   #8E4A57;
}
/* @tokens-end */
        .ln  { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .sk  { fill: var(--irx-career-skin-d); }
        .skd { fill: var(--irx-career-skin-d-shade); }
    </style></defs>

    <g id="character_body">
        <!-- Neck. Drawn to the neckSpan column: x195..233 through y142..167, and
             carried down to the shoulder line. Long, because headSocket 196 says so. -->
        <path d="M195 138 q19 5 38 0 q2 52 7 72 q-26 14 -52 0 q5 -20 7 -72 z" class="sk"/>
        <path d="M195 138 q19 5 38 0 q1 26 3 40 q-22 9 -46 0 q2 -14 3 -40 z"
              class="skd" opacity="0.34"/>
        <path class="ln" stroke-width="3.4" d="M195 138 q19 5 38 0"/>
        <path class="ln" stroke-width="3.4" d="M233 138 q2 52 7 72"/>
        <path class="ln" stroke-width="3.4" d="M195 138 q-2 52 -7 72"/>
        <!-- the one line that says middle-aged rather than young: a single crease at
             the base of the throat. Nothing else on the neck. -->
        <path class="ln" stroke-width="1.4" d="M199 176 q15 5 30 0" opacity="0.26"/>

        <!-- Shoulders. shoulderWidth 196 -> x 112..308, per the contract and NOT
             narrowed for apparent symmetry with Ray. What differs from Ray is the
             SLOPE: his shoulder run is square, hers falls away from the neck. -->
        <path d="M188 206 q-42 8 -76 46 q48 -9 98 -7 q50 -2 98 7 q-34 -38 -76 -46
           q-26 14 -44 0 z" class="sk"/>
        <path class="ln" stroke-width="3.4" d="M188 206 q-42 8 -76 46"/>
        <path class="ln" stroke-width="3.4" d="M232 206 q42 8 76 46"/>

        <!-- Torso. Draws in at the waist where Ray's runs straight down, then eases
             back out. Mostly covered by wardrobe; it sets the silhouette the clothing
             is cut to and shows at the collar. -->
        <path d="M112 252 q48 -9 98 -7 q50 -2 98 7 q12 92 8 196 q-3 42 -12 74
           q6 44 6 106 h-200 q0 -62 6 -106 q-9 -32 -12 -74 q-4 -104 8 -196 z"
              class="sk"/>
        <path d="M210 245 q50 -2 98 7 q12 92 8 196 q-3 42 -12 74 q6 44 6 106 h-100 z"
              class="skd" opacity="0.22"/>

        <!-- Arms: down and slightly forward. Lighter through the upper arm than
             figure_c, and the forearm tapers more into the wrist. Left. -->
        <path d="M124 262 q-30 62 -30 130 q0 44 18 82 l42 -14 q-14 -34 -12 -68
           q2 -54 26 -110 z" class="sk"/>
        <path class="ln" stroke-width="3.4" d="M124 262 q-30 62 -30 130 q0 44 18 82"/>
        <path class="ln" stroke-width="2.1" d="M150 276 q-22 52 -24 104 q-2 36 10 66" opacity="0.5"/>
        <!-- right -->
        <path d="M296 262 q30 62 30 130 q0 44 -18 82 l-42 -14 q14 -34 12 -68
           q-2 -54 -26 -110 z" class="sk"/>
        <path class="ln" stroke-width="3.4" d="M296 262 q30 62 30 130 q0 44 -18 82"/>
        <path class="ln" stroke-width="2.1" d="M270 276 q22 52 24 104 q2 36 -10 66" opacity="0.5"/>

        <!-- forearm below the cuff line: skin, because work_formal's sleeve will
             stop short of the wrist -->
        <path d="M112 450 q26 12 42 -8 l-6 -18 l-40 12 z" class="skd" opacity="0.46"/>
        <path d="M308 450 q-26 12 -42 -8 l6 -18 l40 12 z" class="skd" opacity="0.46"/>
    </g>

    <g id="character_front">
        <!-- Hands, flat on the surface at local y~500 (canvas 600). Drawn after props
             so a notepad on the desk sits UNDER the hand, not over it. The prose has
             her hands flat on that desk while she listens, which is the one piece of
             staging this body has to be able to hold. -->
        <path d="M110 450 q32 10 54 -6 q9 22 3 44 q-29 21 -63 6 q-4 -24 6 -44 z" class="sk"/>
        <path class="ln" stroke-width="3.0" d="M110 450 q32 10 54 -6 q9 22 3 44 q-29 21 -63 6 q-4 -24 6 -44 z"/>
        <g class="ln" stroke-width="1.4" opacity="0.42">
            <path d="M123 466 q4 16 2 27"/><path d="M138 468 q4 15 2 25"/><path d="M152 466 q3 14 2 23"/>
        </g>
        <path d="M310 450 q-32 10 -54 -6 q-9 22 -3 44 q29 21 63 6 q4 -24 -6 -44 z" class="sk"/>
        <path class="ln" stroke-width="3.0" d="M310 450 q-32 10 -54 -6 q-9 22 -3 44 q29 21 63 6 q4 -24 -6 -44 z"/>
        <g class="ln" stroke-width="1.4" opacity="0.42">
            <path d="M297 466 q-4 16 -2 27"/><path d="M282 468 q-4 15 -2 25"/><path d="M268 466 q-3 14 -2 23"/>
        </g>
    </g>
</svg>