        <path id="bl-sleeve-r-sh" fill="var(--irx-wax-teal-dark)" d="M312 280 q13 30 15 70 q2 48 -2 92 q-2 34 -6 58 q-12 4 -24 3 q5 -28 8 -66 q3 -48 1 -92 q-2 -38 -11 -68 z"/>
        <path id="bl-cuff-l" fill="var(--irx-wax-gold)" d="M96 392 q26 9 52 0 q2 9 0 18 q-26 9 -52 0 q-2 -9 0 -18 z"/>
        <path id="bl-cuff-r" fill="var(--irx-wax-gold)" d="M272 392 q26 9 52 0 q2 9 0 18 q-26 9 -52 0 q-2 -9 0 -18 z"/>
        <path id="bl-band0" fill="var(--irx-wax-gold)" d="M150 256 h128 v9 h-128 z"/>
