        <path id="bl-dot0-0" fill="var(--irx-wax-gold)" d="M160 284 q5 0 5 5 q0 5 -5 5 q-5 0 -5 -5 q0 -5 5 -5 z"/>
        <path id="bl-dot0-1" fill="var(--irx-wax-gold)" d="M182 284 q5 0 5 5 q0 5 -5 5 q-5 0 -5 -5 q0 -5 5 -5 z"/>
