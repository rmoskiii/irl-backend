<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800"
     id="figure_d.wardrobe.work_formal" data-asset="figure_d" data-kind="wardrobe"
     data-wardrobe="work_formal" data-base-point="210,800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <!-- IRX 2B.8 = figure_d wardrobe: work_formal (Dana Whitfield).

         TOKEN BLOCK: ships with the Career set only. Run inject_tokens.py after
         adding this file.

         A tailored jacket over a dark shell. Formal is carried by CONSTRUCTION, not
         by dressing the approved body differently: nothing here changes her
         proportions, her shoulder width, her neck or her face.

         THREE THINGS DO THE WORK, and all three are silhouette:
           1. a structured shoulder. The body's shoulder line falls away from the
              neck; tailoring squares it. The jacket sits 8 outside the body at the
              shoulder and holds a straight run where the body slopes.
           2. narrow notch lapels running to a single closure at y330, which puts
              two hard diagonals into an outline that is otherwise a smooth taper.
           3. a nipped waist and full-length sleeves to a plain cuff at y440.

         THE NECK IS LEFT ALONE. The register's chin sits at body y176 and the
         collar starts at y204, so the long neck that headSocket 196 implies stays
         visible. Covering it would erase the one proportion that distinguishes this
         build from Ray's.

              BURGUNDY, and it is the only saturated garment in the Career district.
         Ray is grey on grey; the room is grey. Dana carries the one warm note, and
         it is hers alone: she appears in two nodes and both of them are the moment
         the institution answers you. Three new tokens, named by role like every
         other Career token rather than by colour.

         The shell under it stays cool near-black, so the jacket reads against the
         credenza behind her and the shell reads against the jacket.

         Cuff at y440, clear of the hands at y450..508 in the body's
         character_front group. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line and stroke: GLOBAL craft language, identical in both districts.
        Not namespaced - the line weight and colour are the thing the two
        districts have in common, and forking them would fork the craft. */
        --irx-line:                 #241D19;
        --irx-line-soft:            #3B302A;
        --irx-shadow:               #2A231E;

        /* career: architecture */
        --irx-career-wall:          #6E757E;
        --irx-career-wall-dark:     #5C636B;
        --irx-career-wall-pattern:  #666D76;
        --irx-career-partition:     #58606A;
        --irx-career-partition-dark:#4A5158;
        --irx-career-floor:         #4A4F55;

        /* career: window, evening. The office is lit; outside is not. */
        --irx-career-sky-high:      #1E2836;
        --irx-career-sky-mid:       #26303D;
        --irx-career-sky-low:       #2E3444;
        --irx-career-outside-dark:  #161C25;

        /* career: joinery */
        --irx-career-desk:          #8A8478;
        --irx-career-desk-edge:     #6F6A60;
        --irx-career-desk-dark:     #5E5A52;
        --irx-career-metal:         #7A828A;
        --irx-career-metal-dark:    #626A72;

        /* career: light. Overhead fluorescent and one screen. */
        --irx-career-fluoro:        #E8EDF2;
        --irx-career-fluoro-dim:    #A8B2BC;
        --irx-career-screen:        #6E93A8;
        --irx-career-screen-glow:   #9FC4D8;

        /* career: figure_c (Ray) */
        --irx-career-skin-c:        #D9A886;
        --irx-career-skin-c-shade:  #B98565;
        --irx-career-hair-c:        #6E655C;
        --irx-career-hair-c-light:  #8A8076;
        --irx-career-lip-c:         #B57F66;
        --irx-career-mouth-c:       #6B4436;

        /* career: figure_d (Dana) */
        --irx-career-skin-d:        #E0B294;
        --irx-career-skin-d-shade:  #BE8D6F;
        --irx-career-hair-d:        #4A4038;
        --irx-career-hair-d-light:  #6A5C50;

        /* career: wardrobe work */
        --irx-career-shirt-c:       #9FA9B4;
        --irx-career-shirt-c-dark:  #7E8894;
        --irx-career-shirt-c-fold:  #6B7480;

        /* career: wardrobe work_coat */
        --irx-career-coat-c:        #4E5661;
        --irx-career-coat-c-dark:   #3C434D;
        --irx-career-coat-c-fold:   #5C6570;

        /* career: wardrobe work_formal (figure_d). The one warm note in a cool
        district, and the only saturated garment in Career. */
        --irx-career-suit-d:        #7A3B47;
        --irx-career-suit-d-dark:   #5E2C36;
        --irx-career-suit-d-fold:   #8E4A57;

        /* career: accent. Matches district_theme.dart Career accent 0xFF7EA6DB. */
        --irx-career-accent:        #7EA6DB;
        --irx-career-accent-dim:    #5F7FA9;

        /* vignettes: montage panels only. Global ramp, shared with neighbourhood. */
        --irx-vig-light:            #B3ABA0;
        --irx-vig-base:             #8C857C;
        --irx-vig-mid:              #635D56;
        --irx-vig-dark:             #3B3733;

        /* stroke weights: global */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln  { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .jk  { fill: var(--irx-career-suit-d); }
        .jkd { fill: var(--irx-career-suit-d-dark); }
        .jkf { fill: var(--irx-career-suit-d-fold); }
        .sl  { fill: var(--irx-career-coat-c-dark); }
        .slh { fill: var(--irx-career-coat-c); }
    </style></defs>

    <g id="character_clothing">

        <!-- the shell underneath. Dark, round-necked, and it shows only in the V
             between the lapels and at the closure. -->
        <path d="M178 200 q32 -9 64 0 q9 200 7 400 h-78 q-2 -200 7 -400 z" class="sl"/>
        <path d="M210 196 q32 -3 32 4 q9 200 7 400 h-39 z" class="slh" opacity="0.30"/>
        <path class="ln" stroke-width="3.0" d="M178 200 q32 -9 64 0"/>

        <!-- jacket, left front. The shoulder run is straight where the body's
             slopes: that is the tailoring, and it is the first thing that reads. -->
        <path d="M104 250 C 118 224 148 208 178 202 L 186 212 L 176 320 L 182 596
           L 106 596 C 98 470 98 350 104 250 Z" class="jk"/>
        <path class="ln" stroke-width="6.6"
              d="M104 250 C 118 224 148 208 178 202 L 186 212 L 176 320 L 182 596"/>

        <!-- jacket, right front. One step darker: the key is from the left in both
             Career rooms, and every Career asset agrees on that. -->
        <path d="M316 250 C 302 224 272 208 242 202 L 234 212 L 244 320 L 238 596
           L 314 596 C 322 470 322 350 316 250 Z" class="jk"/>
        <path d="M316 250 C 302 224 272 208 242 202 L 234 212 L 244 320 L 238 596
           L 314 596 C 322 470 322 350 316 250 Z" class="jkd" opacity="0.34"/>
        <path class="ln" stroke-width="6.6"
              d="M316 250 C 302 224 272 208 242 202 L 234 212 L 244 320 L 238 596"/>

        <!-- notch lapels: narrow, and the two hard diagonals in the outline -->
        <path d="M178 202 L 176 320 L 140 292 L 152 220 Z" class="jkf"/>
        <path class="ln" stroke-width="3.0" d="M178 202 L 176 320 L 140 292 L 152 220 Z"/>
        <path class="ln" stroke-width="1.6" d="M174 220 L 162 250" opacity="0.38"/>
        <path d="M242 202 L 244 320 L 280 292 L 268 220 Z" class="jkf"/>
        <path d="M242 202 L 244 320 L 280 292 L 268 220 Z" class="jkd" opacity="0.30"/>
        <path class="ln" stroke-width="3.0" d="M242 202 L 244 320 L 280 292 L 268 220 Z"/>
        <path class="ln" stroke-width="1.6" d="M246 220 L 258 250" opacity="0.32"/>

        <!-- single closure at the waist break, and the fronts falling apart below it -->
        <path class="ln" stroke-width="2.4" d="M176 320 L 210 336 L 244 320" opacity="0.5"/>
        <circle cx="210" cy="340" r="4.2" fill="var(--irx-career-suit-d-fold)"
                stroke="var(--irx-line)" stroke-width="1.8"/>
        <path class="ln" stroke-width="2.2" d="M182 360 q6 118 2 236" opacity="0.34"/>
        <path class="ln" stroke-width="2.2" d="M238 360 q-6 118 -2 236" opacity="0.28"/>

        <!-- sleeves: full length to a plain cuff at y440, and set into a squared
             shoulder rather than dropping off a sloped one -->
        <path d="M110 256 C 88 320 82 380 88 440 L 140 434 C 132 380 138 320 154 266 Z"
              class="jk"/>
        <path class="ln" stroke-width="6.6" d="M110 256 C 88 320 82 380 88 440"/>
        <path class="ln" stroke-width="6.6" d="M154 266 C 138 320 132 380 140 434"/>
        <path d="M88 440 C 106 452 128 449 140 434 L 138 416 L 88 422 Z" class="jkf"/>
        <path class="ln" stroke-width="3.4" d="M88 440 C 106 452 128 449 140 434"/>
        <path class="ln" stroke-width="2.1" d="M88 422 L 138 416" opacity="0.46"/>

        <path d="M310 256 C 332 320 338 380 332 440 L 280 434 C 288 380 282 320 266 266 Z"
              class="jk"/>
        <path d="M310 256 C 332 320 338 380 332 440 L 280 434 C 288 380 282 320 266 266 Z"
              class="jkd" opacity="0.34"/>
        <path class="ln" stroke-width="6.6" d="M310 256 C 332 320 338 380 332 440"/>
        <path class="ln" stroke-width="6.6" d="M266 266 C 282 320 288 380 280 434"/>
        <path d="M332 440 C 314 452 292 449 280 434 L 282 416 L 332 422 Z" class="jkf"/>
        <path class="ln" stroke-width="3.4" d="M332 440 C 314 452 292 449 280 434"/>
        <path class="ln" stroke-width="2.1" d="M332 422 L 282 416" opacity="0.40"/>

        <!-- shoulder seams and two waist darts. A tailored jacket creases at the
             dart, not at the waist the way an untucked shirt does. -->
        <path class="ln" stroke-width="2.1" d="M122 248 C 138 226 158 214 178 206" opacity="0.42"/>
        <path class="ln" stroke-width="2.1" d="M298 248 C 282 226 262 214 242 206" opacity="0.42"/>
        <path class="ln" stroke-width="1.4" d="M148 330 q8 96 6 176" opacity="0.26"/>
        <path class="ln" stroke-width="1.4" d="M272 330 q-8 96 -6 176" opacity="0.22"/>
        <path d="M278 300 q14 84 12 176 q-2 60 -5 120 h-24 q6 -160 2 -226 q-2 -40 15 -70 z"
              fill="var(--irx-shadow)" opacity="0.12"/>
    </g>
</svg>