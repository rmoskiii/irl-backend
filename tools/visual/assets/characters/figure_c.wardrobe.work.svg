<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800"
     id="figure_c.wardrobe.work" data-asset="figure_c" data-kind="wardrobe"
     data-wardrobe="work" data-base-point="210,800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <!-- IRX 2B.7 = figure_c wardrobe: work (Ray).

         Plain business shirt, collar open at the neck, no tie, sleeves rolled to
         just below the elbow. Deliberately a different garment TYPE from both
         Neighbourhood wardrobes - Jessica's cardigan and Alex's open overshirt are
         both layered garments worn over something; this is one garment, tucked,
         with a hard collar. The silhouette closes at the waist instead of hanging.

         Palette pulls cool and light: at 390pt the shirt reads about 168 against
         the desk_evening partition at 129, which is the separation doing the work.
         Nothing here is Alex's overshirt recoloured.

         ROLLED CUFFS STOP AT y=415, short of the wrist, so the body's forearm and
         hand show. The hands live in the body file's `character_front` group and
         draw after props.

         Drawn in figure_c's local space, so it overlays the body with no per-frame
         offset. Exports one group, same contract as figure_a and figure_b. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line - identical to neighbourhood */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* character - career */
        --irx-skin-c:        #D9A886;
        --irx-skin-c-shade:  #B98565;
        --irx-hair-c:        #6E655C;
        --irx-hair-c-light:  #8A8076;
        --irx-skin-d:        #E0B294;
        --irx-skin-d-shade:  #BE8D6F;
        --irx-hair-d:        #4A4038;
        --irx-hair-d-light:  #6A5C50;

        /* wardrobe: work (figure_c) */
        --irx-shirt-c:       #9FA9B4;
        --irx-shirt-c-dark:  #7E8894;
        --irx-shirt-c-fold:  #6B7480;

        /* accent - career district */
        --irx-accent:        #7EA6DB;
        --irx-accent-dim:    #5F7FA9;

        /* stroke weights - identical to neighbourhood */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln  { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .sh  { fill: var(--irx-shirt-c); }
        .shd { fill: var(--irx-shirt-c-dark); }
        .shf { fill: var(--irx-shirt-c-fold); }
    </style></defs>

    <g id="character_clothing">
        <!-- shirt body. Opens in a V at the collar so the neck and the top of the
             chest read as skin. -->
        <path d="M118 258 q29 -34 67 -46 q10 28 25 28 q15 0 25 -28 q38 12 67 46
           q10 96 8 200 q-2 90 -6 172 h-188 q-4 -82 -6 -172 q-2 -104 8 -200 z"
              class="sh"/>
        <!-- right side falls into shade, matching the environment key from the left -->
        <path d="M235 212 q38 12 67 46 q10 96 8 200 q-2 90 -6 172 h-92
           q4 -180 2 -260 q-1 -60 22 -122 z" class="shd" opacity="0.30"/>

        <!-- COLLAR. Rebuilt against the actual geometry rather than sketched across
             the shoulders, which is what made the first pass read as a scrub top.

             Reference points, all measured, not guessed:
               body neck   x191..229, flaring to x185..235 at y212
               jaw bottom  register y202 -> body y202
             So there are 14 units of neck between the jaw and where a collar can
             sit. The stand starts at y216 and the opening wraps the neck at x184..236
             rather than spanning the chest.

             Structure, in the order a shirt actually has it: a stand rising off the
             neck base, a fold, then a leaf lying down over the chest with its point
             toward the sternum. Top button undone, so the two leaves separate into a
             break at the centre - understated, no tie, no spread. -->

        <!-- stand: the band around the neck, darker because it turns away from the
             key. Drawn over the neck; the head covers anything above y202. -->
        <path d="M184 216 q26 7 52 0 q1 9 0 17 q-26 7 -52 0 q-1 -9 0 -17 z" class="shf"/>
        <path class="ln" stroke-width="2.4" d="M184 216 q26 7 52 0"/>

        <!-- left leaf -->
        <path d="M184 231 L 201 243 L 187 264 L 159 236 L 170 220 Z" class="sh"/>
        <path d="M184 231 L 201 243 L 187 264 L 174 250 Z" class="shd" opacity="0.45"/>
        <path class="ln" stroke-width="3.0" d="M184 231 L 201 243 L 187 264 L 159 236 L 170 220"/>
        <path class="ln" stroke-width="1.6" d="M184 231 L 172 243" opacity="0.5"/>

        <!-- right leaf -->
        <path d="M236 231 L 219 243 L 233 264 L 261 236 L 250 220 Z" class="sh"/>
        <path d="M236 231 L 219 243 L 233 264 L 246 250 Z" class="shd" opacity="0.60"/>
        <path class="ln" stroke-width="3.0" d="M236 231 L 219 243 L 233 264 L 261 236 L 250 220"/>
        <path class="ln" stroke-width="1.6" d="M236 231 L 248 243" opacity="0.5"/>

        <!-- the break: the two leaves do not meet, and the shirt front shows between
             them. This is the single detail that separates an open business collar
             from a crew neck at 390pt. -->
        <path class="ln" stroke-width="2.4" d="M201 243 L 210 262" opacity="0.45"/>
        <path class="ln" stroke-width="2.4" d="M219 243 L 210 262" opacity="0.45"/>
        <!-- placket and buttons -->
        <path class="ln" stroke-width="2.1" d="M210 264 q3 110 1 238" opacity="0.55"/>
        <g class="ln" stroke-width="1.4" opacity="0.45">
            <path d="M206 340 h8"/><path d="M206 386 h8"/><path d="M206 442 h8"/><path d="M206 498 h8"/>
        </g>
        <!-- chest pocket, left -->
        <path class="ln" stroke-width="2.1" d="M140 320 h38 v30 h-38 z" opacity="0.6"/>

        <!-- sleeves, rolled. Cuff at y=415, short of the wrist. -->
        <path d="M124 268 q-32 60 -32 130 q0 10 1 20 l46 -6 q-3 -16 -2 -30
           q3 -54 28 -104 z" class="sh"/>
        <path class="ln" stroke-width="6.6" d="M124 268 q-32 60 -32 130 q0 10 1 20"/>
        <path class="ln" stroke-width="6.6" d="M166 284 q-24 46 -26 98 q-1 14 1 28"/>
        <path d="M93 418 q28 12 46 -6 l-2 -22 l-46 6 z" class="shf"/>
        <path class="ln" stroke-width="3.4" d="M93 418 q28 12 46 -6"/>
        <path class="ln" stroke-width="2.1" d="M91 396 q28 12 46 -6" opacity="0.55"/>

        <path d="M296 268 q32 60 32 130 q0 10 -1 20 l-46 -6 q3 -16 2 -30
           q-3 -54 -28 -104 z" class="sh"/>
        <path class="ln" stroke-width="6.6" d="M296 268 q32 60 32 130 q0 10 -1 20"/>
        <path class="ln" stroke-width="6.6" d="M254 284 q24 46 26 98 q1 14 -1 28"/>
        <path d="M327 418 q-28 12 -46 -6 l2 -22 l46 6 z" class="shf"/>
        <path class="ln" stroke-width="3.4" d="M327 418 q-28 12 -46 -6"/>
        <path class="ln" stroke-width="2.1" d="M329 396 q-28 12 -46 -6" opacity="0.55"/>

        <!-- shoulder seams and a few folds. A tucked shirt creases at the waist,
             which is where the silhouette differs most from Alex's hanging cut. -->
        <path class="ln" stroke-width="2.1" d="M136 250 q20 -20 46 -32" opacity="0.5"/>
        <path class="ln" stroke-width="2.1" d="M284 250 q-20 -20 -46 -32" opacity="0.5"/>
        <path class="ln" stroke-width="1.4" d="M150 470 q28 10 56 2" opacity="0.34"/>
        <path class="ln" stroke-width="1.4" d="M232 476 q26 8 52 -2" opacity="0.28"/>
        <path d="M270 300 q16 60 14 130 q-2 58 -5 114 h-26 q4 -126 -2 -192
           q-2 -32 19 -52 z" fill="var(--irx-shadow)" opacity="0.14"/>
    </g>
</svg>