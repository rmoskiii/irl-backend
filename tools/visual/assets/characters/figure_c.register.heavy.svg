<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220"
     id="figure_c.register.heavy" data-asset="figure_c" data-kind="register"
     data-register="heavy" data-neck-anchor="100,210" data-register-rotate="-10" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <!-- IRX 2B.7 = figure_c register: heavy (Ray).

         Same register contract as figure_a and figure_b: viewBox 0 0 200 220,
         neckAnchor 100,210, one atomic character_head group, rotation is tilt only
         within +/-16.

         TILT -10. From the locked matrix: open 0, guarded -5, heavy -10, set -15,
         squared +8. Every adjacent pair in the scenario graph clears 5 degrees off
         those five values, and `open` is the zero the others are measured from.

         Head base must span x 81..123 at y 175..195 to meet figure_c's neck
         (anchors.characters.figure_c.neckSpan, x81..119 from y170).

         Ray's own construction, not Alex recoloured and not Jessica reshaped:
           - LONG head, not square. headHeight 186 against figure_b's 178, on a
             narrower cranium, so the face reads tall where Alex's reads wide.
           - receding hairline with two temple recessions and a high centre point.
             This is the single strongest identity signal at 390pt: Alex has an
             unbroken low hairline, Ray's is cut back on both sides.
           - grey at the temples, carried by tone rather than by a drawn edge
           - heavy brow, deep-set eyes, a long straight nose
           - age drawn, not implied: two forehead lines, nasolabial folds, a
             crease under each eye. Alex and Jessica have none of these.
           - square jaw with a flat chin

         Derived from the APPROVED `open` baseline. Cranium, hair, ears, skin
         tones, neck column, forehead line and nose are copied byte for byte;
         only brows, lids, pupils, creases, nasolabial strength, mouth, jaw
         weight and tilt differ. Identity does not change between registers.

         'heavy' carried by: head tilted 10 degrees, upper lids well down, brow ends
         falling away outward, under-eye creases at full strength, mouth slack and
         turned a fraction at the corners. Tired and distracted resolve here - a man
         four deliveries into a bad month, not an unhappy one. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line - identical to neighbourhood */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* character - career */
        --irx-skin-c:        #D9A886;
        --irx-skin-c-shade:  #B98565;
        --irx-hair-c:        #6E655C;
        --irx-hair-c-light:  #8A8076;
        --irx-skin-d:        #E0B294;
        --irx-skin-d-shade:  #BE8D6F;
        --irx-hair-d:        #4A4038;
        --irx-hair-d-light:  #6A5C50;
        /* lips: figure_c skin with a pink shift. NOT the line colour - filling the
        mouth with --irx-line reads as black lips. */
        --irx-lip-c:         #B57F66;
        --irx-mouth-c:       #6B4436;

        /* wardrobe: work (figure_c) */
        --irx-shirt-c:       #9FA9B4;
        --irx-shirt-c-dark:  #7E8894;
        --irx-shirt-c-fold:  #6B7480;

        /* accent - career district */
        --irx-accent:        #7EA6DB;
        --irx-accent-dim:    #5F7FA9;

        /* stroke weights - identical to neighbourhood */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln  { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .sk  { fill: var(--irx-skin-c); }
        .skd { fill: var(--irx-skin-c-shade); }
        .ha  { fill: var(--irx-hair-c); }
        .hal { fill: var(--irx-hair-c-light); }
    </style></defs>

    <g id="character_head">
        <!-- cranium: long and narrow. Widest at x 48..152 across the temples,
             drawing in to a square jaw. -->
        <path d="M100 12 q40 0 50 32 q7 26 4 58 q-2 32 -9 57 q-7 23 -21 33
           q-10 10 -24 10 q-14 0 -24 -10 q-14 -10 -21 -33 q-7 -25 -9 -57
           q-3 -32 4 -58 q10 -32 50 -32 z" class="sk"/>
        <path d="M141 56 q11 26 12 56 q1 30 -9 51 q-6 13 -15 19
           q11 -26 14 -62 q3 -37 -2 -64 z" class="skd" opacity="0.15"/>
        <path class="ln" stroke-width="3.8"
              d="M100 12 q40 0 50 32 q7 26 4 58 q-2 32 -9 57 q-7 23 -21 33
           q-10 10 -24 10 q-14 0 -24 -10 q-14 -10 -21 -33 q-7 -25 -9 -57
           q-3 -32 4 -58 q10 -32 50 -32 z"/>
        <!-- jaw: square, and hugging the contour so the chin reads flat -->
        <path class="ln" stroke-width="3.8" d="M97 201 q-11 -1 -21 -9 q-14 -10 -21 -33" opacity="0.26"/>
        <path class="ln" stroke-width="3.8" d="M103 201 q11 -1 21 -9 q14 -10 21 -33" opacity="0.16"/>

        <!-- ears -->
        <path d="M46 96 q-9 -2 -11 9 q-2 13 9 16" class="sk"/>
        <path class="ln" stroke-width="2.2" d="M46 96 q-9 -2 -11 9 q-2 13 9 16"/>
        <path d="M154 96 q9 -2 11 9 q2 13 -9 16" class="sk"/>
        <path class="ln" stroke-width="2.2" d="M154 96 q9 -2 11 9 q2 13 -9 16"/>

        <!-- forehead lines. Age is drawn, not implied - neither Neighbourhood
             figure carries these and they read at 390pt as years. -->
        <path class="ln" stroke-width="1.6" d="M70 74 q30 -5 60 1" opacity="0.22"/>

        <!-- brow: heavy, level, no inward angle -->
        <path class="ln" stroke-width="2.7" d="M64 98 q17 -3 34 -4" opacity="0.78"/>
        <path class="ln" stroke-width="2.7" d="M136 98 q-17 -3 -34 -4" opacity="0.78"/>

        <!-- eyes: deep set under the brow, with a crease beneath each -->
        <path class="ln" stroke-width="3.4" d="M68 114 q13 -4 26 0"/>
        <path class="ln" stroke-width="1.4" d="M70 119 q12 3 24 0" opacity="0.7"/>
        <circle cx="81" cy="117" r="2.9" fill="var(--irx-line)"/>
        <path class="ln" stroke-width="1.6" d="M70 128 q12 5 24 -1" opacity="0.32"/>
        <path class="ln" stroke-width="3.4" d="M106 113 q13 -4 26 1"/>
        <path class="ln" stroke-width="1.4" d="M108 119 q12 3 24 -1" opacity="0.7"/>
        <circle cx="119" cy="117" r="2.9" fill="var(--irx-line)"/>
        <path class="ln" stroke-width="1.6" d="M107 128 q12 5 24 -1" opacity="0.32"/>

        <!-- nose: long and straight, a defined base. The length is most of what
             makes this face read long. -->
        <path class="ln" stroke-width="2.2" d="M97 118 q-5 20 4 27" opacity="0.9"/>
        <path class="ln" stroke-width="1.6" d="M101 145 q7 2 12 -3" opacity="0.6"/>

        <!-- nasolabial folds -->
        <path class="ln" stroke-width="1.6" d="M88 150 q-6 13 -4 24" opacity="0.30"/>
        <path class="ln" stroke-width="1.6" d="M116 151 q6 13 4 23" opacity="0.26"/>

        <!-- mouth: closed, level, no upward curve. Lip tone, never line colour. -->
        <path d="M85 164 q15 -4 30 1 q-3 8 -15 8 q-13 0 -15 -9 z" fill="var(--irx-lip-c)"/>
        <path class="ln" stroke-width="2.6" d="M85 166 q15 3 30 -1"/>

        <!-- hair: short back and sides, RECEDING.

             The two temple recessions and the high centre point are the identity.
             Alex's hairline is an unbroken curve across the forehead; Ray's is cut
             back on both sides and that difference survives the downscale when
             nothing else in the face does.

             Grey is carried by the lit plane at the temples rather than by a drawn
             edge, so it never reads as a highlight sitting on top of the hair. -->
        <g id="hair">
            <!-- What is left of it. Sides only, bare crown.

                 The outer edge is SAMPLED FROM THE CRANIUM PATH rather than guessed:
                 that quadratic runs x48.5 at y50, x45.5 at y71, x45.2 at y88. The hair
                 sits 1.5 INSIDE those values, so it can never break the silhouette:
                 the head's own 3.8 stroke is centred on the contour and the hair ends
                 under it. The previous pass sat at x54 up top - inboard, so the
                 hair read as painted on his face - and at x46 down low, outboard of the
                 contour near the ear. Both errors at once.

                 ENDS AT y=88. The ear is drawn from y94, so the hair stops just above
                 it. Running to y118 as before took it past the ear and down to eye
                 level, which is not where a receding hairline ends.

                 Tapered at both ends - blunt ends read as a clip pasted on the head.
                 Greying carried by tone on the outer half, no drawn edge. -->
            <path d="M50 50 C 47 62 46.3 76 46.9 88 C 49.5 90 53 90 55 88
             C 56.5 76 58.5 62 63 53 C 59.5 47.5 53 47.8 50 50 Z" class="ha"/>
            <path d="M150 50 C 153 62 153.7 76 153.1 88 C 150.5 90 147 90 145 88
             C 143.5 76 141.5 62 137 53 C 140.5 47.5 147 47.8 150 50 Z" class="ha"/>
            <path d="M50 50 C 47 62 46.3 76 46.9 88 C 48.3 89.4 49.9 89.6 51.1 89
             C 50.3 76 51.1 62 54.5 51.6 C 52.7 49 51.3 48.8 50 50 Z"
                  class="hal" opacity="0.44"/>
            <path d="M150 50 C 153 62 153.7 76 153.1 88 C 151.7 89.4 150.1 89.6 148.9 89
             C 149.7 76 148.9 62 145.5 51.6 C 147.3 49 148.7 48.8 150 50 Z"
                  class="hal" opacity="0.32"/>
            <!-- inner edge and the lower end only: the outer edge is the head's own
                 contour and is stroked once, by the head -->
            <path class="ln" stroke-width="2.4"
                  d="M63 53 C 58.5 62 56.5 76 55 88 C 53 90 49.5 90 46.9 88"/>
            <path class="ln" stroke-width="2.4"
                  d="M137 53 C 141.5 62 143.5 76 145 88 C 147 90 150.5 90 153.1 88"/>
        </g>
    </g>/g>/g>/g>/g>
</svg>