<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs><style>/* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* vignettes */
        --irx-vig-light:     #B3ABA0;
        --irx-vig-base:      #8C857C;
        --irx-vig-mid:       #635D56;
        --irx-vig-dark:      #3B3733;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;

        /* ==== the streets — six characters, deliberately differentiated ==== */
        /* figure_e — Bola. African, fifties. */
        --irx-skin-e:        #6B4A33;
        --irx-skin-e-shade:  #4F3524;
        --irx-hair-e:        #2E2622;
        --irx-hair-e-light:  #4A3F38;
        --irx-lip-e:         #7A4F42;
        --irx-mouth-e:       #3A2019;
        /* figure_f — Jay. Brown, mid-complexion, nineteen. */
        --irx-skin-f:        #96684A;
        --irx-skin-f-shade:  #754F36;
        --irx-hair-f:        #221A15;
        --irx-hair-f-light:  #3A2B22;
        --irx-lip-f:         #9C6552;
        --irx-mouth-f:       #4A2A22;
        /* figure_g — Tunde. African, thirties to forties. */
        --irx-skin-g:        #5E4030;
        --irx-skin-g-shade:  #452D21;
        --irx-hair-g:        #2A221E;
        --irx-hair-g-light:  #423731;
        --irx-lip-g:         #6E463A;
        --irx-mouth-g:       #331C16;
        /* figure_h — Dee. White, twenty-seven. */
        --irx-skin-h:        #C9A184;
        --irx-skin-h-shade:  #A87F64;
        --irx-hair-h:        #5A4332;
        --irx-hair-h-light:  #775843;
        --irx-lip-h:         #B3806C;
        --irx-mouth-h:       #6B4034;
        /* figure_i — Kai. Brown, a different complexion from Jay. */
        --irx-skin-i:        #A8794F;
        --irx-skin-i-shade:  #86603D;
        --irx-hair-i:        #281F1A;
        --irx-hair-i-light:  #41332B;
        --irx-lip-i:         #A87057;
        --irx-mouth-i:       #4F2E23;
        /* figure_j — Amara. Caramel, nineteen to twenty. */
        --irx-skin-j:        #B08258;
        --irx-skin-j-shade:  #8E6644;
        --irx-hair-j:        #2B211C;
        --irx-hair-j-light:  #463831;
        --irx-lip-j:         #AE7460;
        --irx-mouth-j:       #533026;

        /* ==== the streets — wax-print wardrobe palette ==== */
        /* The existing Neighbourhood set is a lit-interior palette: warm browns, cool
        greys, one amber accent. It has no saturated cloth colour at all, so West
        African print had to be invented or faked. Added here rather than faked.
        Same D14 churn as the character tokens: the preamble is inlined into every
        composed frame, so this rewrites canonicalSha256 on the existing fixtures
        and changes no geometry. */
        --irx-wax-teal:      #1F6F63;
        --irx-wax-teal-dark: #144F46;
        --irx-wax-plum:      #6E3A8C;
        --irx-wax-plum-dark: #4E2866;
        --irx-wax-red:       #C24A2E;
        --irx-wax-red-dark:  #93331C;
        --irx-wax-gold:      #E3A83C;
        --irx-wax-cream:     #EADBC2;
        }
        /* @tokens-end */</style><style>.bl-ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }</style></defs>
    <g id="character_back">
        <path id="bl-shadow" fill="var(--irx-shadow)" opacity="0.26" d="M146 214 q68 -18 136 0 q30 100 26 214 q-8 134 -12 372 h-164 q-6 -238 -10 -372 q-6 -114 24 -214 z"/>
    </g>
    <g id="character_body">
        <path id="bl-neck" fill="var(--irx-skin-e-shade)" d="M191 176 h38 v42 h-38 z"/>
        <path id="bl-torso" fill="var(--irx-skin-e)" d="M214 204 q-52 2 -78 32 q-20 22 -25 50 q-8 40 -9 82 q-2 40 0 74 q1 24 3 40 h218 q2 -16 3 -40 q2 -34 0 -74 q-1 -42 -9 -82 q-5 -28 -25 -50 q-26 -30 -78 -32 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="bl-torso-sh" fill="var(--irx-skin-e-shade)" d="M262 236 q20 22 25 50 q8 40 9 82 q2 40 0 74 q-1 24 -3 40 h-42 q4 -20 6 -42 q3 -38 1 -74 q-1 -42 -10 -80 q-5 -26 -20 -46 z"/>
        <path id="bl-arm-l" fill="var(--irx-skin-e)" d="M140 252 q-38 18 -48 58 q-10 34 -11 74 q-2 48 2 92 q2 34 6 58 q24 8 48 0 q-5 -28 -8 -66 q-3 -48 -1 -92 q2 -38 11 -68 q6 -24 19 -38 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="bl-arm-r" fill="var(--irx-skin-e)" d="M288 252 q38 18 48 58 q10 34 11 74 q2 48 -2 92 q-2 34 -6 58 q-24 8 -48 0 q5 -28 8 -66 q3 -48 1 -92 q-2 -38 -11 -68 q-6 -24 -19 -38 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="bl-arm-r-sh" fill="var(--irx-skin-e-shade)" d="M312 280 q13 30 15 70 q2 48 -2 92 q-2 34 -6 58 q-12 4 -24 3 q5 -28 8 -66 q3 -48 1 -92 q-2 -38 -11 -68 z"/>
        <path id="bl-legs" fill="var(--irx-skin-e)" d="M146 468 h128 v332 h-128 z"/>
    </g>
    <g id="character_contact">
        <path id="bl-contact" fill="var(--irx-shadow)" opacity="0.32" d="M100 486 q114 -14 220 0 q6 12 0 22 q-112 -12 -220 0 q-6 -10 0 -22 z"/>
    </g>
    <g id="character_front">
        <path id="bl-hand-l" fill="var(--irx-skin-e)" d="M100 484 q28 -8 54 -2 q10 11 5 24 q-30 8 -58 1 q-8 -11 -1 -23 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round"/>
        <path id="bl-hand-r" fill="var(--irx-skin-e)" d="M266 484 q28 -6 56 0 q7 12 0 23 q-29 8 -58 1 q-6 -12 2 -24 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round"/>
        <path id="bl-hand-f" class="bl-ln" stroke-width="var(--irx-stroke-fine)" d="M116 492 v13 M134 492 v13 M284 492 v13 M302 492 v13"/>
    </g>
</svg>