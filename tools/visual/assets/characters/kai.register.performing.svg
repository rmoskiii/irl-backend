<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" data-neck-anchor="100,210" data-register-rotate="-7" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs><style>/* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* vignettes */
        --irx-vig-light:     #B3ABA0;
        --irx-vig-base:      #8C857C;
        --irx-vig-mid:       #635D56;
        --irx-vig-dark:      #3B3733;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;

        /* ==== the streets — six characters, deliberately differentiated ==== */
        /* figure_e — Bola. African, fifties. */
        --irx-skin-e:        #6B4A33;
        --irx-skin-e-shade:  #4F3524;
        --irx-hair-e:        #2E2622;
        --irx-hair-e-light:  #4A3F38;
        --irx-lip-e:         #7A4F42;
        --irx-mouth-e:       #3A2019;
        /* figure_f — Jay. Brown, mid-complexion, nineteen. */
        --irx-skin-f:        #96684A;
        --irx-skin-f-shade:  #754F36;
        --irx-hair-f:        #221A15;
        --irx-hair-f-light:  #3A2B22;
        --irx-lip-f:         #9C6552;
        --irx-mouth-f:       #4A2A22;
        /* figure_g — Tunde. African, thirties to forties. */
        --irx-skin-g:        #5E4030;
        --irx-skin-g-shade:  #452D21;
        --irx-hair-g:        #2A221E;
        --irx-hair-g-light:  #423731;
        --irx-lip-g:         #6E463A;
        --irx-mouth-g:       #331C16;
        /* figure_h — Dee. White, twenty-seven. */
        --irx-skin-h:        #C9A184;
        --irx-skin-h-shade:  #A87F64;
        --irx-hair-h:        #5A4332;
        --irx-hair-h-light:  #775843;
        --irx-lip-h:         #B3806C;
        --irx-mouth-h:       #6B4034;
        /* figure_i — Kai. Brown, a different complexion from Jay. */
        --irx-skin-i:        #A8794F;
        --irx-skin-i-shade:  #86603D;
        --irx-hair-i:        #281F1A;
        --irx-hair-i-light:  #41332B;
        --irx-lip-i:         #A87057;
        --irx-mouth-i:       #4F2E23;
        /* figure_j — Amara. Caramel, nineteen to twenty. */
        --irx-skin-j:        #B08258;
        --irx-skin-j-shade:  #8E6644;
        --irx-hair-j:        #2B211C;
        --irx-hair-j-light:  #463831;
        --irx-lip-j:         #AE7460;
        --irx-mouth-j:       #533026;

        /* ==== the streets — wax-print wardrobe palette ==== */
        /* The existing Neighbourhood set is a lit-interior palette: warm browns, cool
        greys, one amber accent. It has no saturated cloth colour at all, so West
        African print had to be invented or faked. Added here rather than faked.
        Same D14 churn as the character tokens: the preamble is inlined into every
        composed frame, so this rewrites canonicalSha256 on the existing fixtures
        and changes no geometry. */
        --irx-wax-teal:      #1F6F63;
        --irx-wax-teal-dark: #144F46;
        --irx-wax-plum:      #6E3A8C;
        --irx-wax-plum-dark: #4E2866;
        --irx-wax-red:       #C24A2E;
        --irx-wax-red-dark:  #93331C;
        --irx-wax-gold:      #E3A83C;
        --irx-wax-cream:     #EADBC2;
        /* kit blues. The Neighbourhood set has no true blue at all - --irx-cool-spill
        and --irx-jacket are both grey-blues for lit interiors, and a football
        jersey in either reads as grey. Two added rather than faked. */
        --irx-wax-blue:      #4A86C4;
        --irx-wax-blue-dark: #2F5E91;
        }
        /* @tokens-end */</style><style>.ka-ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }</style></defs>
    <g id="character_head">
        <path id="ka-h-neck" fill="var(--irx-skin-i-shade)" d="M85 150 h38 v70 h-38 z"/>
        <path id="ka-h-neck-f" class="ka-ln" stroke-width="var(--irx-stroke)" d="M85 176 v44 M123 176 v44"/>
        <path id="ka-h-ear-l" fill="var(--irx-skin-i-shade)" d="M50 100 q-11 0 -11 14 q0 19 13 24 q7 1 8 -7 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="ka-h-ear-r" fill="var(--irx-skin-i-shade)" d="M150 100 q11 0 11 14 q0 19 -13 24 q-7 1 -8 -7 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="ka-h-skull" fill="var(--irx-skin-i)" d="M100 34 q40 0 50 30 q6 19 5 38 q-1 23 -6 42 q-6 26 -16 40 q-12 18 -25 22 q-4 1 -11 1 q-7 0 -11 -1 q-13 -4 -25 -22 q-10 -14 -16 -40 q-5 -19 -6 -42 q-1 -19 5 -38 q10 -30 50 -30 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="ka-h-hair" fill="var(--irx-hair-i)" d="M56 42 q-2 -30 10 -34 q6 -18 34 -18 q28 0 34 18 q12 4 10 34 q-6 -12 -14 -14 q-14 -6 -30 -6 q-16 0 -30 6 q-8 2 -14 14 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="ka-h-fade-l" fill="var(--irx-hair-i)" d="M55 44 q6 -6 12 -6 q-4 22 -3 42 q-8 -14 -9 -36 z"/>
        <path id="ka-h-fade-r" fill="var(--irx-hair-i)" d="M145 44 q-6 -6 -12 -6 q4 22 3 42 q8 -14 9 -36 z"/>
        <path id="ka-h-lineup" class="ka-ln" stroke-width="var(--irx-stroke-fine)" d="M70 42 q30 -10 60 0"/>
        <path id="ka-h-brow" class="ka-ln" stroke-width="var(--irx-stroke)" d="M64 92 q16 -10 30 -4 M136 90 q-16 -10 -30 -4"/>
        <path id="ka-h-eyew-l" fill="var(--irx-cloth-inner)" d="M70 113 q13 -11 26 -2 q-13 9 -26 2 z"/>
        <path id="ka-h-eyew-r" fill="var(--irx-cloth-inner)" d="M130 112 q-13 -11 -26 -2 q13 9 26 2 z"/>
        <path id="ka-h-iris-l" fill="var(--irx-line)" d="M88 106 q4.5 0 4.5 4.5 q0 4.5 -4.5 4.5 q-4.5 0 -4.5 -4.5 q0 -4.5 4.5 -4.5 z"/>
        <path id="ka-h-iris-r" fill="var(--irx-line)" d="M122 105 q4.5 0 4.5 4.5 q0 4.5 -4.5 4.5 q-4.5 0 -4.5 -4.5 q0 -4.5 4.5 -4.5 z"/>
        <path id="ka-h-lid-l" class="ka-ln" stroke-width="var(--irx-stroke-fine)" d="M70 113 q13 -11 26 -2"/>
        <path id="ka-h-lid-r" class="ka-ln" stroke-width="var(--irx-stroke-fine)" d="M130 112 q-13 -11 -26 -2"/>
        <path id="ka-h-nose" class="ka-ln" stroke-width="var(--irx-stroke-fine)" d="M99 122 q-5 13 -1 18 q5 3 10 1"/>
        <path id="ka-h-lip-up" fill="var(--irx-lip-i)" d="M84 156 q16 -6 32 0 q-7 3 -16 3 q-9 0 -16 -3 z"/>
        <path id="ka-h-lip-lo" fill="var(--irx-lip-i)" d="M85 168 q15 6 30 0 q-4 10 -15 10 q-11 0 -15 -10 z"/>
        <path id="ka-h-mouth" fill="var(--irx-mouth-i)" d="M84 156 q16 -2 32 0 q-1 12 -16 12 q-15 0 -16 -12 z"/>
        <path id="ka-h-mouth-f" class="ka-ln" stroke-width="var(--irx-stroke-fine)" d="M84 156 q16 -2 32 0"/>
    </g>
</svg>