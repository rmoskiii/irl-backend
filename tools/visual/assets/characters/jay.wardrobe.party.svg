<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs><style>/* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* vignettes */
        --irx-vig-light:     #B3ABA0;
        --irx-vig-base:      #8C857C;
        --irx-vig-mid:       #635D56;
        --irx-vig-dark:      #3B3733;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;

        /* ==== the streets — six characters, deliberately differentiated ==== */
        /* figure_e — Bola. African, fifties. */
        --irx-skin-e:        #6B4A33;
        --irx-skin-e-shade:  #4F3524;
        --irx-hair-e:        #2E2622;
        --irx-hair-e-light:  #4A3F38;
        --irx-lip-e:         #7A4F42;
        --irx-mouth-e:       #3A2019;
        /* figure_f — Jay. Brown, mid-complexion, nineteen. */
        --irx-skin-f:        #96684A;
        --irx-skin-f-shade:  #754F36;
        --irx-hair-f:        #221A15;
        --irx-hair-f-light:  #3A2B22;
        --irx-lip-f:         #9C6552;
        --irx-mouth-f:       #4A2A22;
        /* figure_g — Tunde. African, thirties to forties. */
        --irx-skin-g:        #5E4030;
        --irx-skin-g-shade:  #452D21;
        --irx-hair-g:        #2A221E;
        --irx-hair-g-light:  #423731;
        --irx-lip-g:         #6E463A;
        --irx-mouth-g:       #331C16;
        /* figure_h — Dee. White, twenty-seven. */
        --irx-skin-h:        #C9A184;
        --irx-skin-h-shade:  #A87F64;
        --irx-hair-h:        #5A4332;
        --irx-hair-h-light:  #775843;
        --irx-lip-h:         #B3806C;
        --irx-mouth-h:       #6B4034;
        /* figure_i — Kai. Brown, a different complexion from Jay. */
        --irx-skin-i:        #A8794F;
        --irx-skin-i-shade:  #86603D;
        --irx-hair-i:        #281F1A;
        --irx-hair-i-light:  #41332B;
        --irx-lip-i:         #A87057;
        --irx-mouth-i:       #4F2E23;
        /* figure_j — Amara. Caramel, nineteen to twenty. */
        --irx-skin-j:        #B08258;
        --irx-skin-j-shade:  #8E6644;
        --irx-hair-j:        #2B211C;
        --irx-hair-j-light:  #463831;
        --irx-lip-j:         #AE7460;
        --irx-mouth-j:       #533026;
        }
        /* @tokens-end */</style><style>.jf-ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }</style></defs>
    <g id="character_clothing">
        <path id="jp-shirt" fill="var(--irx-cloth)" d="M214 192 q-40 2 -62 26 q-16 18 -20 40 q-6 34 -6 70 q-1 60 3 110 q2 16 3 28 h164 q1 -12 3 -28 q4 -50 3 -110 q0 -36 -6 -70 q-4 -22 -20 -40 q-22 -24 -62 -26 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jp-shirt-sh" fill="var(--irx-cloth-dark)" d="M256 226 q16 18 20 40 q6 34 6 70 q1 60 -3 110 q-2 16 -3 28 h-34 q4 -16 6 -34 q5 -52 4 -110 q-1 -36 -7 -68 q-4 -20 -14 -34 z"/>
        <path id="jp-sleeve-l" fill="var(--irx-cloth)" d="M156 232 q-32 14 -42 48 q-9 30 -10 66 q-2 44 2 84 q2 34 6 58 q20 7 40 0 q-5 -28 -8 -62 q-3 -44 -1 -84 q2 -34 9 -60 q5 -20 16 -34 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jp-sleeve-r" fill="var(--irx-cloth)" d="M272 232 q32 14 42 48 q9 30 10 66 q2 44 -2 84 q-2 34 -6 58 q-20 7 -40 0 q5 -28 8 -62 q3 -44 1 -84 q-2 -34 -9 -60 q-5 -20 -16 -34 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jp-collar" fill="var(--irx-cloth-dark)" d="M214 176 q-24 1 -30 12 q-3 8 -2 16 q14 -8 32 -8 q18 0 32 8 q1 -8 -2 -16 q-6 -11 -30 -12 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jp-collar-l" fill="var(--irx-cloth-dark)" d="M190 196 q-10 6 -14 16 q12 12 22 28 q3 -24 4 -44 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jp-collar-r" fill="var(--irx-cloth-dark)" d="M238 196 q10 6 14 16 q-12 12 -22 28 q-3 -24 -4 -44 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jp-placket" class="jf-ln" stroke-width="var(--irx-stroke-fine)" d="M214 240 v222 M205 246 v212"/>
        <path id="jp-btn0" fill="var(--irx-line)" d="M214 276 q3 0 3 3 q0 3 -3 3 q-3 0 -3 -3 q0 -3 3 -3 z"/>
        <path id="jp-btn1" fill="var(--irx-line)" d="M214 322 q3 0 3 3 q0 3 -3 3 q-3 0 -3 -3 q0 -3 3 -3 z"/>
        <path id="jp-btn2" fill="var(--irx-line)" d="M214 368 q3 0 3 3 q0 3 -3 3 q-3 0 -3 -3 q0 -3 3 -3 z"/>
        <path id="jp-btn3" fill="var(--irx-line)" d="M214 414 q3 0 3 3 q0 3 -3 3 q-3 0 -3 -3 q0 -3 3 -3 z"/>
        <path id="jp-cuff-l" fill="var(--irx-cloth-dark)" d="M114 470 q22 8 44 0 q2 10 0 20 q-22 8 -44 0 q-2 -10 0 -20 z"/>
        <path id="jp-cuff-r" fill="var(--irx-cloth-dark)" d="M268 470 q22 8 44 0 q2 10 0 20 q-22 8 -44 0 q-2 -10 0 -20 z"/>
        <path id="jp-trous" fill="var(--irx-curtain-dark)" d="M152 462 h116 q6 78 10 160 q4 74 6 178 h-50 q-4 -98 -10 -162 q-6 -54 -14 -90 q-8 36 -14 90 q-6 64 -10 162 h-50 q2 -104 6 -178 q4 -82 10 -160 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jp-shoe-l" fill="var(--irx-outside-dark)" d="M140 780 h56 v20 h-68 q-2 -12 12 -20 z"/>
        <path id="jp-shoe-r" fill="var(--irx-outside-dark)" d="M248 780 h54 q14 8 12 20 h-66 z"/>
    </g>
</svg>