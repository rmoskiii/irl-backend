<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220"
     id="figure_b.register.bright" data-asset="figure_b" data-kind="register"
     data-register="bright" data-neck-anchor="100,210" data-register-rotate="-5">
<!-- IRX 2B.1 = figure_b register: bright (Alex).

     Used by act2_alex_reveal ("I'm going to propose") and act4_engagement_party.
     This is the register the whole scenario's dramatic irony rests on: the
     player knows what this face costs and Alex does not.

     A smile here is NOT a firewall breach. The firewall forbids the face
     delivering a verdict on the character; it does not forbid the character
     having a state the prose already states outright ("Alex lights up",
     "barely keeping it together"). Withholding his happiness would misreport
     the node.

     SILHOUETTE CONSTRAINT, recorded because it is a real architectural
     consequence: Alex has a fixed short cut, so unlike Jessica his registers
     CANNOT separate on hair. All the shipping-scale separation has to come from
     head tilt, chin height and mouth aperture. 'bright' therefore carries a 5
     degree tilt and a lifted chin - deliberately the largest tilt in his set.

     Hair block is copied VERBATIM from figure_b.register.open. Registers are
     atomic, so the cut must be identical across all five or he changes haircut
     between nodes. validate_assets.py enforces this. -->
<defs><style>
/* @tokens-begin */
:root {
  /* line */
  --irx-line:          #241D19;
  --irx-line-soft:     #3B302A;
  --irx-shadow:        #2A231E;

  /* architecture */
  --irx-wall:          #5C6A5F;
  --irx-wall-dark:     #4E5A51;
  --irx-wall-pattern:  #556359;
  --irx-tile:          #B5A992;
  --irx-tile-alt:      #A49980;
  --irx-floor:         #5E4D3E;

  /* window */
  --irx-sky-high:      #334051;
  --irx-sky-mid:       #4D4656;
  --irx-sky-low:       #785A4F;
  --irx-outside-dark:  #2A333E;
  --irx-curtain:       #424E56;
  --irx-curtain-dark:  #38424A;

  /* joinery */
  --irx-cabinet:       #785D44;
  --irx-cabinet-dark:  #634C36;
  --irx-counter:       #947553;
  --irx-counter-edge:  #7B5F43;

  /* character */
  --irx-skin:          #A87A5A;
  --irx-skin-shade:    #875D42;
  /* figure_b: same warm hazel family, one step deeper than figure_a */
  --irx-skin-b:        #8E6244;
  --irx-skin-b-shade:  #6E4A32;
  /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
     mouth with --irx-line reads as black lips. */
  --irx-lip-b:         #96604F;
  --irx-mouth-b:       #4A2C24;
  --irx-hair:          #41322A;
  --irx-hair-light:    #554136;
  /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
  --irx-hair-b:        #241A16;
  --irx-hair-b-light:  #3D2C24;

  /* wardrobe: home_casual */
  --irx-cloth:         #A8603F;
  --irx-cloth-dark:    #894C31;
  --irx-cloth-inner:   #D9CDBC;

  /* props */
  --irx-glass:         #BCC8C3;
  --irx-glass-dark:    #9AA8A2;
  --irx-highlight:     #FFFFFF;
  --irx-jacket:        #4F5A63;
  --irx-jacket-dark:   #3D464E;

  /* accent — neighbourhood district, warm light only */
  --irx-accent:        #FFC15E;
  --irx-accent-dim:    #C89A4E;
  --irx-lamp-warm:     #F2C77E;
  --irx-cool-spill:    #7E93A8;

  /* vignettes: montage panels only. Desaturated and reduced, so compressed
     time reads differently from present tense without a caption saying so.
     A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
     validate_assets.py rule 13. */
  --irx-vig-light:     #B3ABA0;
  --irx-vig-base:      #8C857C;
  --irx-vig-mid:       #635D56;
  --irx-vig-dark:      #3B3733;

  /* stroke weights */
  --irx-stroke-xheavy: 6.6;
  --irx-stroke-heavy:  5;
  --irx-stroke:        3.4;
  --irx-stroke-fine:   2.1;
  --irx-stroke-hair:   1.4;
}
/* @tokens-end */
.ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.sk  { fill: var(--irx-skin-b); }
.skd { fill: var(--irx-skin-b-shade); }
.lip { fill: var(--irx-lip-b); }
.mth { fill: var(--irx-mouth-b); }
.ha  { fill: var(--irx-hair-b); }
.hal { fill: var(--irx-hair-b-light); }
</style></defs>

<g id="character_head">
  <path d="M100 16 q44 0 56 34 q7 26 5 56 q-3 34 -18 52 q-15 18 -43 18
           q-28 0 -43 -18 q-15 -18 -18 -52 q-2 -30 5 -56 q12 -34 56 -34 z" class="sk"/>
  <path class="ln" stroke-width="3.8"
        d="M100 16 q44 0 56 34 q7 26 5 56 q-3 34 -18 52 q-15 18 -43 18
           q-28 0 -43 -18 q-15 -18 -18 -52 q-2 -30 5 -56 q12 -34 56 -34 z"/>
  <path class="ln" stroke-width="4.4" d="M100 176 q-28 0 -43 -18 q-9 -11 -14 -28" opacity="0.5"/>

  <path d="M44 96 q-9 -2 -11 9 q-2 13 9 16" class="sk"/>
  <path class="ln" stroke-width="2.2" d="M44 96 q-9 -2 -11 9 q-2 13 9 16"/>
  <path d="M156 96 q9 -2 11 9 q2 13 -9 16" class="sk"/>
  <path class="ln" stroke-width="2.2" d="M156 96 q9 -2 11 9 q2 13 -9 16"/>

  <!-- brows lifted high and level: the single clearest 'bright' cue at scale -->
  <path class="ln" stroke-width="2.6" d="M63 84 q15 -8 30 -3" opacity="0.9"/>
  <path class="ln" stroke-width="2.6" d="M137 84 q-15 -8 -30 -3" opacity="0.9"/>

  <!-- eyes: wider aperture than 'open', lower lid raised slightly -->
  <path class="ln" stroke-width="3.4" d="M65 105 q12 -9 23 -2"/>
  <path class="ln" stroke-width="1.6" d="M66 113 q11 5 21 0" opacity="0.75"/>
  <circle cx="77" cy="108" r="3.3" fill="var(--irx-line)"/>
  <path class="ln" stroke-width="3.4" d="M112 104 q12 -8 23 2"/>
  <path class="ln" stroke-width="1.6" d="M113 113 q11 5 21 -1" opacity="0.75"/>
  <circle cx="123" cy="108" r="3.3" fill="var(--irx-line)"/>

  <path class="ln" stroke-width="2.0" d="M97 118 q-7 16 5 21" opacity="0.9"/>
  <path class="ln" stroke-width="1.4" d="M102 139 q6 1 10 -2" opacity="0.55"/>

  <!-- mouth: open, mid-sentence. he is talking and cannot stop.
       Three layers, in order: LIP (skin with a pink shift), then the cavity,
       then teeth. Filling the whole aperture with the line colour reads as black
       lips, which is what the first version did. -->
  <path d="M78 146 q22 11 44 0 q-6 22 -22 23 q-16 -1 -22 -23 z" class="lip"/>
  <path d="M85 151 q15 7 30 0 q-4 15 -15 16 q-11 -1 -15 -16 z" class="mth"/>
  <path d="M86 152 q14 6 28 0 q-1 5 -3 6 q-11 3 -22 0 q-2 -1 -3 -6 z"
        fill="var(--irx-tile)" opacity="0.85"/>
  <!-- cheek raise: a short mark either side, not a full smile line -->
  <path class="ln" stroke-width="1.8" d="M70 134 q5 8 6 15" opacity="0.55"/>
  <path class="ln" stroke-width="1.8" d="M130 134 q-5 8 -6 15" opacity="0.55"/>


  <g id="hair">
    <path d="M37 92
             q-2 -28 6 -52
             q12 -32 57 -32
             q45 0 57 32
             q8 24 6 52
             q-8 -14 -26 -20
             q-18 -6 -37 -6
             q-19 0 -37 6
             q-18 6 -26 20 z" class="ha"/>
    <!-- lit crown plane, upper-left key -->
    <path d="M55 50 q14 -26 45 -29 q-21 8 -30 24 q-9 11 -12 22 z"
          class="hal" opacity="0.5"/>
    <!-- outer contour -->
    <path class="ln" stroke-width="3.4"
          d="M37 92 q-2 -28 6 -52 q12 -32 57 -32 q45 0 57 32 q8 24 6 52"/>
    <!-- hairline: same geometry as the band's inner edge, so they cannot drift -->
    <path class="ln" stroke-width="2.6"
          d="M37 92 q8 -14 26 -20 q18 -6 37 -6 q19 0 37 6 q18 6 26 20" opacity="0.9"/>
    <!-- coil texture: short marks only, invisible at shipping scale by design -->
    <g class="ln" stroke-width="1.4" opacity="0.22">
      <path d="M64 60 q6 -5 11 0"/>
      <path d="M85 42 q6 -5 11 0"/>
      <path d="M107 40 q6 -5 11 0"/>
      <path d="M128 52 q6 -5 10 1"/>
      <path d="M76 60 q6 -5 11 0"/>
      <path d="M115 58 q6 -5 11 0"/>
    </g>
  </g>
</g>
</svg>
