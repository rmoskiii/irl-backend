<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800"
     id="figure_a.wardrobe.formal" data-asset="figure_a" data-kind="wardrobe"
     data-wardrobe="formal" data-base-point="210,800">
<!-- IRX 2B.2 = figure_a wardrobe: formal (Jessica).

     Used by act4_avoidant_outside, where she finds you outside the engagement
     party halfway through a cigarette she does not smoke.

     A dark dress with a defined neckline. Deliberately the darkest garment in her
     set: at the party she is the one person in the room who knows, and the value
     drop separates her from every other Jessica wardrobe instantly. -->
<defs><style>
/* @tokens-begin */
:root {
  /* line */
  --irx-line:          #241D19;
  --irx-line-soft:     #3B302A;
  --irx-shadow:        #2A231E;

  /* architecture */
  --irx-wall:          #5C6A5F;
  --irx-wall-dark:     #4E5A51;
  --irx-wall-pattern:  #556359;
  --irx-tile:          #B5A992;
  --irx-tile-alt:      #A49980;
  --irx-floor:         #5E4D3E;

  /* window */
  --irx-sky-high:      #334051;
  --irx-sky-mid:       #4D4656;
  --irx-sky-low:       #785A4F;
  --irx-outside-dark:  #2A333E;
  --irx-curtain:       #424E56;
  --irx-curtain-dark:  #38424A;

  /* joinery */
  --irx-cabinet:       #785D44;
  --irx-cabinet-dark:  #634C36;
  --irx-counter:       #947553;
  --irx-counter-edge:  #7B5F43;

  /* character */
  --irx-skin:          #A87A5A;
  --irx-skin-shade:    #875D42;
  /* figure_b: same warm hazel family, one step deeper than figure_a */
  --irx-skin-b:        #8E6244;
  --irx-skin-b-shade:  #6E4A32;
  /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
     mouth with --irx-line reads as black lips. */
  --irx-lip-b:         #96604F;
  --irx-mouth-b:       #4A2C24;
  --irx-hair:          #41322A;
  --irx-hair-light:    #554136;
  /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
  --irx-hair-b:        #241A16;
  --irx-hair-b-light:  #3D2C24;

  /* wardrobe: home_casual */
  --irx-cloth:         #A8603F;
  --irx-cloth-dark:    #894C31;
  --irx-cloth-inner:   #D9CDBC;

  /* props */
  --irx-glass:         #BCC8C3;
  --irx-glass-dark:    #9AA8A2;
  --irx-highlight:     #FFFFFF;
  --irx-jacket:        #4F5A63;
  --irx-jacket-dark:   #3D464E;

  /* accent — neighbourhood district, warm light only */
  --irx-accent:        #FFC15E;
  --irx-accent-dim:    #C89A4E;
  --irx-lamp-warm:     #F2C77E;
  --irx-cool-spill:    #7E93A8;

  /* vignettes: montage panels only. Desaturated and reduced, so compressed
     time reads differently from present tense without a caption saying so.
     A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
     validate_assets.py rule 13. */
  --irx-vig-light:     #B3ABA0;
  --irx-vig-base:      #8C857C;
  --irx-vig-mid:       #635D56;
  --irx-vig-dark:      #3B3733;

  /* stroke weights */
  --irx-stroke-xheavy: 6.6;
  --irx-stroke-heavy:  5;
  --irx-stroke:        3.4;
  --irx-stroke-fine:   2.1;
  --irx-stroke-hair:   1.4;
}
/* @tokens-end */
.ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.hv { stroke-width: 5; }
.md { stroke-width: 3.4; }
.fn { stroke-width: 2.1; }
.xh { stroke-width: 6.6; }
.hr { stroke-width: 1.4; }
.cl  { fill: var(--irx-outside-dark); }
.cld { fill: var(--irx-sky-high); }
.cli { fill: var(--irx-outside-dark); }
</style></defs>

<g id="character_clothing">
  <!-- dress body: dark throughout, no contrasting tee -->
  <path d="M168 244 q42 26 84 0 q14 58 12 134 q-2 90 -5 178 h-98
           q-3 -88 -5 -178 q-2 -76 12 -134 z" class="cli"/>
  <!-- shallow V neckline: the one bright edge on a dark garment -->
  <path d="M172 232 q38 40 76 0 q-6 16 -14 26 q-24 22 -48 0 q-8 -10 -14 -26 z" class="cld"/>
  <path class="ln" stroke-width="3.2" d="M172 232 q38 40 76 0"/>
  <path class="ln" stroke-width="2.2" d="M186 258 q24 20 48 0" opacity="0.7"/>

  <!-- cardigan: left panel -->
  <path d="M128 272 q24 -32 56 -34 q-13 42 -17 104 q-5 82 -3 212 h-54
           q-5 -80 -7 -178 q-2 -88 25 -104 z" class="cl"/>
  <path class="ln hv" d="M128 272 q24 -32 56 -34 q-13 42 -17 104 q-5 82 -3 212"/>
  <path class="ln md" d="M184 238 q-13 42 -17 104 q-5 82 -3 212" />

  <!-- cardigan: right panel -->
  <path d="M292 272 q-24 -32 -56 -34 q13 42 17 104 q5 82 3 212 h54
           q5 -80 7 -178 q2 -88 -25 -104 z" class="cl"/>
  <path class="ln hv" d="M292 272 q-24 -32 -56 -34 q13 42 17 104 q5 82 3 212"/>
  <path class="ln md" d="M236 238 q13 42 17 104 q5 82 3 212"/>

  <!-- sleeves over the reaching arms, cuffs stopping short of the wrists -->
  <path d="M132 268 q-38 56 -44 114 q-4 32 4 60 l42 -14 q-8 -28 -4 -56 q6 -50 38 -97 z" class="cl"/>
  <path class="ln hv" d="M132 268 q-38 56 -44 114 q-4 32 4 60"/>
  <path class="ln hv" d="M166 280 q-33 46 -38 97 q-4 26 2 52"/>
  <path d="M92 442 q28 12 44 -10 l-4 -14 l-42 14 z" class="cld"/>
  <path class="ln md" d="M92 442 q28 12 44 -10"/>

  <path d="M288 268 q38 56 44 114 q4 32 -4 60 l-42 -14 q8 -28 4 -56 q-6 -50 -38 -97 z" class="cl"/>
  <path class="ln hv" d="M288 268 q38 56 44 114 q4 32 -4 60"/>
  <path class="ln hv" d="M254 280 q33 46 38 97 q4 26 -2 52"/>
  <path d="M328 442 q-28 12 -44 -10 l4 -14 l42 14 z" class="cld"/>
  <path class="ln md" d="M328 442 q-28 12 -44 -10"/>

  <!-- soft fabric folds; slightly irregular on purpose -->
  <path class="ln fn" d="M134 320 q10 60 6 128" opacity="0.45"/>
  <path class="ln fn" d="M286 324 q-9 58 -5 124" opacity="0.45"/>
  <path class="ln fn" d="M196 300 q6 74 3 152" opacity="0.3"/>
  <path class="ln fn" d="M224 302 q-5 72 -2 150" opacity="0.3"/>
  <path d="M268 300 q16 62 14 132 q-2 60 -5 118 h-24 q4 -128 -2 -196 q-2 -32 17 -54 z"
        fill="var(--irx-shadow)" opacity="0.16"/>
</g>
</svg>
