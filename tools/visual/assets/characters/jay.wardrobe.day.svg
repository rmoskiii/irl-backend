<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs><style>/* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* vignettes */
        --irx-vig-light:     #B3ABA0;
        --irx-vig-base:      #8C857C;
        --irx-vig-mid:       #635D56;
        --irx-vig-dark:      #3B3733;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;

        /* ==== the streets — six characters, deliberately differentiated ==== */
        /* figure_e — Bola. African, fifties. */
        --irx-skin-e:        #6B4A33;
        --irx-skin-e-shade:  #4F3524;
        --irx-hair-e:        #2E2622;
        --irx-hair-e-light:  #4A3F38;
        --irx-lip-e:         #7A4F42;
        --irx-mouth-e:       #3A2019;
        /* figure_f — Jay. Brown, mid-complexion, nineteen. */
        --irx-skin-f:        #96684A;
        --irx-skin-f-shade:  #754F36;
        --irx-hair-f:        #221A15;
        --irx-hair-f-light:  #3A2B22;
        --irx-lip-f:         #9C6552;
        --irx-mouth-f:       #4A2A22;
        /* figure_g — Tunde. African, thirties to forties. */
        --irx-skin-g:        #5E4030;
        --irx-skin-g-shade:  #452D21;
        --irx-hair-g:        #2A221E;
        --irx-hair-g-light:  #423731;
        --irx-lip-g:         #6E463A;
        --irx-mouth-g:       #331C16;
        /* figure_h — Dee. White, twenty-seven. */
        --irx-skin-h:        #C9A184;
        --irx-skin-h-shade:  #A87F64;
        --irx-hair-h:        #5A4332;
        --irx-hair-h-light:  #775843;
        --irx-lip-h:         #B3806C;
        --irx-mouth-h:       #6B4034;
        /* figure_i — Kai. Brown, a different complexion from Jay. */
        --irx-skin-i:        #A8794F;
        --irx-skin-i-shade:  #86603D;
        --irx-hair-i:        #281F1A;
        --irx-hair-i-light:  #41332B;
        --irx-lip-i:         #A87057;
        --irx-mouth-i:       #4F2E23;
        /* figure_j — Amara. Caramel, nineteen to twenty. */
        --irx-skin-j:        #B08258;
        --irx-skin-j-shade:  #8E6644;
        --irx-hair-j:        #2B211C;
        --irx-hair-j-light:  #463831;
        --irx-lip-j:         #AE7460;
        --irx-mouth-j:       #533026;
        }
        /* @tokens-end */</style><style>.jf-ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }</style></defs>
    <g id="character_clothing">
        <path id="jf-hood" fill="var(--irx-jacket-dark)" d="M176 196 q38 -12 76 0 q14 20 12 40 q-12 -12 -30 -15 q-20 -4 -40 0 q-18 3 -30 15 q-2 -20 12 -40 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-top" fill="var(--irx-jacket)" d="M214 214 q-40 3 -55 18 q-15 16 -17 44 q-3 63 1 120 q3 46 6 74 h130 q4 -28 7 -77 q4 -57 1 -117 q-2 -28 -17 -44 q-15 -15 -56 -18 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-top-sh" fill="var(--irx-jacket-dark)" d="M264 232 q15 16 17 44 q3 60 -1 117 q-3 49 -7 77 h-32 q6 -30 9 -81 q4 -55 1 -115 q-2 -23 -11 -36 z"/>
        <path id="jf-sleeve-l" fill="var(--irx-jacket)" d="M154 212 q-32 11 -42 46 q-9 33 -8 80 q1 41 6 74 q2 14 4 22 h44 q-4 -27 -6 -64 q-3 -45 1 -82 q3 -31 11 -46 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-sleeve-r" fill="var(--irx-jacket)" d="M274 212 q32 11 42 46 q9 33 8 80 q-1 41 -6 74 q-2 14 -4 22 h-44 q4 -27 6 -64 q3 -45 -1 -82 q-3 -31 -11 -46 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-sleeve-r-sh" fill="var(--irx-jacket-dark)" d="M300 236 q14 17 16 54 q1 43 -4 82 q-3 28 -6 42 h-20 q4 -27 6 -64 q3 -45 -1 -82 q-2 -21 -7 -32 z"/>
        <path id="jf-cuff-l" fill="var(--irx-jacket-dark)" d="M112 424 h46 v20 h-46 z"/>
        <path id="jf-cuff-r" fill="var(--irx-jacket-dark)" d="M262 424 h46 v20 h-46 z"/>
        <path id="jf-hem" fill="var(--irx-jacket-dark)" d="M158 448 h124 v22 h-124 z"/>
        <path id="jf-jeans" fill="var(--irx-curtain)" d="M152 466 h116 q6 76 10 158 q4 74 6 176 h-50 q-4 -96 -10 -160 q-6 -54 -14 -88 q-8 34 -14 88 q-6 64 -10 160 h-50 q2 -102 6 -176 q4 -82 10 -158 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-jeans-sh" fill="var(--irx-curtain-dark)" d="M236 470 h32 q6 76 10 158 q4 74 6 172 h-22 q-4 -96 -10 -160 q-6 -52 -16 -86 z"/>
        <path id="jf-shoe-l" fill="var(--irx-outside-dark)" d="M140 780 h56 v20 h-68 q-2 -12 12 -20 z"/>
        <path id="jf-shoe-r" fill="var(--irx-outside-dark)" d="M248 780 h54 q14 8 12 20 h-66 z"/>
        <path id="jf-zip" class="jf-ln" stroke-width="var(--irx-stroke-fine)" d="M214 232 v216"/>
    </g>
</svg>