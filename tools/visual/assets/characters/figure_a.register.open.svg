<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220"
     id="figure_a.register.open" data-asset="figure_a" data-kind="register"
     data-register="open" data-neck-anchor="100,210" data-register-rotate="-2">
<!-- IRX Phase 2A = register: open, revision 2.
     Rev 1 failed QA: eyes too large and round, brows too heavy, mouth read as a
     smirk. The head read as smug, which is the exact opposite of the register
     and a direct breach of the firewall principle (the face was editorialising).

     Rev 2: eyes much smaller with a heavier upper lid than lower, brows thin and
     softened with only the inner ends lifted, mouth small and just parted, jaw
     lengthened and narrowed, hair given asymmetric volume.

     'open' is carried by: head level and squared to camera, direct gaze, inner
     brows raised, lips parted mid-breath. NOT by a smile or a frown. A player
     must not be able to read guilt or innocence off this head. -->
<defs><style>
/* @tokens-begin */
:root {
  /* line */
  --irx-line:          #241D19;
  --irx-line-soft:     #3B302A;
  --irx-shadow:        #2A231E;

  /* architecture */
  --irx-wall:          #5C6A5F;
  --irx-wall-dark:     #4E5A51;
  --irx-wall-pattern:  #556359;
  --irx-tile:          #B5A992;
  --irx-tile-alt:      #A49980;
  --irx-floor:         #5E4D3E;

  /* window */
  --irx-sky-high:      #334051;
  --irx-sky-mid:       #4D4656;
  --irx-sky-low:       #785A4F;
  --irx-outside-dark:  #2A333E;
  --irx-curtain:       #424E56;
  --irx-curtain-dark:  #38424A;

  /* joinery */
  --irx-cabinet:       #785D44;
  --irx-cabinet-dark:  #634C36;
  --irx-counter:       #947553;
  --irx-counter-edge:  #7B5F43;

  /* character */
  --irx-skin:          #A87A5A;
  --irx-skin-shade:    #875D42;
  /* figure_b: same warm hazel family, one step deeper than figure_a */
  --irx-skin-b:        #8E6244;
  --irx-skin-b-shade:  #6E4A32;
  /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
     mouth with --irx-line reads as black lips. */
  --irx-lip-b:         #96604F;
  --irx-mouth-b:       #4A2C24;
  --irx-hair:          #41322A;
  --irx-hair-light:    #554136;
  /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
  --irx-hair-b:        #241A16;
  --irx-hair-b-light:  #3D2C24;

  /* wardrobe: home_casual */
  --irx-cloth:         #A8603F;
  --irx-cloth-dark:    #894C31;
  --irx-cloth-inner:   #D9CDBC;

  /* props */
  --irx-glass:         #BCC8C3;
  --irx-glass-dark:    #9AA8A2;
  --irx-highlight:     #FFFFFF;
  --irx-jacket:        #4F5A63;
  --irx-jacket-dark:   #3D464E;

  /* accent — neighbourhood district, warm light only */
  --irx-accent:        #FFC15E;
  --irx-accent-dim:    #C89A4E;
  --irx-lamp-warm:     #F2C77E;
  --irx-cool-spill:    #7E93A8;

  /* vignettes: montage panels only. Desaturated and reduced, so compressed
     time reads differently from present tense without a caption saying so.
     A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
     validate_assets.py rule 13. */
  --irx-vig-light:     #B3ABA0;
  --irx-vig-base:      #8C857C;
  --irx-vig-mid:       #635D56;
  --irx-vig-dark:      #3B3733;

  /* stroke weights */
  --irx-stroke-xheavy: 6.6;
  --irx-stroke-heavy:  5;
  --irx-stroke:        3.4;
  --irx-stroke-fine:   2.1;
  --irx-stroke-hair:   1.4;

  /* ==== career district ==== */
/* career: architecture */
--irx-career-wall:          #6E757E;
--irx-career-wall-dark:     #5C636B;
--irx-career-wall-pattern:  #666D76;
--irx-career-partition:     #58606A;
--irx-career-partition-dark:#4A5158;
--irx-career-floor:         #4A4F55;
/* career: window, evening. The office is lit; outside is not. */
--irx-career-sky-high:      #1E2836;
--irx-career-sky-mid:       #26303D;
--irx-career-sky-low:       #2E3444;
--irx-career-outside-dark:  #161C25;
/* career: joinery */
--irx-career-desk:          #8A8478;
--irx-career-desk-edge:     #6F6A60;
--irx-career-desk-dark:     #5E5A52;
--irx-career-metal:         #7A828A;
--irx-career-metal-dark:    #626A72;
/* career: light. Overhead fluorescent and one screen. */
--irx-career-fluoro:        #E8EDF2;
--irx-career-fluoro-dim:    #A8B2BC;
--irx-career-screen:        #6E93A8;
--irx-career-screen-glow:   #9FC4D8;
/* career: figure_c (Ray) */
--irx-career-skin-c:        #D9A886;
--irx-career-skin-c-shade:  #B98565;
--irx-career-hair-c:        #6E655C;
--irx-career-hair-c-light:  #8A8076;
--irx-career-lip-c:         #B57F66;
--irx-career-mouth-c:       #6B4436;
/* career: figure_d (Dana) */
--irx-career-skin-d:        #E0B294;
--irx-career-skin-d-shade:  #BE8D6F;
--irx-career-hair-d:        #4A4038;
--irx-career-hair-d-light:  #6A5C50;
/* career: wardrobe work */
--irx-career-shirt-c:       #9FA9B4;
--irx-career-shirt-c-dark:  #7E8894;
--irx-career-shirt-c-fold:  #6B7480;
/* career: wardrobe work_coat */
--irx-career-coat-c:        #4E5661;
--irx-career-coat-c-dark:   #3C434D;
--irx-career-coat-c-fold:   #5C6570;
/* career: accent. Matches district_theme.dart Career accent 0xFF7EA6DB. */
--irx-career-accent:        #7EA6DB;
--irx-career-accent-dim:    #5F7FA9;
}
/* @tokens-end */
.ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.xh { stroke-width: 6.6; }
.hv { stroke-width: 5; }
.md { stroke-width: 3.4; }
.fn { stroke-width: 2.1; }
.hr { stroke-width: 1.4; }
.sk  { fill: var(--irx-skin); }
.skd { fill: var(--irx-skin-shade); }
.ha  { fill: var(--irx-hair); }
.hal { fill: var(--irx-hair-light); }
</style></defs>

<g id="character_head">
  <!-- hair mass behind: fuller on the left, tucked on the right -->
  <path d="M100 6 q58 2 70 54 q11 36 6 76 q-4 32 -12 72 q-14 -32 -16 -72
           q-38 15 -86 0 q-3 40 -18 72 q-8 -42 -12 -76 q-5 -40 7 -76 q13 -50 71 -50 z"
        class="ha"/>

  <!-- face: longer, narrower jaw than rev 1 -->
  <path d="M100 32 q38 0 48 36 q8 30 3 60 q-5 34 -21 52 q-13 15 -30 15 q-17 0 -30 -15
           q-16 -18 -21 -52 q-5 -30 3 -60 q10 -36 48 -36 z" class="sk"/>
  <path class="ln" stroke-width="3.8"
        d="M100 32 q38 0 48 36 q8 30 3 60 q-5 34 -21 52 q-13 15 -30 15
           q-17 0 -30 -15 q-16 -18 -21 -52 q-5 -30 3 -60 q10 -36 48 -36 z"/>
  <!-- weight carried on the lit near jaw, hugging the contour rather than
       floating inside it. matches the treatment in tight and away. -->
  <path class="ln" stroke-width="4.6" d="M100 195 q-17 0 -30 -15 q-9 -10 -14 -26" opacity="0.62"/>
  <path d="M52 102 q-8 -2 -10 8 q-2 12 8 15" class="sk"/>
  <path class="ln fn" d="M52 102 q-8 -2 -10 8 q-2 12 8 15"/>
  <path d="M148 102 q8 -2 10 8 q2 12 -8 15" class="sk"/>
  <path class="ln fn" d="M148 102 q8 -2 10 8 q2 12 -8 15"/>

  <!-- brows: thin, inner ends lifted. subtle by design -->
  <path class="ln" stroke-width="2.4" d="M72 93 q12 -6 24 -2" opacity="0.9"/>
  <path class="ln" stroke-width="2.6" d="M128 93 q-12 -6 -24 -2" opacity="0.92"/>

  <!-- eyes: small. upper lid heavier than lower = the whole trick -->
  <path class="ln" stroke-width="3.4" d="M77 110 q10 -8 20 -1"/>
  <path class="ln hr" d="M78 116 q9 4 18 0" opacity="0.7"/>
  <circle cx="87" cy="112" r="3.4" fill="var(--irx-line)"/>
  <path class="ln" stroke-width="3.6" d="M103 109 q10 -7 20 1"/>
  <path class="ln hr" d="M104 116 q9 4 18 -1" opacity="0.7"/>
  <circle cx="113" cy="112" r="3.4" fill="var(--irx-line)"/>

  <!-- nose: one short stroke -->
  <path class="ln hr" d="M98 124 q-5 14 4 18" opacity="0.85"/>

  <!-- mouth: small, just parted -->
  <path class="ln" stroke-width="2.8" d="M92 157 h16"/>
  <path class="ln hr" d="M94 163 h12" opacity="0.45"/>

  <!-- shading: light comes from upper-left, so shade the right side -->
  <path d="M131 118 q9 26 0 48 q-9 12 -18 15 q16 -30 14 -63 z" class="skd" opacity="0.4"/>
  <path d="M62 130 q7 14 3 24 q-9 -7 -11 -19 z" class="skd" opacity="0.28"/>
  <path d="M84 176 q16 7 32 2 q-15 10 -34 3 z" class="skd" opacity="0.22"/>

  <!-- hair front: swept across, asymmetric, one side tucked behind the ear -->
  <path d="M100 6 q-62 4 -74 58 q-6 22 -4 44 q9 -30 20 -42 q10 26 42 22 q26 -3 40 -22
           q18 24 46 26 q12 10 18 32 q4 -24 -1 -46 q-13 -54 -67 -56 z" class="ha"/>
  <path d="M100 6 q-44 2 -60 36 q17 -16 42 -18 q-14 12 -20 26 q22 -18 48 -18 z"
        class="hal" opacity="0.42"/>
  <path class="ln" stroke-width="3.8" d="M100 6 q-62 4 -74 58 q-6 22 -4 44"/>
  <path class="ln" stroke-width="3.0" d="M100 6 q62 4 70 56 q6 22 5 44"/>
  <path class="ln hr" d="M50 74 q26 18 50 4" opacity="0.6"/>
  <path class="ln hr" d="M152 80 q-22 14 -42 4" opacity="0.6"/>

  <!-- length past the jaw: heavier on the left -->
  <path d="M34 116 q-9 50 6 96 q11 -36 12 -76 q-11 -7 -18 -20 z" class="ha"/>
  <path class="ln" stroke-width="3.4" d="M34 116 q-9 50 6 96"/>
  <path class="ln hr" d="M42 134 q-4 40 5 68" opacity="0.45"/>
  <path d="M166 118 q7 42 -5 84 q-9 -30 -10 -66 q9 -6 15 -18 z" class="ha"/>
  <path class="ln" stroke-width="2.8" d="M166 118 q7 42 -5 84"/>
</g>
</svg>
