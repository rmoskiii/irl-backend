<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220"
     id="figure_a.register.open" data-asset="figure_a" data-kind="register"
     data-register="open" data-neck-anchor="100,210" data-register-rotate="-2">
    <!-- IRX Phase 2A = register: open, revision 2.
         Rev 1 failed QA: eyes too large and round, brows too heavy, mouth read as a
         smirk. The head read as smug, which is the exact opposite of the register
         and a direct breach of the firewall principle (the face was editorialising).

         Rev 2: eyes much smaller with a heavier upper lid than lower, brows thin and
         softened with only the inner ends lifted, mouth small and just parted, jaw
         lengthened and narrowed, hair given asymmetric volume.

         'open' is carried by: head level and squared to camera, direct gaze, inner
         brows raised, lips parted mid-breath. NOT by a smile or a frown. A player
         must not be able to read guilt or innocence off this head. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5D6B60;
        --irx-wall-dark:     #4C584F;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #C2B8A5;
        --irx-tile-alt:      #AEA48E;
        --irx-floor:         #5A4A3B;

        /* window */
        --irx-sky-high:      #2F3A4A;
        --irx-sky-mid:       #4A4352;
        --irx-sky-low:       #7A5B50;
        --irx-outside-dark:  #232A33;
        --irx-curtain:       #3F4A52;
        --irx-curtain-dark:  #333C43;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #5F4934;
        --irx-counter:       #9B7A57;
        --irx-counter-edge:  #7C6043;

        /* character */
        --irx-skin:          #D3A17C;
        --irx-skin-shade:    #B8845F;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .xh { stroke-width: 6.6; }
        .hv { stroke-width: 5; }
        .md { stroke-width: 3.4; }
        .fn { stroke-width: 2.1; }
        .hr { stroke-width: 1.4; }
        .sk  { fill: var(--irx-skin); }
        .skd { fill: var(--irx-skin-shade); }
        .ha  { fill: var(--irx-hair); }
        .hal { fill: var(--irx-hair-light); }
    </style></defs>

    <g id="character_head">
        <!-- hair mass behind: fuller on the left, tucked on the right -->
        <path d="M100 6 q58 2 70 54 q11 36 6 76 q-4 32 -12 72 q-14 -32 -16 -72
           q-38 15 -86 0 q-3 40 -18 72 q-8 -42 -12 -76 q-5 -40 7 -76 q13 -50 71 -50 z"
              class="ha"/>

        <!-- face: longer, narrower jaw than rev 1 -->
        <path d="M100 32 q38 0 48 36 q8 30 3 60 q-5 34 -21 52 q-13 15 -30 15 q-17 0 -30 -15
           q-16 -18 -21 -52 q-5 -30 3 -60 q10 -36 48 -36 z" class="sk"/>
        <path class="ln md" d="M100 32 q38 0 48 36 q8 30 3 60 q-5 34 -21 52 q-13 15 -30 15
                         q-17 0 -30 -15 q-16 -18 -21 -52 q-5 -30 3 -60 q10 -36 48 -36 z"/>
        <path d="M52 102 q-8 -2 -10 8 q-2 12 8 15" class="sk"/>
        <path class="ln fn" d="M52 102 q-8 -2 -10 8 q-2 12 8 15"/>
        <path d="M148 102 q8 -2 10 8 q2 12 -8 15" class="sk"/>
        <path class="ln fn" d="M148 102 q8 -2 10 8 q2 12 -8 15"/>

        <!-- brows: thin, inner ends lifted. subtle by design -->
        <path class="ln fn" d="M72 93 q12 -6 24 -2" opacity="0.92"/>
        <path class="ln fn" d="M128 93 q-12 -6 -24 -2" opacity="0.92"/>

        <!-- eyes: small. upper lid heavier than lower = the whole trick -->
        <path class="ln md" d="M77 110 q10 -8 20 -1"/>
        <path class="ln hr" d="M78 116 q9 4 18 0" opacity="0.7"/>
        <circle cx="87" cy="112" r="3.4" fill="var(--irx-line)"/>
        <path class="ln md" d="M103 109 q10 -7 20 1"/>
        <path class="ln hr" d="M104 116 q9 4 18 -1" opacity="0.7"/>
        <circle cx="113" cy="112" r="3.4" fill="var(--irx-line)"/>

        <!-- nose: one short stroke -->
        <path class="ln hr" d="M98 124 q-5 14 4 18" opacity="0.85"/>

        <!-- mouth: small, just parted -->
        <path class="ln fn" d="M92 157 h16"/>
        <path class="ln hr" d="M94 163 h12" opacity="0.45"/>

        <!-- shading: light comes from upper-left, so shade the right side -->
        <path d="M131 118 q9 26 0 48 q-9 12 -18 15 q16 -30 14 -63 z" class="skd" opacity="0.4"/>
        <path d="M62 130 q7 14 3 24 q-9 -7 -11 -19 z" class="skd" opacity="0.28"/>

        <!-- hair front: swept across, asymmetric, one side tucked behind the ear -->
        <path d="M100 6 q-62 4 -74 58 q-6 22 -4 44 q9 -30 20 -42 q10 26 42 22 q26 -3 40 -22
           q18 24 46 26 q12 10 18 32 q4 -24 -1 -46 q-13 -54 -67 -56 z" class="ha"/>
        <path d="M100 6 q-44 2 -60 36 q17 -16 42 -18 q-14 12 -20 26 q22 -18 48 -18 z"
              class="hal" opacity="0.42"/>
        <path class="ln md" d="M100 6 q-62 4 -74 58 q-6 22 -4 44"/>
        <path class="ln md" d="M100 6 q62 4 70 56 q6 22 5 44"/>
        <path class="ln hr" d="M50 74 q26 18 50 4" opacity="0.6"/>
        <path class="ln hr" d="M152 80 q-22 14 -42 4" opacity="0.6"/>

        <!-- length past the jaw: heavier on the left -->
        <path d="M34 116 q-9 50 6 96 q11 -36 12 -76 q-11 -7 -18 -20 z" class="ha"/>
        <path class="ln md" d="M34 116 q-9 50 6 96"/>
        <path class="ln hr" d="M42 134 q-4 40 5 68" opacity="0.45"/>
        <path d="M166 118 q7 42 -5 84 q-9 -30 -10 -66 q9 -6 15 -18 z" class="ha"/>
        <path class="ln md" d="M166 118 q7 42 -5 84"/>
    </g>
</svg>