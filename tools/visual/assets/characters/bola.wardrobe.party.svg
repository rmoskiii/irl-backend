<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs><style>/* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* vignettes */
        --irx-vig-light:     #B3ABA0;
        --irx-vig-base:      #8C857C;
        --irx-vig-mid:       #635D56;
        --irx-vig-dark:      #3B3733;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;

        /* ==== the streets — six characters, deliberately differentiated ==== */
        /* figure_e — Bola. African, fifties. */
        --irx-skin-e:        #6B4A33;
        --irx-skin-e-shade:  #4F3524;
        --irx-hair-e:        #2E2622;
        --irx-hair-e-light:  #4A3F38;
        --irx-lip-e:         #7A4F42;
        --irx-mouth-e:       #3A2019;
        /* figure_f — Jay. Brown, mid-complexion, nineteen. */
        --irx-skin-f:        #96684A;
        --irx-skin-f-shade:  #754F36;
        --irx-hair-f:        #221A15;
        --irx-hair-f-light:  #3A2B22;
        --irx-lip-f:         #9C6552;
        --irx-mouth-f:       #4A2A22;
        /* figure_g — Tunde. African, thirties to forties. */
        --irx-skin-g:        #5E4030;
        --irx-skin-g-shade:  #452D21;
        --irx-hair-g:        #2A221E;
        --irx-hair-g-light:  #423731;
        --irx-lip-g:         #6E463A;
        --irx-mouth-g:       #331C16;
        /* figure_h — Dee. White, twenty-seven. */
        --irx-skin-h:        #C9A184;
        --irx-skin-h-shade:  #A87F64;
        --irx-hair-h:        #5A4332;
        --irx-hair-h-light:  #775843;
        --irx-lip-h:         #B3806C;
        --irx-mouth-h:       #6B4034;
        /* figure_i — Kai. Brown, a different complexion from Jay. */
        --irx-skin-i:        #A8794F;
        --irx-skin-i-shade:  #86603D;
        --irx-hair-i:        #281F1A;
        --irx-hair-i-light:  #41332B;
        --irx-lip-i:         #A87057;
        --irx-mouth-i:       #4F2E23;
        /* figure_j — Amara. Caramel, nineteen to twenty. */
        --irx-skin-j:        #B08258;
        --irx-skin-j-shade:  #8E6644;
        --irx-hair-j:        #2B211C;
        --irx-hair-j-light:  #463831;
        --irx-lip-j:         #AE7460;
        --irx-mouth-j:       #533026;

        /* ==== the streets — wax-print wardrobe palette ==== */
        /* The existing Neighbourhood set is a lit-interior palette: warm browns, cool
        greys, one amber accent. It has no saturated cloth colour at all, so West
        African print had to be invented or faked. Added here rather than faked.
        Same D14 churn as the character tokens: the preamble is inlined into every
        composed frame, so this rewrites canonicalSha256 on the existing fixtures
        and changes no geometry. */
        --irx-wax-teal:      #1F6F63;
        --irx-wax-teal-dark: #144F46;
        --irx-wax-plum:      #6E3A8C;
        --irx-wax-plum-dark: #4E2866;
        --irx-wax-red:       #C24A2E;
        --irx-wax-red-dark:  #93331C;
        --irx-wax-gold:      #E3A83C;
        --irx-wax-cream:     #EADBC2;
        }
        /* @tokens-end */</style><style>.bl-ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }</style></defs>
    <g id="character_clothing">
        <path id="bl-top" fill="var(--irx-wax-plum)" d="M214 200 q-52 2 -78 32 q-20 22 -25 50 q-8 40 -9 82 q-2 40 0 74 q1 24 3 40 h218 q2 -16 3 -40 q2 -34 0 -74 q-1 -42 -9 -82 q-5 -28 -25 -50 q-26 -30 -78 -32 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="bl-top-sh" fill="var(--irx-wax-plum-dark)" d="M262 236 q20 22 25 50 q8 40 9 82 q2 40 0 74 q-1 24 -3 40 h-42 q4 -20 6 -42 q3 -38 1 -74 q-1 -42 -10 -80 q-5 -26 -20 -46 z"/>
        <path id="bl-sleeve-l" fill="var(--irx-wax-plum)" d="M140 240 q-52 22 -66 74 q-12 42 -14 86 q32 16 70 14 q2 -44 10 -82 q7 -34 22 -56 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="bl-sleeve-r" fill="var(--irx-wax-plum)" d="M288 240 q52 22 66 74 q12 42 14 86 q-32 16 -70 14 q-2 -44 -10 -82 q-7 -34 -22 -56 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="bl-sleeve-r-sh" fill="var(--irx-wax-plum-dark)" d="M318 272 q18 28 25 72 q5 30 7 54 q-17 9 -36 11 q2 -44 -5 -82 q-6 -32 -19 -54 z"/>
        <path id="bl-neckline" fill="var(--irx-wax-gold)" d="M214 200 q-34 2 -44 14 q14 30 44 58 q30 -28 44 -58 q-10 -12 -44 -14 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="bl-neckline-in" fill="var(--irx-wax-plum-dark)" d="M214 212 q-22 2 -28 9 q9 20 28 38 q19 -18 28 -38 q-6 -7 -28 -9 z"/>
        <path id="bl-emb0" fill="var(--irx-wax-gold)" d="M156 300 h116 v7 h-116 z"/>
        <path id="bl-emb1" fill="var(--irx-wax-gold)" d="M156 344 h116 v7 h-116 z"/>
        <path id="bl-emb2" fill="var(--irx-wax-gold)" d="M156 388 h116 v7 h-116 z"/>
        <path id="bl-emb3" fill="var(--irx-wax-gold)" d="M156 432 h116 v7 h-116 z"/>
        <path id="bl-motif0" fill="var(--irx-wax-gold)" d="M168 320 l8 12 l-8 12 l-8 -12 z M168 408 l8 12 l-8 12 l-8 -12 z"/>
        <path id="bl-motif1" fill="var(--irx-wax-gold)" d="M192 320 l8 12 l-8 12 l-8 -12 z M192 408 l8 12 l-8 12 l-8 -12 z"/>
        <path id="bl-motif2" fill="var(--irx-wax-gold)" d="M216 320 l8 12 l-8 12 l-8 -12 z M216 408 l8 12 l-8 12 l-8 -12 z"/>
        <path id="bl-motif3" fill="var(--irx-wax-gold)" d="M240 320 l8 12 l-8 12 l-8 -12 z M240 408 l8 12 l-8 12 l-8 -12 z"/>
        <path id="bl-motif4" fill="var(--irx-wax-gold)" d="M264 320 l8 12 l-8 12 l-8 -12 z M264 408 l8 12 l-8 12 l-8 -12 z"/>
        <path id="bl-cuff-l" fill="var(--irx-wax-gold)" d="M86 396 q30 10 60 0 q2 10 0 20 q-30 10 -60 0 q-2 -10 0 -20 z"/>
        <path id="bl-cuff-r" fill="var(--irx-wax-gold)" d="M274 396 q30 10 60 0 q2 10 0 20 q-30 10 -60 0 q-2 -10 0 -20 z"/>
        <path id="bl-iro" fill="var(--irx-wax-plum-dark)" d="M128 448 h172 q12 96 16 190 q4 66 6 162 h-216 q2 -96 6 -162 q4 -94 16 -190 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="bl-iro-band" fill="var(--irx-wax-gold)" d="M132 492 h164 v12 h-164 z M128 566 h172 v12 h-172 z"/>
        <path id="bl-iro-cream" fill="var(--irx-wax-cream)" d="M136 524 h156 v10 h-156 z"/>
        <path id="bl-beads" fill="var(--irx-wax-gold)" d="M188 262 q26 14 52 0 q3 10 0 18 q-26 14 -52 0 q-3 -8 0 -18 z"/>
    </g>
</svg>