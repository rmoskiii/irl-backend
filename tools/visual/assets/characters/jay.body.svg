<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs><style>/* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* vignettes */
        --irx-vig-light:     #B3ABA0;
        --irx-vig-base:      #8C857C;
        --irx-vig-mid:       #635D56;
        --irx-vig-dark:      #3B3733;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;

        /* ==== the streets — six characters, deliberately differentiated ==== */
        /* figure_e — Bola. African, fifties. */
        --irx-skin-e:        #6B4A33;
        --irx-skin-e-shade:  #4F3524;
        --irx-hair-e:        #2E2622;
        --irx-hair-e-light:  #4A3F38;
        --irx-lip-e:         #7A4F42;
        --irx-mouth-e:       #3A2019;
        /* figure_f — Jay. Brown, mid-complexion, nineteen. */
        --irx-skin-f:        #96684A;
        --irx-skin-f-shade:  #754F36;
        --irx-hair-f:        #221A15;
        --irx-hair-f-light:  #3A2B22;
        --irx-lip-f:         #9C6552;
        --irx-mouth-f:       #4A2A22;
        /* figure_g — Tunde. African, thirties to forties. */
        --irx-skin-g:        #5E4030;
        --irx-skin-g-shade:  #452D21;
        --irx-hair-g:        #2A221E;
        --irx-hair-g-light:  #423731;
        --irx-lip-g:         #6E463A;
        --irx-mouth-g:       #331C16;
        /* figure_h — Dee. White, twenty-seven. */
        --irx-skin-h:        #C9A184;
        --irx-skin-h-shade:  #A87F64;
        --irx-hair-h:        #5A4332;
        --irx-hair-h-light:  #775843;
        --irx-lip-h:         #B3806C;
        --irx-mouth-h:       #6B4034;
        /* figure_i — Kai. Brown, a different complexion from Jay. */
        --irx-skin-i:        #A8794F;
        --irx-skin-i-shade:  #86603D;
        --irx-hair-i:        #281F1A;
        --irx-hair-i-light:  #41332B;
        --irx-lip-i:         #A87057;
        --irx-mouth-i:       #4F2E23;
        /* figure_j — Amara. Caramel, nineteen to twenty. */
        --irx-skin-j:        #B08258;
        --irx-skin-j-shade:  #8E6644;
        --irx-hair-j:        #2B211C;
        --irx-hair-j-light:  #463831;
        --irx-lip-j:         #AE7460;
        --irx-mouth-j:       #533026;
        }
        /* @tokens-end */</style><style>.jf-ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }</style></defs>
    <g id="character_back">
        <path id="jf-shadow" fill="var(--irx-shadow)" opacity="0.26" d="M150 214 q66 -18 132 0 q30 96 24 208 q-8 130 -12 372 h-158 q-6 -240 -10 -372 q-6 -112 24 -208 z"/>
    </g>
    <g id="character_body">
        <path id="jf-neck" fill="var(--irx-skin-f-shade)" d="M196 158 h36 v46 h-36 z"/>
        <path id="jf-torso" fill="var(--irx-skin-f)" d="M214 196 q-40 2 -62 26 q-16 18 -20 40 q-6 34 -6 70 q-1 60 3 110 q2 16 3 28 h164 q1 -12 3 -28 q4 -50 3 -110 q0 -36 -6 -70 q-4 -22 -20 -40 q-22 -24 -62 -26 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-torso-sh" fill="var(--irx-skin-f-shade)" d="M256 226 q16 18 20 40 q6 34 6 70 q1 60 -3 110 q-2 16 -3 28 h-34 q4 -16 6 -34 q5 -52 4 -110 q-1 -36 -7 -68 q-4 -20 -14 -34 z"/>
        <path id="jf-arm-l" fill="var(--irx-skin-f)" d="M158 236 q-32 14 -42 48 q-9 30 -10 66 q-2 44 2 84 q2 34 6 58 q20 7 40 0 q-5 -28 -8 -62 q-3 -44 -1 -84 q2 -34 9 -60 q5 -20 16 -34 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-arm-r" fill="var(--irx-skin-f)" d="M270 236 q32 14 42 48 q9 30 10 66 q2 44 -2 84 q-2 34 -6 58 q-20 7 -40 0 q5 -28 8 -62 q3 -44 1 -84 q-2 -34 -9 -60 q-5 -20 -16 -34 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-arm-r-sh" fill="var(--irx-skin-f-shade)" d="M292 262 q12 26 14 60 q2 44 -2 84 q-2 34 -6 58 q-10 3 -20 2 q5 -28 8 -62 q3 -44 1 -84 q-2 -34 -9 -60 z"/>
        <path id="jf-legs" fill="var(--irx-skin-f)" d="M150 468 h120 v332 h-120 z"/>
    </g>
    <g id="character_contact">
        <path id="jf-contact" fill="var(--irx-shadow)" opacity="0.32" d="M104 486 q106 -14 212 0 q6 12 0 22 q-108 -12 -212 0 q-6 -10 0 -22 z"/>
    </g>
    <g id="character_front">
        <path id="jf-hand-l" fill="var(--irx-skin-f)" d="M108 486 q26 -10 50 -4 q9 10 5 22 q-28 8 -54 2 q-7 -10 -1 -20 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-hand-r" fill="var(--irx-skin-f)" d="M262 486 q26 -8 52 -2 q7 10 1 20 q-27 8 -54 2 q-7 -10 1 -20 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
</svg>