<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs><style>/* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* vignettes */
        --irx-vig-light:     #B3ABA0;
        --irx-vig-base:      #8C857C;
        --irx-vig-mid:       #635D56;
        --irx-vig-dark:      #3B3733;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;

        /* ==== the streets — six characters, deliberately differentiated ==== */
        /* figure_e — Bola. African, fifties. */
        --irx-skin-e:        #6B4A33;
        --irx-skin-e-shade:  #4F3524;
        --irx-hair-e:        #2E2622;
        --irx-hair-e-light:  #4A3F38;
        --irx-lip-e:         #7A4F42;
        --irx-mouth-e:       #3A2019;
        /* figure_f — Jay. Brown, mid-complexion, nineteen. */
        --irx-skin-f:        #96684A;
        --irx-skin-f-shade:  #754F36;
        --irx-hair-f:        #221A15;
        --irx-hair-f-light:  #3A2B22;
        --irx-lip-f:         #9C6552;
        --irx-mouth-f:       #4A2A22;
        /* figure_g — Tunde. African, thirties to forties. */
        --irx-skin-g:        #5E4030;
        --irx-skin-g-shade:  #452D21;
        --irx-hair-g:        #2A221E;
        --irx-hair-g-light:  #423731;
        --irx-lip-g:         #6E463A;
        --irx-mouth-g:       #331C16;
        /* figure_h — Dee. White, twenty-seven. */
        --irx-skin-h:        #C9A184;
        --irx-skin-h-shade:  #A87F64;
        --irx-hair-h:        #5A4332;
        --irx-hair-h-light:  #775843;
        --irx-lip-h:         #B3806C;
        --irx-mouth-h:       #6B4034;
        /* figure_i — Kai. Brown, a different complexion from Jay. */
        --irx-skin-i:        #A8794F;
        --irx-skin-i-shade:  #86603D;
        --irx-hair-i:        #281F1A;
        --irx-hair-i-light:  #41332B;
        --irx-lip-i:         #A87057;
        --irx-mouth-i:       #4F2E23;
        /* figure_j — Amara. Caramel, nineteen to twenty. */
        --irx-skin-j:        #B08258;
        --irx-skin-j-shade:  #8E6644;
        --irx-hair-j:        #2B211C;
        --irx-hair-j-light:  #463831;
        --irx-lip-j:         #AE7460;
        --irx-mouth-j:       #533026;

        /* ==== the streets — wax-print wardrobe palette ==== */
        /* The existing Neighbourhood set is a lit-interior palette: warm browns, cool
        greys, one amber accent. It has no saturated cloth colour at all, so West
        African print had to be invented or faked. Added here rather than faked.
        Same D14 churn as the character tokens: the preamble is inlined into every
        composed frame, so this rewrites canonicalSha256 on the existing fixtures
        and changes no geometry. */
        --irx-wax-teal:      #1F6F63;
        --irx-wax-teal-dark: #144F46;
        --irx-wax-plum:      #6E3A8C;
        --irx-wax-plum-dark: #4E2866;
        --irx-wax-red:       #C24A2E;
        --irx-wax-red-dark:  #93331C;
        --irx-wax-gold:      #E3A83C;
        --irx-wax-cream:     #EADBC2;
        /* kit blues. The Neighbourhood set has no true blue at all - --irx-cool-spill
        and --irx-jacket are both grey-blues for lit interiors, and a football
        jersey in either reads as grey. Two added rather than faked. */
        --irx-wax-blue:      #4A86C4;
        --irx-wax-blue-dark: #2F5E91;
        }
        /* @tokens-end */</style><style>.tn-ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }</style></defs>
    <g id="character_clothing">
        <path id="tn-top" fill="var(--irx-wax-blue-dark)" d="M214 194 q-54 2 -78 30 q-16 20 -20 46 q-5 32 -6 62 q-1 38 2 68 q2 22 4 38 h196 q2 -16 4 -38 q3 -30 2 -68 q-1 -30 -6 -62 q-4 -26 -20 -46 q-24 -28 -78 -30 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="tn-sleeve-l" fill="var(--irx-wax-blue-dark)" d="M144 242 q-34 16 -44 52 q-9 30 -10 66 q-2 44 2 84 q2 34 6 58 q22 8 44 0 q-5 -28 -8 -64 q-3 -44 -1 -84 q2 -36 10 -62 q5 -22 17 -36 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="tn-sleeve-r" fill="var(--irx-wax-blue-dark)" d="M284 242 q34 16 44 52 q9 30 10 66 q2 44 -2 84 q-2 34 -6 58 q-22 8 -44 0 q5 -28 8 -64 q3 -44 1 -84 q-2 -36 -10 -62 q-5 -22 -17 -36 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="tn-tee" fill="var(--irx-cloth-inner)" d="M214 196 q-26 2 -32 12 q10 22 32 38 q22 -16 32 -38 q-6 -10 -32 -12 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="tn-zip" class="tn-ln" stroke-width="var(--irx-stroke-fine)" d="M214 246 v200"/>
        <path id="tn-cuff-l" fill="var(--irx-outside-dark)" d="M100 466 q24 8 48 0 q2 10 0 20 q-24 8 -48 0 q-2 -10 0 -20 z"/>
        <path id="tn-cuff-r" fill="var(--irx-outside-dark)" d="M272 466 q24 8 48 0 q2 10 0 20 q-24 8 -48 0 q-2 -10 0 -20 z"/>
        <path id="tn-hem" fill="var(--irx-outside-dark)" d="M144 448 h132 v22 h-132 z"/>
        <path id="tn-jeans" fill="var(--irx-curtain-dark)" d="M150 466 h120 q6 78 10 160 q4 74 6 174 h-52 q-4 -96 -10 -160 q-6 -54 -14 -88 q-8 34 -14 88 q-6 64 -10 160 h-52 q2 -100 6 -174 q4 -82 10 -160 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="tn-shoe-l" fill="var(--irx-outside-dark)" d="M142 780 h54 v20 h-66 q-2 -12 12 -20 z"/>
        <path id="tn-shoe-r" fill="var(--irx-outside-dark)" d="M246 780 h54 q14 8 12 20 h-66 z"/>
    </g>
</svg>