<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" data-neck-anchor="100,210" data-register-rotate="0" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs><style><![CDATA[
/* ENVIRONMENT VALUE LOCK: C applied (k=0.82) */
/* IRX Visual Asset Tokens — Phase 2A
 * Source of truth for all colour and stroke values in the asset system.
 * Every shipping asset SVG embeds this block verbatim inside <defs><style>.
 * validate_assets.py enforces byte-identical inclusion.
 *
 * Palette: Neighbourhood district, evening interior.
 * Muted / earthy / desaturated. Accent used sparingly for warm light only.
 */
:root {
  /* line */
  --irx-line:          #241D19;
  --irx-line-soft:     #3B302A;
  --irx-shadow:        #2A231E;

  /* architecture */
  --irx-wall:          #5C6A5F;
  --irx-wall-dark:     #4E5A51;
  --irx-wall-pattern:  #556359;
  --irx-tile:          #B5A992;
  --irx-tile-alt:      #A49980;
  --irx-floor:         #5E4D3E;

  /* window */
  --irx-sky-high:      #334051;
  --irx-sky-mid:       #4D4656;
  --irx-sky-low:       #785A4F;
  --irx-outside-dark:  #2A333E;
  --irx-curtain:       #424E56;
  --irx-curtain-dark:  #38424A;

  /* joinery */
  --irx-cabinet:       #785D44;
  --irx-cabinet-dark:  #634C36;
  --irx-counter:       #947553;
  --irx-counter-edge:  #7B5F43;

  /* character */
  --irx-skin:          #A87A5A;
  --irx-skin-shade:    #875D42;
  /* figure_b: same warm hazel family, one step deeper than figure_a */
  --irx-skin-b:        #8E6244;
  --irx-skin-b-shade:  #6E4A32;
  /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
     mouth with --irx-line reads as black lips. */
  --irx-lip-b:         #96604F;
  --irx-mouth-b:       #4A2C24;
  --irx-hair:          #41322A;
  --irx-hair-light:    #554136;
  /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
  --irx-hair-b:        #241A16;
  --irx-hair-b-light:  #3D2C24;

  /* wardrobe: home_casual */
  --irx-cloth:         #A8603F;
  --irx-cloth-dark:    #894C31;
  --irx-cloth-inner:   #D9CDBC;

  /* props */
  --irx-glass:         #BCC8C3;
  --irx-glass-dark:    #9AA8A2;
  --irx-highlight:     #FFFFFF;
  --irx-jacket:        #4F5A63;
  --irx-jacket-dark:   #3D464E;

  /* accent — neighbourhood district, warm light only */
  --irx-accent:        #FFC15E;
  --irx-accent-dim:    #C89A4E;
  --irx-lamp-warm:     #F2C77E;
  --irx-cool-spill:    #7E93A8;

  /* vignettes: montage panels only. Desaturated and reduced, so compressed
     time reads differently from present tense without a caption saying so.
     A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
     validate_assets.py rule 13. */
  --irx-vig-light:     #B3ABA0;
  --irx-vig-base:      #8C857C;
  --irx-vig-mid:       #635D56;
  --irx-vig-dark:      #3B3733;

  /* stroke weights */
  --irx-stroke-xheavy: 6.6;
  --irx-stroke-heavy:  5;
  --irx-stroke:        3.4;
  --irx-stroke-fine:   2.1;
  --irx-stroke-hair:   1.4;

  /* ==== career district ==== */
/* career: architecture */
--irx-career-wall:          #6E757E;
--irx-career-wall-dark:     #5C636B;
--irx-career-wall-pattern:  #666D76;
--irx-career-partition:     #58606A;
--irx-career-partition-dark:#4A5158;
--irx-career-floor:         #4A4F55;
/* career: window, evening. The office is lit; outside is not. */
--irx-career-sky-high:      #1E2836;
--irx-career-sky-mid:       #26303D;
--irx-career-sky-low:       #2E3444;
--irx-career-outside-dark:  #161C25;
/* career: joinery */
--irx-career-desk:          #8A8478;
--irx-career-desk-edge:     #6F6A60;
--irx-career-desk-dark:     #5E5A52;
--irx-career-metal:         #7A828A;
--irx-career-metal-dark:    #626A72;
/* career: light. Overhead fluorescent and one screen. */
--irx-career-fluoro:        #E8EDF2;
--irx-career-fluoro-dim:    #A8B2BC;
--irx-career-screen:        #6E93A8;
--irx-career-screen-glow:   #9FC4D8;
/* career: figure_c (Ray) */
--irx-career-skin-c:        #D9A886;
--irx-career-skin-c-shade:  #B98565;
--irx-career-hair-c:        #6E655C;
--irx-career-hair-c-light:  #8A8076;
--irx-career-lip-c:         #B57F66;
--irx-career-mouth-c:       #6B4436;
/* career: figure_d (Dana) */
--irx-career-skin-d:        #E0B294;
--irx-career-skin-d-shade:  #BE8D6F;
--irx-career-hair-d:        #4A4038;
--irx-career-hair-d-light:  #6A5C50;
/* career: wardrobe work */
--irx-career-shirt-c:       #9FA9B4;
--irx-career-shirt-c-dark:  #7E8894;
--irx-career-shirt-c-fold:  #6B7480;
/* career: wardrobe work_coat */
--irx-career-coat-c:        #4E5661;
--irx-career-coat-c-dark:   #3C434D;
--irx-career-coat-c-fold:   #5C6570;
/* career: accent. Matches district_theme.dart Career accent 0xFF7EA6DB. */
--irx-career-accent:        #7EA6DB;
--irx-career-accent-dim:    #5F7FA9;
  --irx-career-suit-d:        #7A3B47;
  --irx-career-suit-d-dark:   #5E2C36;
  --irx-career-suit-d-fold:   #8E4A57;

  --irx-neighbourhood-brick:        #7A6459;
  --irx-neighbourhood-brick-dark:   #64514A;
  --irx-neighbourhood-roof:         #55606B;
  --irx-neighbourhood-pavement:     #5A616A;
  --irx-neighbourhood-kerb:         #3C424A;
  --irx-neighbourhood-foliage:      #46584B;
  --irx-neighbourhood-foliage-dark: #35463A;
  --irx-neighbourhood-car:          #5A5F66;
  /* figure_e — Bola. African, fifties. */
  --irx-skin-e:        #6B4A33;
  --irx-skin-e-shade:  #4F3524;
  --irx-hair-e:        #2E2622;
  --irx-hair-e-light:  #4A3F38;
  --irx-lip-e:         #7A4F42;
  --irx-mouth-e:       #3A2019;
  /* figure_f — Jay. Brown, mid-complexion, nineteen. */
  --irx-skin-f:        #96684A;
  --irx-skin-f-shade:  #754F36;
  --irx-hair-f:        #221A15;
  --irx-hair-f-light:  #3A2B22;
  --irx-lip-f:         #9C6552;
  --irx-mouth-f:       #4A2A22;
  /* figure_g — Tunde. African, thirties to forties. */
  --irx-skin-g:        #5E4030;
  --irx-skin-g-shade:  #452D21;
  --irx-hair-g:        #2A221E;
  --irx-hair-g-light:  #423731;
  --irx-lip-g:         #6E463A;
  --irx-mouth-g:       #331C16;
  /* figure_h — Dee. White, twenty-seven. */
  --irx-skin-h:        #C9A184;
  --irx-skin-h-shade:  #A87F64;
  --irx-hair-h:        #5A4332;
  --irx-hair-h-light:  #775843;
  --irx-lip-h:         #B3806C;
  --irx-mouth-h:       #6B4034;
  /* figure_i — Kai. Brown, a different complexion from Jay. */
  --irx-skin-i:        #A8794F;
  --irx-skin-i-shade:  #86603D;
  --irx-hair-i:        #281F1A;
  --irx-hair-i-light:  #41332B;
  --irx-lip-i:         #A87057;
  --irx-mouth-i:       #4F2E23;
  /* figure_j — Amara. Caramel, nineteen to twenty. */
  --irx-skin-j:        #B08258;
  --irx-skin-j-shade:  #8E6644;
  --irx-hair-j:        #2B211C;
  --irx-hair-j-light:  #463831;
  --irx-lip-j:         #AE7460;
  --irx-mouth-j:       #533026;

  /* ==== the streets — wax-print wardrobe palette ==== */
  /* The existing Neighbourhood set is a lit-interior palette: warm browns, cool
     greys, one amber accent. It has no saturated cloth colour at all, so West
     African print had to be invented or faked. Added here rather than faked.
     Same D14 churn as the character tokens: the preamble is inlined into every
     composed frame, so this rewrites canonicalSha256 on the existing fixtures
     and changes no geometry. */
  --irx-wax-teal:      #1F6F63;
  --irx-wax-teal-dark: #144F46;
  --irx-wax-plum:      #6E3A8C;
  --irx-wax-plum-dark: #4E2866;
  --irx-wax-red:       #C24A2E;
  --irx-wax-red-dark:  #93331C;
  --irx-wax-gold:      #E3A83C;
  --irx-wax-cream:     #EADBC2;
  /* kit blues. The Neighbourhood set has no true blue: --irx-cool-spill and
     --irx-jacket are both grey-blues for lit interiors. */
  --irx-wax-blue:      #4A86C4;
  --irx-wax-blue-dark: #2F5E91;
}
]]></style><style>.jf-ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }</style></defs>
    <g id="character_head">
        <path id="jr-h-neck" fill="var(--irx-skin-f-shade)" d="M85 150 h38 v70 h-38 z"/>
        <path id="jr-h-neck-f" class="jf-ln" stroke-width="var(--irx-stroke)" d="M85 176 v44 M123 176 v44"/>
        <path id="jr-h-ear-l" fill="var(--irx-skin-f-shade)" d="M50 102 q-11 0 -11 14 q0 19 13 24 q7 1 8 -7 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jr-h-ear-r" fill="var(--irx-skin-f-shade)" d="M150 102 q11 0 11 14 q0 19 -13 24 q-7 1 -8 -7 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jr-h-skull" fill="var(--irx-hair-f)" d="M100 12 q44 0 55 32 q7 20 5 40 q-1 24 -6 44 q-6 26 -16 42 q-12 19 -26 23 q-4 1 -12 1 q-8 0 -12 -1 q-14 -4 -26 -23 q-10 -16 -16 -42 q-5 -20 -6 -44 q-2 -20 5 -40 q11 -32 55 -32 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jr-h-crown" fill="var(--irx-hair-f-light)" d="M124 22 q28 12 33 42 q-8 -18 -18 -26 q-6 -9 -15 -16 z"/>
        <path id="jr-h-nape" fill="var(--irx-hair-f)" d="M74 148 q26 12 52 0 q2 14 -4 22 q-22 8 -44 0 q-6 -8 -4 -22 z"/>
        <path id="jr-h-nape-f" class="jf-ln" stroke-width="var(--irx-stroke-fine)" d="M74 148 q26 12 52 0"/>
        <path id="jr-h-part" class="jf-ln" stroke-width="var(--irx-stroke-fine)" d="M100 30 q-6 44 -2 92"/>
    </g>
</svg>