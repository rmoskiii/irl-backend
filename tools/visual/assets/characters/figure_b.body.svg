<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800"
     id="figure_b.body" data-asset="figure_b" data-kind="base-body"
     data-base-point="210,800" data-head-socket="210,196">
<!-- IRX 2B.1 = figure_b base body (Alex).

     Built on exactly the same system as figure_a: same viewBox, same basePoint,
     same four layer groups, same token architecture, same stroke language.
     Only the CONTRACT VALUES differ, and they are declared in
     anchors.characters.figure_b rather than assumed:

       headSocket   210,196   (14px higher than Jessica - taller, longer neck)
       neckSpan     85..123 from y 156
       shoulders    196 wide  (vs 164)
       skin         =irx-skin-b / =irx-skin-b-shade

     Character design is his own: squarer cranium, straighter shoulder line,
     shorter neck-to-shoulder transition, different hair mass. He is not Jessica
     with different tokens.

     Layer groups, identical contract to figure_a:
       character_back    cast shadow on the wall
       character_body    torso, arms, neck  (legs drawn AFTER torso - the fix)
       character_contact contact shadow where hands meet the counter
       character_front   hands, in front of furniture -->
<defs><style>
/* @tokens-begin */
:root {
  /* line */
  --irx-line:          #241D19;
  --irx-line-soft:     #3B302A;
  --irx-shadow:        #2A231E;

  /* architecture */
  --irx-wall:          #5C6A5F;
  --irx-wall-dark:     #4E5A51;
  --irx-wall-pattern:  #556359;
  --irx-tile:          #B5A992;
  --irx-tile-alt:      #A49980;
  --irx-floor:         #5E4D3E;

  /* window */
  --irx-sky-high:      #334051;
  --irx-sky-mid:       #4D4656;
  --irx-sky-low:       #785A4F;
  --irx-outside-dark:  #2A333E;
  --irx-curtain:       #424E56;
  --irx-curtain-dark:  #38424A;

  /* joinery */
  --irx-cabinet:       #785D44;
  --irx-cabinet-dark:  #634C36;
  --irx-counter:       #947553;
  --irx-counter-edge:  #7B5F43;

  /* character */
  --irx-skin:          #A87A5A;
  --irx-skin-shade:    #875D42;
  /* figure_b: same warm hazel family, one step deeper than figure_a */
  --irx-skin-b:        #8E6244;
  --irx-skin-b-shade:  #6E4A32;
  /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
     mouth with --irx-line reads as black lips. */
  --irx-lip-b:         #96604F;
  --irx-mouth-b:       #4A2C24;
  --irx-hair:          #41322A;
  --irx-hair-light:    #554136;
  /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
  --irx-hair-b:        #241A16;
  --irx-hair-b-light:  #3D2C24;

  /* wardrobe: home_casual */
  --irx-cloth:         #A8603F;
  --irx-cloth-dark:    #894C31;
  --irx-cloth-inner:   #D9CDBC;

  /* props */
  --irx-glass:         #BCC8C3;
  --irx-glass-dark:    #9AA8A2;
  --irx-highlight:     #FFFFFF;
  --irx-jacket:        #4F5A63;
  --irx-jacket-dark:   #3D464E;

  /* accent — neighbourhood district, warm light only */
  --irx-accent:        #FFC15E;
  --irx-accent-dim:    #C89A4E;
  --irx-lamp-warm:     #F2C77E;
  --irx-cool-spill:    #7E93A8;

  /* vignettes: montage panels only. Desaturated and reduced, so compressed
     time reads differently from present tense without a caption saying so.
     A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
     validate_assets.py rule 13. */
  --irx-vig-light:     #B3ABA0;
  --irx-vig-base:      #8C857C;
  --irx-vig-mid:       #635D56;
  --irx-vig-dark:      #3B3733;

  /* stroke weights */
  --irx-stroke-xheavy: 6.6;
  --irx-stroke-heavy:  5;
  --irx-stroke:        3.4;
  --irx-stroke-fine:   2.1;
  --irx-stroke-hair:   1.4;
}
/* @tokens-end */
.ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.sk  { fill: var(--irx-skin-b); }
.skd { fill: var(--irx-skin-b-shade); }
</style></defs>

<g id="character_back">
  <path d="M148 250 q28 -36 84 -36 q58 0 86 38 q20 60 18 148 q-2 56 -5 94 h-186
           q-4 -56 -6 -94 q-2 -86 13 -150 z" fill="var(--irx-shadow)" opacity="0.13"/>
</g>

<g id="character_body">
  <!-- neck: wider and shorter than figure_a, socket sits 14px higher -->
  <path d="M186 152 v46 q24 15 46 0 v-46 z" class="sk"/>
  <path d="M186 156 q23 27 46 0 v17 q-23 19 -46 0 z" class="skd" opacity="0.8"/>
  <path class="ln" stroke-width="3.4" d="M186 152 v48"/>
  <path class="ln" stroke-width="3.4" d="M232 152 v48"/>

  <!-- torso: broader shoulders, straighter shoulder line, narrower waist -->
  <path d="M112 264 q22 -46 98 -46 q76 0 98 46 q16 62 14 150 q-2 96 -6 176 h-212
           q-4 -80 -6 -176 q-2 -88 14 -150 z" class="sk"/>
  <path class="ln" stroke-width="6.6" d="M112 264 q22 -46 98 -46 q76 0 98 46 q16 62 14 150 q-2 96 -6 176"/>
  <path class="ln" stroke-width="6.6" d="M112 264 q-16 62 -14 150 q2 96 6 176"/>

  <!-- legs, drawn AFTER the torso so the waistband covers it -->
  <path d="M134 556 q-9 124 -5 244 h68 q4 -120 13 -200 q9 80 13 200 h68 q4 -120 -5 -244 z"
        fill="var(--irx-cabinet-dark)"/>
  <path class="ln" stroke-width="3.4"
        d="M134 556 q-9 124 -5 244 h68 q4 -120 13 -200 q9 80 13 200 h68 q4 -120 -5 -244 z"/>

  <!-- arms reaching forward onto the counter, set wider than figure_a -->
  <path d="M118 262 q-40 58 -46 116 q-6 56 20 98 l38 -15 q-22 -39 -16 -87 q6 -51 40 -99 z" class="sk"/>
  <path class="ln" stroke-width="6.6" d="M118 262 q-40 58 -46 116 q-6 56 20 98"/>
  <path class="ln" stroke-width="6.6" d="M154 274 q-34 47 -40 98 q-5 47 15 86"/>

  <path d="M302 262 q40 58 46 116 q6 56 -20 98 l-38 -15 q22 -39 16 -87 q-6 -51 -40 -99 z" class="sk"/>
  <path class="ln" stroke-width="6.6" d="M302 262 q40 58 46 116 q6 56 -20 98"/>
  <path class="ln" stroke-width="6.6" d="M266 274 q34 47 40 98 q5 47 -15 86"/>
</g>

<g id="character_contact">
  <ellipse cx="112" cy="514" rx="44" ry="9" fill="var(--irx-shadow)" opacity="0.3"/>
  <ellipse cx="308" cy="514" rx="44" ry="9" fill="var(--irx-shadow)" opacity="0.3"/>
</g>

<g id="character_front">
  <!-- hands: larger and squarer than figure_a's -->
  <g id="hand_left">
    <path d="M78 472 q28 -14 62 -5 q14 25 6 40 q-35 13 -68 1 q-12 -19 0 -36 z" class="sk"/>
    <path d="M78 491 q32 11 66 2 q1 8 2 14 q-35 13 -68 1 z" class="skd" opacity="0.4"/>
    <path class="ln" stroke-width="3.4" d="M78 472 q28 -14 62 -5 q14 25 6 40 q-35 13 -68 1 q-12 -19 0 -36 z"/>
    <path class="ln" stroke-width="1.4" d="M94 485 q2 15 -1 23" opacity="0.6"/>
    <path class="ln" stroke-width="1.4" d="M112 482 q2 16 -1 25" opacity="0.6"/>
    <path class="ln" stroke-width="1.4" d="M130 481 q2 14 0 22" opacity="0.6"/>
  </g>
  <g id="hand_right">
    <path d="M342 472 q-28 -14 -62 -5 q-14 25 -6 40 q35 13 68 1 q12 -19 0 -36 z" class="sk"/>
    <path d="M342 491 q-32 11 -66 2 q-1 8 -2 14 q35 13 68 1 z" class="skd" opacity="0.4"/>
    <path class="ln" stroke-width="3.4" d="M342 472 q-28 -14 -62 -5 q-14 25 -6 40 q35 13 68 1 q12 -19 0 -36 z"/>
    <path class="ln" stroke-width="1.4" d="M326 485 q-2 15 1 23" opacity="0.6"/>
    <path class="ln" stroke-width="1.4" d="M308 482 q-2 16 1 25" opacity="0.6"/>
    <path class="ln" stroke-width="1.4" d="M290 481 q-2 14 0 22" opacity="0.6"/>
  </g>
</g>
</svg>
