<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800"
     id="figure_b.wardrobe.formal" data-asset="figure_b" data-kind="wardrobe"
     data-wardrobe="formal" data-base-point="210,800">
<!-- IRX 2B.1 = figure_b wardrobe: formal (Alex).

     Used by act4_engagement_party, where he is newly engaged and hugging you
     while you know what you know. Open jacket over a collared shirt, no tie -
     an engagement party at a venue, not a wedding.

     Silhouette is deliberately squarer than home_casual: structured shoulders,
     lapels, a straight hem. At 220px the lapel V is the cue that separates
     formal from casual, so it carries the heaviest stroke in the garment.

     Drawn in figure_b's local space; overlays the body with no per-frame offset.
     Exports one group, same contract as every other wardrobe. -->
<defs><style>
/* @tokens-begin */
:root {
  /* line */
  --irx-line:          #241D19;
  --irx-line-soft:     #3B302A;
  --irx-shadow:        #2A231E;

  /* architecture */
  --irx-wall:          #5C6A5F;
  --irx-wall-dark:     #4E5A51;
  --irx-wall-pattern:  #556359;
  --irx-tile:          #B5A992;
  --irx-tile-alt:      #A49980;
  --irx-floor:         #5E4D3E;

  /* window */
  --irx-sky-high:      #334051;
  --irx-sky-mid:       #4D4656;
  --irx-sky-low:       #785A4F;
  --irx-outside-dark:  #2A333E;
  --irx-curtain:       #424E56;
  --irx-curtain-dark:  #38424A;

  /* joinery */
  --irx-cabinet:       #785D44;
  --irx-cabinet-dark:  #634C36;
  --irx-counter:       #947553;
  --irx-counter-edge:  #7B5F43;

  /* character */
  --irx-skin:          #A87A5A;
  --irx-skin-shade:    #875D42;
  /* figure_b: same warm hazel family, one step deeper than figure_a */
  --irx-skin-b:        #8E6244;
  --irx-skin-b-shade:  #6E4A32;
  /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
     mouth with --irx-line reads as black lips. */
  --irx-lip-b:         #96604F;
  --irx-mouth-b:       #4A2C24;
  --irx-hair:          #41322A;
  --irx-hair-light:    #554136;
  /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
  --irx-hair-b:        #241A16;
  --irx-hair-b-light:  #3D2C24;

  /* wardrobe: home_casual */
  --irx-cloth:         #A8603F;
  --irx-cloth-dark:    #894C31;
  --irx-cloth-inner:   #D9CDBC;

  /* props */
  --irx-glass:         #BCC8C3;
  --irx-glass-dark:    #9AA8A2;
  --irx-highlight:     #FFFFFF;
  --irx-jacket:        #4F5A63;
  --irx-jacket-dark:   #3D464E;

  /* accent — neighbourhood district, warm light only */
  --irx-accent:        #FFC15E;
  --irx-accent-dim:    #C89A4E;
  --irx-lamp-warm:     #F2C77E;
  --irx-cool-spill:    #7E93A8;

  /* vignettes: montage panels only. Desaturated and reduced, so compressed
     time reads differently from present tense without a caption saying so.
     A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
     validate_assets.py rule 13. */
  --irx-vig-light:     #B3ABA0;
  --irx-vig-base:      #8C857C;
  --irx-vig-mid:       #635D56;
  --irx-vig-dark:      #3B3733;

  /* stroke weights */
  --irx-stroke-xheavy: 6.6;
  --irx-stroke-heavy:  5;
  --irx-stroke:        3.4;
  --irx-stroke-fine:   2.1;
  --irx-stroke-hair:   1.4;

  /* ==== career district ==== */
/* career: architecture */
--irx-career-wall:          #6E757E;
--irx-career-wall-dark:     #5C636B;
--irx-career-wall-pattern:  #666D76;
--irx-career-partition:     #58606A;
--irx-career-partition-dark:#4A5158;
--irx-career-floor:         #4A4F55;
/* career: window, evening. The office is lit; outside is not. */
--irx-career-sky-high:      #1E2836;
--irx-career-sky-mid:       #26303D;
--irx-career-sky-low:       #2E3444;
--irx-career-outside-dark:  #161C25;
/* career: joinery */
--irx-career-desk:          #8A8478;
--irx-career-desk-edge:     #6F6A60;
--irx-career-desk-dark:     #5E5A52;
--irx-career-metal:         #7A828A;
--irx-career-metal-dark:    #626A72;
/* career: light. Overhead fluorescent and one screen. */
--irx-career-fluoro:        #E8EDF2;
--irx-career-fluoro-dim:    #A8B2BC;
--irx-career-screen:        #6E93A8;
--irx-career-screen-glow:   #9FC4D8;
/* career: figure_c (Ray) */
--irx-career-skin-c:        #D9A886;
--irx-career-skin-c-shade:  #B98565;
--irx-career-hair-c:        #6E655C;
--irx-career-hair-c-light:  #8A8076;
--irx-career-lip-c:         #B57F66;
--irx-career-mouth-c:       #6B4436;
/* career: figure_d (Dana) */
--irx-career-skin-d:        #E0B294;
--irx-career-skin-d-shade:  #BE8D6F;
--irx-career-hair-d:        #4A4038;
--irx-career-hair-d-light:  #6A5C50;
/* career: wardrobe work */
--irx-career-shirt-c:       #9FA9B4;
--irx-career-shirt-c-dark:  #7E8894;
--irx-career-shirt-c-fold:  #6B7480;
/* career: wardrobe work_coat */
--irx-career-coat-c:        #4E5661;
--irx-career-coat-c-dark:   #3C434D;
--irx-career-coat-c-fold:   #5C6570;
/* career: accent. Matches district_theme.dart Career accent 0xFF7EA6DB. */
--irx-career-accent:        #7EA6DB;
--irx-career-accent-dim:    #5F7FA9;
  --irx-career-suit-d:        #7A3B47;
  --irx-career-suit-d-dark:   #5E2C36;
  --irx-career-suit-d-fold:   #8E4A57;
}
/* @tokens-end */
.ln  { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.jkt { fill: var(--irx-shadow); }
.jkd { fill: var(--irx-line-soft); }
.shirt { fill: var(--irx-cloth-inner); }
</style></defs>

<g id="character_clothing">
  <!-- shirt -->
  <path d="M158 224 q52 30 104 0 q14 62 12 140 q-2 92 -6 178 h-118
           q-4 -86 -6 -178 q-2 -78 14 -140 z" class="shirt"/>
  <path class="ln" stroke-width="1.4" d="M210 250 q3 74 1 148" opacity="0.35"/>
  <!-- shirt collar, standing -->
  <path d="M180 222 q30 20 60 0 l-6 22 q-24 14 -48 0 z" class="shirt"/>
  <path class="ln" stroke-width="2.8" d="M180 222 q30 20 60 0 l-6 22 q-24 14 -48 0 z"/>

  <!-- jacket: left panel, structured shoulder, straight hem -->
  <path d="M110 258 q18 -44 70 -42 l14 34 q-16 40 -20 100 q-5 84 -3 208 h-64
           q-4 -80 -6 -176 q-2 -90 9 -124 z" class="jkt"/>
  <path class="ln" stroke-width="6.6" d="M110 258 q18 -44 70 -42 l14 34 q-16 40 -20 100 q-5 84 -3 208"/>

  <!-- jacket: right panel -->
  <path d="M310 258 q-18 -44 -70 -42 l-14 34 q16 40 20 100 q5 84 3 208 h64
           q4 -80 6 -176 q2 -90 -9 -124 z" class="jkt"/>
  <path class="ln" stroke-width="6.6" d="M310 258 q-18 -44 -70 -42 l-14 34 q16 40 20 100 q5 84 3 208"/>

  <!-- lapels: the formal cue that survives at 220px -->
  <path d="M180 216 l14 34 q-14 34 -18 84 q-14 -46 -12 -92 q2 -18 16 -26 z" class="jkd"/>
  <path class="ln" stroke-width="4.6" d="M180 216 l14 34 q-14 34 -18 84"/>
  <path d="M240 216 l-14 34 q14 34 18 84 q14 -46 12 -92 q-2 -18 -16 -26 z" class="jkd"/>
  <path class="ln" stroke-width="4.6" d="M240 216 l-14 34 q14 34 18 84"/>
  <path class="ln" stroke-width="3.0" d="M194 250 q16 10 32 0" opacity="0.8"/>

  <!-- sleeves, cuffs stopping short of the wrists -->
  <path d="M118 258 q-40 58 -46 116 q-4 32 4 60 l42 -14 q-8 -28 -4 -56 q6 -51 40 -99 z" class="jkt"/>
  <path class="ln" stroke-width="6.6" d="M118 258 q-40 58 -46 116 q-4 32 4 60"/>
  <path class="ln" stroke-width="6.6" d="M154 270 q-34 47 -40 98 q-4 26 2 52"/>
  <path d="M76 434 q30 13 46 -10 l-5 -18 l-45 16 z" class="jkd"/>
  <path class="ln" stroke-width="3.0" d="M76 434 q30 13 46 -10"/>

  <path d="M302 258 q40 58 46 116 q4 32 -4 60 l-42 -14 q8 -28 4 -56 q-6 -51 -40 -99 z" class="jkt"/>
  <path class="ln" stroke-width="6.6" d="M302 258 q40 58 46 116 q4 32 -4 60"/>
  <path class="ln" stroke-width="6.6" d="M266 270 q34 47 40 98 q4 26 -2 52"/>
  <path d="M344 434 q-30 13 -46 -10 l5 -18 l45 16 z" class="jkd"/>
  <path class="ln" stroke-width="3.0" d="M344 434 q-30 13 -46 -10"/>

  <!-- one button, and the right-side shade to match the key light -->
  <path class="ln" stroke-width="4.0" d="M212 372 h2" opacity="0.9"/>
  <path d="M276 292 q14 62 12 130 q-2 60 -5 118 h-22 q4 -126 -2 -194 q-2 -32 17 -54 z"
        fill="var(--irx-shadow)" opacity="0.2"/>
</g>
</svg>
