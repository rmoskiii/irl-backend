<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" data-neck-anchor="100,210" data-register-rotate="-11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs><style>/* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* vignettes */
        --irx-vig-light:     #B3ABA0;
        --irx-vig-base:      #8C857C;
        --irx-vig-mid:       #635D56;
        --irx-vig-dark:      #3B3733;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;

        /* ==== the streets — six characters, deliberately differentiated ==== */
        /* figure_e — Bola. African, fifties. */
        --irx-skin-e:        #6B4A33;
        --irx-skin-e-shade:  #4F3524;
        --irx-hair-e:        #2E2622;
        --irx-hair-e-light:  #4A3F38;
        --irx-lip-e:         #7A4F42;
        --irx-mouth-e:       #3A2019;
        /* figure_f — Jay. Brown, mid-complexion, nineteen. */
        --irx-skin-f:        #96684A;
        --irx-skin-f-shade:  #754F36;
        --irx-hair-f:        #221A15;
        --irx-hair-f-light:  #3A2B22;
        --irx-lip-f:         #9C6552;
        --irx-mouth-f:       #4A2A22;
        /* figure_g — Tunde. African, thirties to forties. */
        --irx-skin-g:        #5E4030;
        --irx-skin-g-shade:  #452D21;
        --irx-hair-g:        #2A221E;
        --irx-hair-g-light:  #423731;
        --irx-lip-g:         #6E463A;
        --irx-mouth-g:       #331C16;
        /* figure_h — Dee. White, twenty-seven. */
        --irx-skin-h:        #C9A184;
        --irx-skin-h-shade:  #A87F64;
        --irx-hair-h:        #5A4332;
        --irx-hair-h-light:  #775843;
        --irx-lip-h:         #B3806C;
        --irx-mouth-h:       #6B4034;
        /* figure_i — Kai. Brown, a different complexion from Jay. */
        --irx-skin-i:        #A8794F;
        --irx-skin-i-shade:  #86603D;
        --irx-hair-i:        #281F1A;
        --irx-hair-i-light:  #41332B;
        --irx-lip-i:         #A87057;
        --irx-mouth-i:       #4F2E23;
        /* figure_j — Amara. Caramel, nineteen to twenty. */
        --irx-skin-j:        #B08258;
        --irx-skin-j-shade:  #8E6644;
        --irx-hair-j:        #2B211C;
        --irx-hair-j-light:  #463831;
        --irx-lip-j:         #AE7460;
        --irx-mouth-j:       #533026;
        }
        /* @tokens-end */</style><style>.jf-ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }</style></defs>
    <g id="character_head">
        <path id="jf-h-neck" fill="var(--irx-skin-f-shade)" d="M85 150 h38 v70 h-38 z"/>
        <path id="jf-h-neck-f" class="jf-ln" stroke-width="var(--irx-stroke)" d="M85 176 v44 M123 176 v44"/>
        <path id="jf-h-ear-l" fill="var(--irx-skin-f-shade)" d="M50 102 q-11 0 -11 14 q0 19 13 24 q7 1 8 -7 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-h-ear-r" fill="var(--irx-skin-f-shade)" d="M150 102 q11 0 11 14 q0 19 -13 24 q-7 1 -8 -7 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke-fine)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-h-skull" fill="var(--irx-skin-f)" d="M100 12 q44 0 55 32 q7 20 5 40 q-1 24 -6 44 q-6 26 -16 42 q-12 19 -26 23 q-4 1 -12 1 q-8 0 -12 -1 q-14 -4 -26 -23 q-10 -16 -16 -42 q-5 -20 -6 -44 q-2 -20 5 -40 q11 -32 55 -32 z" stroke="var(--irx-line)" stroke-width="var(--irx-stroke)" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="jf-h-hair" fill="var(--irx-hair-f)" d="M100 13 q43 0 54 32 q6 18 5 36 q-7 -16 -16 -22 q-9 13 -20 6 q-12 -12 -23 -12 q-11 0 -23 12 q-11 7 -20 -6 q-9 6 -16 22 q-1 -18 5 -36 q11 -32 54 -32 z"/>
        <path id="jf-h-hair-hi" fill="var(--irx-hair-f-light)" d="M120 20 q26 9 32 38 q-7 -16 -16 -22 q-6 -9 -16 -16 z"/>
        <path id="jf-h-brow" class="jf-ln" stroke-width="var(--irx-stroke)" d="M69 92 q14 -8 25 0 M131 90 q-14 -8 -25 0"/>
        <path id="jf-h-eyew-l" fill="var(--irx-cloth-inner)" d="M70 111 q13 -9 26 -0.6 q-13 9 -26 1 z"/>
        <path id="jf-h-eyew-r" fill="var(--irx-cloth-inner)" d="M130 110 q-13 -9 -26 -0.6 q13 9 26 1 z"/>
        <path id="jf-h-iris-l" fill="var(--irx-line)" d="M84 107 q4.5 0 4.5 4.5 q0 4.5 -4.5 4.5 q-4.5 0 -4.5 -4.5 q0 -4.5 4.5 -4.5 z"/>
        <path id="jf-h-iris-r" fill="var(--irx-line)" d="M118 106 q4.5 0 4.5 4.5 q0 4.5 -4.5 4.5 q-4.5 0 -4.5 -4.5 q0 -4.5 4.5 -4.5 z"/>
        <path id="jf-h-lid-l" class="jf-ln" stroke-width="var(--irx-stroke-fine)" d="M70 111 q13 -9 26 -0.6"/>
        <path id="jf-h-lid-r" class="jf-ln" stroke-width="var(--irx-stroke-fine)" d="M130 110 q-13 -9 -26 -0.6"/>
        <path id="jf-h-nose" class="jf-ln" stroke-width="var(--irx-stroke-fine)" d="M99 120 q-4 14 -1 19 q4 3 9 1"/>
        <path id="jf-h-lip-up" fill="var(--irx-lip-f)" d="M84 159 q16 -6 32 0 q-6 3 -16 3 q-10 0 -16 -3 z"/>
        <path id="jf-h-lip-lo" fill="var(--irx-lip-f)" d="M86 166 q14 3 28 0 q-4 7 -14 7 q-10 0 -14 -7 z"/>
        <path id="jf-h-mouth" fill="var(--irx-mouth-f)" d="M87 161 q13 2 26 0 q-3 6 -13 6 q-10 0 -13 -6 z"/>
        <path id="jf-h-mouth-f" class="jf-ln" stroke-width="var(--irx-stroke-fine)" d="M84 159 q16 -6 32 0"/>
    </g>
</svg>