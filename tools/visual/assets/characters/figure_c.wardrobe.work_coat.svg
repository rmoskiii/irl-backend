<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 800"
     id="figure_c.wardrobe.work_coat" data-asset="figure_c" data-kind="wardrobe"
     data-wardrobe="work_coat" data-base-point="210,800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <!-- IRX 2B.7 = figure_c wardrobe: work_coat (Ray).

         A wardrobe variant of the approved Ray, not a new character. Body geometry,
         face, hair, skin, neck construction and the shirt underneath are all
         untouched.

         WHAT THE CONTRACT ASKS OF THIS FILE. From the Career manifest: "The coat is
         a wardrobe, not a prop - 'coat already on' is the Act 1 pressure signal and
         it has to read at 390pt on silhouette alone." Ray is at the end of your
         desk at half past eight with his coat on, which is the whole point of the
         beat: he is leaving, and he is asking on his way out. So the requirement is
         not decoration, it is a SILHOUETTE that differs from `work` at 54pt.

         Three levers do that, none of them colour:
           1. shoulders 14 wider each side, and squarer
           2. full-length sleeves to a cuff at y445 - `work` has rolled cuffs at
              y415, so the arm reads long here and short there
           3. an open front with notch lapels, which puts two hard diagonals into a
              silhouette that is otherwise a smooth taper

         THE SHIRT UNDERNEATH IS THE APPROVED ONE. Only one wardrobe composes per
         frame, so this file draws the visible parts of `work` - body, collar,
         placket - at exactly the coordinates the approved file uses, then the coat
         over it. Nothing about the shirt is redesigned to make the coat fit; the
         coat opening was cut to clear the collar the shirt already has.

         Cuff at y445, clear of the body's forearm at y452 and the hands at y450..508
         in `character_front`. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line and stroke: GLOBAL craft language, identical in both districts.
        Not namespaced - the line weight and colour are the thing the two
        districts have in common, and forking them would fork the craft. */
        --irx-line:                 #241D19;
        --irx-line-soft:            #3B302A;
        --irx-shadow:               #2A231E;

        /* career: architecture */
        --irx-career-wall:          #6E757E;
        --irx-career-wall-dark:     #5C636B;
        --irx-career-wall-pattern:  #666D76;
        --irx-career-partition:     #58606A;
        --irx-career-partition-dark:#4A5158;
        --irx-career-floor:         #4A4F55;

        /* career: window, evening. The office is lit; outside is not. */
        --irx-career-sky-high:      #1E2836;
        --irx-career-sky-mid:       #26303D;
        --irx-career-sky-low:       #2E3444;
        --irx-career-outside-dark:  #161C25;

        /* career: joinery */
        --irx-career-desk:          #8A8478;
        --irx-career-desk-edge:     #6F6A60;
        --irx-career-desk-dark:     #5E5A52;
        --irx-career-metal:         #7A828A;
        --irx-career-metal-dark:    #626A72;

        /* career: light. Overhead fluorescent and one screen. */
        --irx-career-fluoro:        #E8EDF2;
        --irx-career-fluoro-dim:    #A8B2BC;
        --irx-career-screen:        #6E93A8;
        --irx-career-screen-glow:   #9FC4D8;

        /* career: figure_c (Ray) */
        --irx-career-skin-c:        #D9A886;
        --irx-career-skin-c-shade:  #B98565;
        --irx-career-hair-c:        #6E655C;
        --irx-career-hair-c-light:  #8A8076;
        --irx-career-lip-c:         #B57F66;
        --irx-career-mouth-c:       #6B4436;

        /* career: figure_d (Dana) */
        --irx-career-skin-d:        #E0B294;
        --irx-career-skin-d-shade:  #BE8D6F;
        --irx-career-hair-d:        #4A4038;
        --irx-career-hair-d-light:  #6A5C50;

        /* career: wardrobe work */
        --irx-career-shirt-c:       #9FA9B4;
        --irx-career-shirt-c-dark:  #7E8894;
        --irx-career-shirt-c-fold:  #6B7480;

        /* career: wardrobe work_coat */
        --irx-career-coat-c:        #4E5661;
        --irx-career-coat-c-dark:   #3C434D;
        --irx-career-coat-c-fold:   #5C6570;

        /* career: accent. Matches district_theme.dart Career accent 0xFF7EA6DB. */
        --irx-career-accent:        #7EA6DB;
        --irx-career-accent-dim:    #5F7FA9;

        /* vignettes: montage panels only. Global ramp, shared with neighbourhood. */
        --irx-vig-light:            #B3ABA0;
        --irx-vig-base:             #8C857C;
        --irx-vig-mid:              #635D56;
        --irx-vig-dark:             #3B3733;

        /* stroke weights: global */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln  { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .sh  { fill: var(--irx-career-shirt-c); }
        .shd { fill: var(--irx-career-shirt-c-dark); }
        .shf { fill: var(--irx-career-shirt-c-fold); }
        .co  { fill: var(--irx-career-coat-c); }
        .cod { fill: var(--irx-career-coat-c-dark); }
        .cof { fill: var(--irx-career-coat-c-fold); }
    </style></defs>

    <g id="character_clothing">

        <!-- ===================== the approved shirt, underneath ===================
             Same coordinates as figure_c.wardrobe.work.svg. Only the parts that show
             through the coat opening are needed, but the body is drawn whole so the
             coat can be cut against it rather than the two being fitted to each
             other. -->
        <path d="M118 258 q29 -34 67 -46 q10 28 25 28 q15 0 25 -28 q38 12 67 46
           q10 96 8 200 q-2 90 -6 172 h-188 q-4 -82 -6 -172 q-2 -104 8 -200 z"
              class="sh"/>
        <path d="M235 212 q38 12 67 46 q10 96 8 200 q-2 90 -6 172 h-92
           q4 -180 2 -260 q-1 -60 22 -122 z" class="shd" opacity="0.30"/>
        <path d="M184 216 q26 7 52 0 q1 9 0 17 q-26 7 -52 0 q-1 -9 0 -17 z" class="shf"/>
        <path class="ln" stroke-width="2.4" d="M184 216 q26 7 52 0"/>
        <path d="M184 231 L 201 243 L 187 264 L 159 236 L 170 220 Z" class="sh"/>
        <path d="M184 231 L 201 243 L 187 264 L 174 250 Z" class="shd" opacity="0.45"/>
        <path class="ln" stroke-width="3.0" d="M184 231 L 201 243 L 187 264 L 159 236 L 170 220"/>
        <path d="M236 231 L 219 243 L 233 264 L 261 236 L 250 220 Z" class="sh"/>
        <path d="M236 231 L 219 243 L 233 264 L 246 250 Z" class="shd" opacity="0.60"/>
        <path class="ln" stroke-width="3.0" d="M236 231 L 219 243 L 233 264 L 261 236 L 250 220"/>
        <path class="ln" stroke-width="2.4" d="M201 243 L 210 262" opacity="0.45"/>
        <path class="ln" stroke-width="2.4" d="M219 243 L 210 262" opacity="0.45"/>
        <path class="ln" stroke-width="2.1" d="M210 264 q3 110 1 238" opacity="0.55"/>
        <g class="ln" stroke-width="1.4" opacity="0.45">
            <path d="M206 340 h8"/><path d="M206 386 h8"/><path d="M206 442 h8"/><path d="M206 498 h8"/>
        </g>

        <!-- ============================== the coat ==============================
             Worn open. Left and right fronts hang either side of a gap from x180 to
             x240, which is where the shirt collar, placket and buttons stay visible. -->

        <!-- left front -->
        <path d="M104 268 q28 -42 72 -54 l8 6 l-8 96 l4 258 h-76
           q-6 -152 0 -306 z" class="co"/>
        <path class="ln" stroke-width="6.6"
              d="M104 268 q28 -42 72 -54 l8 6 l-8 96 l4 258"/>
        <!-- right front, one step darker: the key is from the left, as everywhere -->
        <path d="M316 268 q-28 -42 -72 -54 l-8 6 l8 96 l-4 258 h76
           q6 -152 0 -306 z" class="co"/>
        <path d="M316 268 q-28 -42 -72 -54 l-8 6 l8 96 l-4 258 h76
           q6 -152 0 -306 z" class="cod" opacity="0.34"/>
        <path class="ln" stroke-width="6.6"
              d="M316 268 q-28 -42 -72 -54 l-8 6 l8 96 l-4 258"/>

        <!-- notch lapels: the two hard diagonals that carry the silhouette. The
             inner edge starts at the shirt collar's own neck point (184/236, 216)
             so the coat sits against the collar rather than over it. -->
        <path d="M184 218 L 176 300 L 148 278 L 158 230 Z" class="cof"/>
        <path class="ln" stroke-width="3.0" d="M184 218 L 176 300 L 148 278 L 158 230 Z"/>
        <path class="ln" stroke-width="1.6" d="M180 240 L 166 268" opacity="0.4"/>
        <path d="M236 218 L 244 300 L 272 278 L 262 230 Z" class="cof"/>
        <path d="M236 218 L 244 300 L 272 278 L 262 230 Z" class="cod" opacity="0.30"/>
        <path class="ln" stroke-width="3.0" d="M236 218 L 244 300 L 272 278 L 262 230 Z"/>
        <path class="ln" stroke-width="1.6" d="M240 240 L 254 268" opacity="0.34"/>

        <!-- coat collar: a low stand behind the shirt collar, showing at the sides
             of the neck only. Anything above y202 is covered by the head. -->
        <path d="M158 230 L 184 218 L 178 206 L 154 220 Z" class="cod"/>
        <path class="ln" stroke-width="2.4" d="M158 230 L 184 218 L 178 206 L 154 220 Z"/>
        <path d="M262 230 L 236 218 L 242 206 L 266 220 Z" class="cod"/>
        <path class="ln" stroke-width="2.4" d="M262 230 L 236 218 L 242 206 L 266 220 Z"/>

        <!-- sleeves: full length, heavier than the shirt's, to a cuff at y445.
             `work` rolls its cuffs at y415 - the difference in arm length is the
             second silhouette lever. -->
        <path d="M110 272 q-36 66 -34 142 q1 16 3 30 l50 -4 q-4 -22 -3 -38
           q3 -58 30 -112 z" class="co"/>
        <path class="ln" stroke-width="6.6" d="M110 272 q-36 66 -34 142 q1 16 3 30"/>
        <path class="ln" stroke-width="6.6" d="M156 290 q-26 50 -28 104 q-1 16 2 32"/>
        <path d="M76 444 q30 14 53 -4 l-3 -22 l-52 4 z" class="cof"/>
        <path class="ln" stroke-width="3.4" d="M76 444 q30 14 53 -4"/>
        <path class="ln" stroke-width="2.1" d="M74 422 q30 14 53 -4" opacity="0.5"/>

        <path d="M310 272 q36 66 34 142 q-1 16 -3 30 l-50 -4 q4 -22 3 -38
           q-3 -58 -30 -112 z" class="co"/>
        <path d="M310 272 q36 66 34 142 q-1 16 -3 30 l-50 -4 q4 -22 3 -38
           q-3 -58 -30 -112 z" class="cod" opacity="0.34"/>
        <path class="ln" stroke-width="6.6" d="M310 272 q36 66 34 142 q-1 16 -3 30"/>
        <path class="ln" stroke-width="6.6" d="M264 290 q26 50 28 104 q1 16 -2 32"/>
        <path d="M344 444 q-30 14 -53 -4 l3 -22 l52 4 z" class="cof"/>
        <path class="ln" stroke-width="3.4" d="M344 444 q-30 14 -53 -4"/>
        <path class="ln" stroke-width="2.1" d="M346 422 q-30 14 -53 -4" opacity="0.5"/>

        <!-- shoulder seams and a little weight in the cloth. Wool hangs; it does not
             crease the way the shirt does at the waist. -->
        <path class="ln" stroke-width="2.1" d="M122 262 q24 -26 54 -40" opacity="0.45"/>
        <path class="ln" stroke-width="2.1" d="M298 262 q-24 -26 -54 -40" opacity="0.45"/>
        <path class="ln" stroke-width="1.4" d="M132 340 q6 100 4 190" opacity="0.28"/>
        <path class="ln" stroke-width="1.4" d="M288 340 q-6 100 -4 190" opacity="0.22"/>
    </g>
</svg>