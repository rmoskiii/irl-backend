<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 130"
     id="prop.last_glass" data-asset="prop.last_glass"
     data-base-point="45,130">
    <!-- IRX Phase 2A — prop.last_glass.
         Authored in the_secret.json as "the last glass" (node: confession).
         Everyone else has gone home; this is the one that didn't get dried. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5D6B60;
        --irx-wall-dark:     #4C584F;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #C2B8A5;
        --irx-tile-alt:      #AEA48E;
        --irx-floor:         #5A4A3B;

        /* window */
        --irx-sky-high:      #2F3A4A;
        --irx-sky-mid:       #4A4352;
        --irx-sky-low:       #7A5B50;
        --irx-outside-dark:  #232A33;
        --irx-curtain:       #3F4A52;
        --irx-curtain-dark:  #333C43;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #5F4934;
        --irx-counter:       #9B7A57;
        --irx-counter-edge:  #7C6043;

        /* character */
        --irx-skin:          #D3A17C;
        --irx-skin-shade:    #B8845F;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .md { stroke-width: 3.4; }
        .fn { stroke-width: 2.1; }
        .gl  { fill: var(--irx-glass); }
        .gld { fill: var(--irx-glass-dark); }
    </style></defs>

    <g id="prop">
        <!-- tumbler body, very slightly tapered and not perfectly symmetrical -->
        <path d="M20 26 q25 -7 51 0 q3 52 -2 100 q-24 6 -47 0 q-5 -48 -2 -100 z"
              class="gl" opacity="0.72"/>
        <!-- the last of the water -->
        <path d="M22 92 q23 5 45 0 q-1 18 -2 34 q-21 5 -41 0 q-1 -16 -2 -34 z"
              class="gld" opacity="0.85"/>
        <path class="ln md" d="M20 26 q25 -7 51 0 q3 52 -2 100 q-24 6 -47 0 q-5 -48 -2 -100 z"/>
        <path class="ln fn" d="M20 26 q25 8 51 0" opacity="0.9"/>
        <path class="ln fn" d="M22 92 q23 5 45 0" opacity="0.7"/>
        <!-- one highlight, no gradient -->
        <path class="ln fn" d="M31 40 q-3 34 0 62" opacity="0.5" stroke="var(--irx-highlight)"/>
    </g>
</svg>