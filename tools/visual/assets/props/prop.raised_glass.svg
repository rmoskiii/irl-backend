<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 160"
     id="prop.raised_glass" data-asset="prop.raised_glass" data-base-point="45,160">
    <!-- IRX 2B.4 = prop.raised_glass.

         act4_engagement_party and act4_late_disclosure. A flute, because this is the
         toast - the moment the player raises a glass to a marriage they know is
         built on something. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        /* figure_b: same warm hazel family, one step deeper than figure_a */
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
        mouth with --irx-line reads as black lips. */
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .gl  { fill: var(--irx-glass); }
        .gld { fill: var(--irx-glass-dark); }
    </style></defs>

    <g id="prop">
        <path d="M26 12 q19 -5 38 0 q3 40 -6 62 q-6 14 -13 16 q-7 -2 -13 -16 q-9 -22 -6 -62 z"
              class="gl" opacity="0.72"/>
        <path d="M30 48 q15 4 30 0 q-2 22 -8 32 q-4 8 -7 10 q-3 -2 -7 -10 q-6 -10 -8 -32 z"
              class="gld" opacity="0.8"/>
        <path class="ln" stroke-width="2.8" d="M26 12 q19 -5 38 0 q3 40 -6 62 q-6 14 -13 16 q-7 -2 -13 -16 q-9 -22 -6 -62 z"/>
        <path class="ln" stroke-width="2.0" d="M26 12 q19 6 38 0" opacity="0.85"/>
        <path class="ln" stroke-width="1.6" d="M30 48 q15 5 30 0" opacity="0.6"/>
        <path class="ln" stroke-width="3.4" d="M45 90 q1 26 0 50"/>
        <path d="M22 148 q23 -8 46 0 q2 6 0 10 q-23 5 -46 0 z" class="gl" opacity="0.66"/>
        <path class="ln" stroke-width="2.6" d="M22 148 q23 -8 46 0 q2 6 0 10 q-23 5 -46 0 z"/>
        <path class="ln" stroke-width="1.6" d="M34 26 q-3 30 2 52" opacity="0.45" stroke="var(--irx-highlight)"/>
    </g>
</svg>