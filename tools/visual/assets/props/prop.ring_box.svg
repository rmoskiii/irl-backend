<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100"
     id="prop.ring_box" data-asset="prop.ring_box" data-base-point="60,100">
    <!-- IRX 2B.4 = prop.ring_box.

         act2_alex_reveal. The single most narratively loaded object in the scenario:
         it communicates the whole premise without a word of dialogue. Open, so the
         ring is visible - a closed box would just be a box.

         Deliberately small. It sits on the console beside him and does not compete
         with his face; the player finds it, which is better than being shown it. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        /* figure_b: same warm hazel family, one step deeper than figure_a */
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
        mouth with --irx-line reads as black lips. */
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .box  { fill: var(--irx-jacket); }
        .boxd { fill: var(--irx-jacket-dark); }
        .lin  { fill: var(--irx-cloth-inner); }
        .ring { fill: var(--irx-accent); }
    </style></defs>

    <g id="prop">
        <path d="M22 56 q38 -6 76 0 q4 22 0 44 q-38 5 -76 -1 z" class="box"/>
        <path d="M22 56 q38 -6 76 0 q2 10 1 20 q-38 5 -77 -1 z" class="boxd" opacity="0.5"/>
        <path class="ln" stroke-width="3.0" d="M22 56 q38 -6 76 0 q4 22 0 44 q-38 5 -76 -1 z"/>
        <!-- open lid, tipped back -->
        <path d="M24 54 q36 -8 72 -2 q2 -26 -2 -40 q-34 -6 -68 0 q-4 16 -2 42 z" class="boxd"/>
        <path class="ln" stroke-width="3.0" d="M24 54 q36 -8 72 -2 q2 -26 -2 -40 q-34 -6 -68 0 q-4 16 -2 42 z"/>
        <path d="M34 46 q26 -6 52 -2 q1 -18 -1 -28 q-24 -4 -48 0 q-3 12 -3 30 z" class="lin"/>
        <!-- the ring -->
        <path d="M52 58 q8 -12 16 0 q-8 4 -16 0 z" class="lin"/>
        <circle cx="60" cy="50" r="7" fill="none" stroke="var(--irx-accent)" stroke-width="3.4"/>
        <circle cx="60" cy="41" r="3.2" class="ring"/>
    </g>
</svg>