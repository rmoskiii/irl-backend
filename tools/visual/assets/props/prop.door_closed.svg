<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 680"
     id="prop.door_closed" data-asset="prop.door_closed" data-base-point="170,680">
    <!-- IRX 2B.4 = prop.door_closed.

         confession_guarded and jessica_leaves_halfsecret, both in scene.kitchen:
         "The door clicks - no slam, nothing dramatic. Just closed."

         SCOPED TO THE KITCHEN. street_exterior and party both name this prop in
         their render blocks, but both environments already contain a fire door;
         declaring it there would draw a second one. Those frames omit it. The
         kitchen is the only room with no door of its own, and the only one where
         the closing of it is the beat. -->
    <defs><style>
        /* @tokens-begin */
        :root {
        /* line */
        --irx-line:          #241D19;
        --irx-line-soft:     #3B302A;
        --irx-shadow:        #2A231E;

        /* architecture */
        --irx-wall:          #5C6A5F;
        --irx-wall-dark:     #4E5A51;
        --irx-wall-pattern:  #556359;
        --irx-tile:          #B5A992;
        --irx-tile-alt:      #A49980;
        --irx-floor:         #5E4D3E;

        /* window */
        --irx-sky-high:      #334051;
        --irx-sky-mid:       #4D4656;
        --irx-sky-low:       #785A4F;
        --irx-outside-dark:  #2A333E;
        --irx-curtain:       #424E56;
        --irx-curtain-dark:  #38424A;

        /* joinery */
        --irx-cabinet:       #785D44;
        --irx-cabinet-dark:  #634C36;
        --irx-counter:       #947553;
        --irx-counter-edge:  #7B5F43;

        /* character */
        --irx-skin:          #A87A5A;
        --irx-skin-shade:    #875D42;
        /* figure_b: same warm hazel family, one step deeper than figure_a */
        --irx-skin-b:        #8E6244;
        --irx-skin-b-shade:  #6E4A32;
        /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
        mouth with --irx-line reads as black lips. */
        --irx-lip-b:         #96604F;
        --irx-mouth-b:       #4A2C24;
        --irx-hair:          #41322A;
        --irx-hair-light:    #554136;
        /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
        --irx-hair-b:        #241A16;
        --irx-hair-b-light:  #3D2C24;

        /* wardrobe: home_casual */
        --irx-cloth:         #A8603F;
        --irx-cloth-dark:    #894C31;
        --irx-cloth-inner:   #D9CDBC;

        /* props */
        --irx-glass:         #BCC8C3;
        --irx-glass-dark:    #9AA8A2;
        --irx-highlight:     #FFFFFF;
        --irx-jacket:        #4F5A63;
        --irx-jacket-dark:   #3D464E;

        /* accent — neighbourhood district, warm light only */
        --irx-accent:        #FFC15E;
        --irx-accent-dim:    #C89A4E;
        --irx-lamp-warm:     #F2C77E;
        --irx-cool-spill:    #7E93A8;

        /* stroke weights */
        --irx-stroke-xheavy: 6.6;
        --irx-stroke-heavy:  5;
        --irx-stroke:        3.4;
        --irx-stroke-fine:   2.1;
        --irx-stroke-hair:   1.4;
        }
        /* @tokens-end */
        .ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .dr  { fill: var(--irx-cabinet); }
        .drd { fill: var(--irx-cabinet-dark); }
        .frm { fill: var(--irx-tile-alt); }
    </style></defs>

    <g id="prop">
        <path d="M18 20 q152 -8 306 4 q6 320 2 646 q-154 6 -312 0 q-4 -330 4 -650 z" class="frm"/>
        <path class="ln" stroke-width="4.0" d="M18 20 q152 -8 306 4 q6 320 2 646 q-154 6 -312 0 q-4 -330 4 -650 z"/>
        <path d="M44 44 q126 -7 254 4 q5 300 1 606 q-128 5 -258 0 q-3 -310 3 -610 z" class="dr"/>
        <path d="M44 44 q126 -7 254 4 q2 100 2 202 q-128 5 -258 0 q-1 -104 2 -206 z" class="drd" opacity="0.28"/>
        <path class="ln" stroke-width="5.0" d="M44 44 q126 -7 254 4 q5 300 1 606 q-128 5 -258 0 q-3 -310 3 -610 z"/>
        <!-- two panels -->
        <path class="ln" stroke-width="2.6" d="M76 84 q94 -5 190 3 q3 106 1 214 q-96 4 -194 0 q-2 -110 3 -217 z"/>
        <path class="ln" stroke-width="2.6" d="M76 350 q94 -5 190 3 q3 106 1 214 q-96 4 -194 0 q-2 -110 3 -217 z"/>
        <!-- handle -->
        <path class="ln" stroke-width="6.0" d="M258 330 q14 2 14 14 q0 12 -14 14"/>
        <circle cx="252" cy="344" r="7" class="drd"/>
        <path class="ln" stroke-width="2.4" d="M252 344 m-7 0 a7 7 0 1 0 14 0 a7 7 0 1 0 -14 0"/>
    </g>
</svg>