<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 180"
     id="prop.tea_towel" data-asset="prop.tea_towel" data-base-point="75,180">
<!-- IRX 2B.4 = prop.tea_towel.

     `start` and jessica_leaves_halfsecret. The object she is holding when she
     asks to tell you something, and the one still in your hand after she goes.
     Hanging over the counter edge, half-folded. -->
<defs><style>
/* @tokens-begin */
:root {
  /* line */
  --irx-line:          #241D19;
  --irx-line-soft:     #3B302A;
  --irx-shadow:        #2A231E;

  /* architecture */
  --irx-wall:          #5C6A5F;
  --irx-wall-dark:     #4E5A51;
  --irx-wall-pattern:  #556359;
  --irx-tile:          #B5A992;
  --irx-tile-alt:      #A49980;
  --irx-floor:         #5E4D3E;

  /* window */
  --irx-sky-high:      #334051;
  --irx-sky-mid:       #4D4656;
  --irx-sky-low:       #785A4F;
  --irx-outside-dark:  #2A333E;
  --irx-curtain:       #424E56;
  --irx-curtain-dark:  #38424A;

  /* joinery */
  --irx-cabinet:       #785D44;
  --irx-cabinet-dark:  #634C36;
  --irx-counter:       #947553;
  --irx-counter-edge:  #7B5F43;

  /* character */
  --irx-skin:          #A87A5A;
  --irx-skin-shade:    #875D42;
  /* figure_b: same warm hazel family, one step deeper than figure_a */
  --irx-skin-b:        #8E6244;
  --irx-skin-b-shade:  #6E4A32;
  /* lips: figure_b skin with a pink shift. NOT the line colour - filling the
     mouth with --irx-line reads as black lips. */
  --irx-lip-b:         #96604F;
  --irx-mouth-b:       #4A2C24;
  --irx-hair:          #41322A;
  --irx-hair-light:    #554136;
  /* figure_b: 4C coil texture. near-black with a warm lift for the key light */
  --irx-hair-b:        #241A16;
  --irx-hair-b-light:  #3D2C24;

  /* wardrobe: home_casual */
  --irx-cloth:         #A8603F;
  --irx-cloth-dark:    #894C31;
  --irx-cloth-inner:   #D9CDBC;

  /* props */
  --irx-glass:         #BCC8C3;
  --irx-glass-dark:    #9AA8A2;
  --irx-highlight:     #FFFFFF;
  --irx-jacket:        #4F5A63;
  --irx-jacket-dark:   #3D464E;

  /* accent — neighbourhood district, warm light only */
  --irx-accent:        #FFC15E;
  --irx-accent-dim:    #C89A4E;
  --irx-lamp-warm:     #F2C77E;
  --irx-cool-spill:    #7E93A8;

  /* vignettes: montage panels only. Desaturated and reduced, so compressed
     time reads differently from present tense without a caption saying so.
     A vignette may use ONLY these, --irx-line and --irx-accent. Enforced by
     validate_assets.py rule 13. */
  --irx-vig-light:     #B3ABA0;
  --irx-vig-base:      #8C857C;
  --irx-vig-mid:       #635D56;
  --irx-vig-dark:      #3B3733;

  /* stroke weights */
  --irx-stroke-xheavy: 6.6;
  --irx-stroke-heavy:  5;
  --irx-stroke:        3.4;
  --irx-stroke-fine:   2.1;
  --irx-stroke-hair:   1.4;
}
/* @tokens-end */
.ln { stroke: var(--irx-line); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tw  { fill: var(--irx-tile-alt); }
.twd { fill: var(--irx-counter-edge); }
</style></defs>

<g id="prop">
  <path d="M18 14 q56 -12 114 4 q10 78 4 148 q-58 12 -118 -2 q-8 -74 0 -150 z" class="tw"/>
  <path d="M18 14 q56 -12 114 4 q3 24 3 48 q-58 12 -118 -2 q-1 -26 1 -50 z" class="twd" opacity="0.4"/>
  <path class="ln" stroke-width="3.4" d="M18 14 q56 -12 114 4 q10 78 4 148 q-58 12 -118 -2 q-8 -74 0 -150 z"/>
  <path class="ln" stroke-width="1.8" d="M56 20 q4 74 2 146" opacity="0.4"/>
  <path class="ln" stroke-width="1.8" d="M96 22 q4 72 2 144" opacity="0.35"/>
  <path class="ln" stroke-width="2.2" d="M18 66 q58 12 116 -2" opacity="0.5"/>
</g>
</svg>
