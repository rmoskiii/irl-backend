.vb  { fill: var(--irx-vig-base); }
.vm  { fill: var(--irx-vig-mid); }
.vd  { fill: var(--irx-vig-dark); }
</style></defs><g data-layer="montage"><rect x="0" y="0" width="1600" height="900" fill="var(--irx-vig-dark)" /><g transform="translate(92,140) scale(0.916667)"><g id="vignette">
        
