</g>
</g><rect x="580" y="140" width="440" height="550" fill="none" stroke="var(--irx-vig-light)" stroke-width="3" /><text x="800" y="738" text-anchor="middle" font-family="monospace" font-size="22" letter-spacing="1.6" fill="var(--irx-vig-light)">THE WEEK AFTER</text><g transform="translate(1068,140) scale(0.916667)"><g id="vignette">
